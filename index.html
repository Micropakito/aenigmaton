<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aenigmaton</title>
<meta name="theme-color" content="#2b2620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aenigmaton">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // ESTADÍSTICAS: pon entre las comillas el código de tu cuenta de GoatCounter
  // (si tu panel es https://aenigmaton.goatcounter.com, el código es aenigmaton).
  // Vacío = sin estadísticas.
  window.AENIGMATON_STATS = 'aenigmaton';
</script>

<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2620; --muted:#857a6b; --line:#d9cfbe; --thin:#e4dccd;
  --shade:#2b2620; --shade-ink:#6f675c; --ring:#c2702f; --err:#d2413a; --hint:#e9b949; --ok:#3f8f5a;
  --user:#2f63a8; --done:#efe6d3;
  --btn:#efe6d6; --btn-ink:#2b2620;
  --B:min(94vw,520px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1a17; --card:#26231f; --ink:#efe8dc; --muted:#9c9384; --line:#3d3832; --thin:#36322c;
  --shade:#0d0c0b; --shade-ink:#4f4942; --ring:#e09454; --user:#7fb0f0; --done:#302c26; --btn:#34302a; --btn-ink:#efe8dc}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 3vw calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
header{width:var(--B);display:flex;justify-content:space-between;align-items:center;gap:10px}
header .back{text-decoration:none;color:var(--muted);font-size:1rem;padding:6px 0}
h1{margin:0;font-size:1.6rem;letter-spacing:.02em}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:1.05rem;min-width:3.5em;text-align:right}
button{font:inherit;border:0;border-radius:10px;padding:10px 8px;background:var(--btn);color:var(--btn-ink);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.sizes{width:var(--B);display:flex;gap:6px}
.sizes button{flex:1}
.sizes button.on{background:var(--ink);color:var(--bg)}
.board{width:var(--B);aspect-ratio:1;position:relative;user-select:none;-webkit-user-select:none}
.gen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 75%,transparent);border-radius:12px;font-weight:600;z-index:2}
.board.busy .gen{display:flex}
.msg{min-height:1.4em;text-align:center;color:var(--muted)}
.msg.win{color:var(--ok);font-weight:700;font-size:1.15rem}
.controls{width:var(--B);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts{width:var(--B);display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.opts label{display:flex;gap:6px;align-items:center}
.extra:empty{display:none}
details{width:var(--B);background:var(--card);border-radius:12px;padding:10px 14px;line-height:1.45}
summary{cursor:pointer;font-weight:600}
details ol,details ul{padding-left:1.2em;margin:.5em 0}
@keyframes hint{0%,60%{box-shadow:inset 0 0 0 4px var(--hint)}100%{box-shadow:inset 0 0 0 0 transparent}}

/* Portada */
.home-sub{width:var(--B);color:var(--muted);margin:-6px 0 4px}
.cards{width:var(--B);display:grid;gap:12px}
.gcard{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:14px;text-decoration:none;border:1px solid var(--line)}
.gcard:active{transform:scale(.99)}
.gcard svg{flex:none;width:68px;height:68px}
.gcard h2{margin:0 0 3px;font-size:1.2rem}
.gcard p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.35}
.gcard .stat{margin-top:6px;font-size:.85rem;color:var(--ring)}
.soon{width:var(--B);text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:14px;padding:14px}

/* Hitori */
.board.hi{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px;background:var(--line);padding:3px;border-radius:12px}
.hc{min-width:0;min-height:0;position:relative;background:var(--card);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--B) / var(--n) * .44);font-weight:600;padding:0;color:var(--ink);transition:background .12s}
.hc.s{background:var(--shade);color:var(--shade-ink)}
.hc.c::after{content:"";position:absolute;inset:12%;border:3px solid var(--ring);border-radius:50%}
.hc.e{color:var(--err)}
.hc.s.e{background:#5a1f1c;color:#c98b86}
.hc.c.e::after{border-color:var(--err)}
.hc.h{animation:hint 1.3s ease}
.board.hi.won .hc:not(.s){background:color-mix(in srgb,var(--ok) 18%,var(--card))}

/* Fillomino */
.board.fl{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);background:var(--card);border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none}
.fc{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--B) / var(--n) * .46);
  border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);color:var(--user);font-weight:500;background:var(--card);transition:background .12s}
.fc.r{border-right:3px solid var(--ink)} .fc.b{border-bottom:3px solid var(--ink)}
.fc.k{color:var(--ink);font-weight:800}
.fc.d{background:var(--done)}
.fc.e{color:var(--err)}
.fc.h{animation:hint 1.3s ease}
.board.fl.won .fc:not(.kb){background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.pad{width:var(--B);display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pad button{padding:10px 0;font-weight:700;font-size:1.1rem}
.pad button.on{background:var(--user);color:#fff}
.padhint{width:var(--B);color:var(--muted);font-size:.85rem;text-align:center;margin-top:-6px}

/* Suguru */
.fc .notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;padding:6%;font-size:calc(var(--B) / var(--n) * .2);color:var(--muted);font-weight:600;line-height:1}
.fc .notes span{display:flex;align-items:center;justify-content:center}
.fc.same{background:color-mix(in srgb,var(--user) 14%,var(--card))}
.pad.su{grid-template-columns:repeat(var(--k),1fr)}
.pad button.notes-on{background:var(--ring);color:#fff}

/* Kakuro */
:root{--kb:#3a342c;--kb-ink:#f3ead9}
@media (prefers-color-scheme:dark){:root{--kb:#0f0e0c;--kb-ink:#cfc6b6}}
.fc.kb{position:relative;background:var(--kb);color:var(--kb-ink);font-size:calc(var(--B) / var(--n) * .27);font-weight:700;border-color:var(--kb)}
.fc.kb.diag{background:linear-gradient(to top right,transparent calc(50% - 1px),color-mix(in srgb,var(--kb-ink) 55%,transparent) 50%,transparent calc(50% + 1px)),var(--kb)}
.fc.kb .kd{position:absolute;left:9%;bottom:5%}
.fc.kb .ka{position:absolute;right:9%;top:5%}
.board.ka .fc{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

/* Star Battle */
.board.sb{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none}
.sbc{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:hsl(var(--h) 68% 84%);
  border-right:1px solid rgba(0,0,0,.12);border-bottom:1px solid rgba(0,0,0,.12);color:#2b2620;font-size:calc(var(--B) / var(--n) * .58);line-height:1}
@media (prefers-color-scheme:dark){.sbc{background:hsl(var(--h) 30% 30%);color:#f3ead9;border-color:rgba(255,255,255,.08)}}
.sbc.r{border-right:3px solid var(--ink)} .sbc.b{border-bottom:3px solid var(--ink)}
.sbc .x{font-size:.55em;opacity:.55} .sbc .x.auto{opacity:.25}
.sbc.e{color:var(--err)}
.sbc.h{animation:hint 1.3s ease}
.board.sb.won .sbc{filter:saturate(1.4) brightness(1.05)}
.sizes.modes button{font-weight:600}
.sbopts{width:var(--B);display:flex;justify-content:center;color:var(--muted);font-size:.95rem}
.sbopts label{display:flex;gap:6px;align-items:center}

/* Nurikabe */
.board.nk{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:1px;background:var(--line);border:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none}
.nkc{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);font-weight:800;font-size:calc(var(--B) / var(--n) * .46);transition:background .1s}
.nkc.s{background:#2f5d7c}
@media (prefers-color-scheme:dark){.nkc.s{background:#2c4f69}}
.nkc .dot{width:22%;height:22%;border-radius:50%;background:var(--muted)}
.nkc.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.nkc.e{color:var(--err)} .nkc.s.e{background:#8a2e2a}
.nkc.h{animation:hint 1.3s ease}
.board.nk.won .nkc:not(.s){background:color-mix(in srgb,var(--ok) 22%,var(--card))}

/* Hashi */
.board.hs{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none}
.board.hs svg{width:100%;height:100%;display:block}
.board.hs .gd{fill:var(--line)}
.board.hs .br{stroke:var(--ink);stroke-width:.07;stroke-linecap:round}
.board.hs .br.h{stroke:var(--hint);stroke-width:.12}
.board.hs .is{fill:var(--card);stroke:var(--ink);stroke-width:.06}
.board.hs .is.full{fill:color-mix(in srgb,var(--ok) 30%,var(--card));stroke:var(--ok)}
.board.hs .is.over{stroke:var(--err);fill:color-mix(in srgb,var(--err) 18%,var(--card))}
.board.hs .is.sel{stroke:var(--user);stroke-width:.1}
.board.hs text{fill:var(--ink);font-weight:800;font-size:.46px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.board.hs.won .is{fill:color-mix(in srgb,var(--ok) 35%,var(--card))}

/* Binairo */
.board.bn{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px;background:var(--line);padding:3px;border-radius:12px;touch-action:none}
.bnc{min-width:0;min-height:0;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--card);font-size:calc(var(--B) / var(--n) * .5);font-weight:500;color:var(--ink)}
.bnc.v0{background:#f3d9b8;color:#8a4a12} .bnc.v1{background:#c9dcf2;color:#1f4f86}
@media (prefers-color-scheme:dark){.bnc.v0{background:#5a3d1f;color:#f0c48e}.bnc.v1{background:#24405f;color:#a9cbf2}}
.bnc.k{font-weight:900}
.bnc.k::after{content:"";position:absolute}
.bnc.e{box-shadow:inset 0 0 0 3px var(--err)}
.bnc.h{animation:hint 1.3s ease}
.board.bn.won .bnc{filter:saturate(1.3)}

/* Masyu */
.board.ms{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none}
.board.ms svg{width:100%;height:100%;display:block}
.board.ms .gl{stroke:var(--line);stroke-width:.02}
.board.ms .ln{stroke:var(--user);stroke-width:.16;stroke-linecap:round}
.board.ms .ln.h{stroke:var(--hint)}
.board.ms .xx{stroke:var(--muted);stroke-width:.05;stroke-linecap:round}
.board.ms .cw{fill:var(--card);stroke:var(--ink);stroke-width:.07}
.board.ms .cb{fill:var(--ink);stroke:var(--ink);stroke-width:.07}
.board.ms .cw.e,.board.ms .cb.e{stroke:var(--err);stroke-width:.1}
.board.ms .cb.e{fill:var(--err)}
.board.ms .bad{fill:var(--err)}
.board.ms.won .ln{stroke:var(--ok)}

/* Numbrix */
.board.nx{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none;overflow:hidden}
.board.nx svg{width:100%;height:100%;display:block}
.board.nx .gl{stroke:var(--line);stroke-width:.025}
.board.nx .sel{fill:color-mix(in srgb,var(--user) 18%,transparent)}
.board.nx .hl{fill:color-mix(in srgb,var(--hint) 45%,transparent)}
.board.nx .lk{stroke:color-mix(in srgb,var(--user) 35%,transparent);stroke-width:.09;stroke-linecap:round}
.board.nx text{font-size:.42px;text-anchor:middle;dominant-baseline:central;fill:var(--user);font-weight:500;pointer-events:none}
.board.nx text.k{fill:var(--ink);font-weight:800}
.board.nx text.e{fill:var(--err)}
.board.nx.won .lk{stroke:var(--ok)}
.pad.nx{grid-template-columns:repeat(7,1fr)}
.pad.nx button.dir{font-size:.9rem}

/* Futoshiki */
.board.fu{touch-action:manipulation}
.board.fu svg{width:100%;height:100%;display:block}
.board.fu .cell{fill:var(--card);stroke:var(--ink);stroke-width:.04}
.board.fu .cell.same{fill:color-mix(in srgb,var(--user) 14%,var(--card))}
.board.fu .cell.h{fill:color-mix(in srgb,var(--hint) 45%,var(--card))}
.board.fu .v{font-size:.56px;text-anchor:middle;dominant-baseline:central;fill:var(--user);font-weight:500;pointer-events:none}
.board.fu .v.k{fill:var(--ink);font-weight:800}
.board.fu .v.e{fill:var(--err)}
.board.fu .nt{font-size:.22px;text-anchor:middle;dominant-baseline:central;fill:var(--muted);font-weight:600;pointer-events:none}
.board.fu .sg{font-size:.42px;text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-weight:800;pointer-events:none}
.board.fu .sg.e{fill:var(--err)}
.board.fu.won .cell{fill:color-mix(in srgb,var(--ok) 18%,var(--card))}

/* Desvíos */
.board.tt{touch-action:none}
.board.tt svg{width:100%;height:100%;display:block}
.board.tt .bg{fill:var(--card);stroke:var(--ink);stroke-width:.05}
.board.tt .gl{stroke:var(--line);stroke-width:.025}
.board.tt .sl{stroke-width:.42;stroke-dasharray:.07 .13;fill:none}
.board.tt .rl{stroke-width:.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.board.tt .in{stroke:var(--card);stroke-width:.17;fill:none;stroke-linecap:round;stroke-linejoin:round}
.board.tt .gv{stroke:var(--ink)} .board.tt .us{stroke:var(--user)}
.board.tt .x{stroke:var(--muted);stroke-width:.05;stroke-linecap:round}
.board.tt .cnt{font-size:.44px;text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-weight:800}
.board.tt .cnt.ok{fill:var(--muted);font-weight:500}
.board.tt .cnt.over{fill:var(--err)}
.board.tt .bad{fill:var(--err)}
.board.tt.won .us{stroke:var(--ok)}

/* Historial */
.histlink{width:var(--B);display:flex;justify-content:space-between;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}
.histlink span{color:var(--muted);font-weight:500}
.chips{width:var(--B);display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;font-size:.88rem}
.chips button.on{background:var(--ink);color:var(--bg)}
.hsum{width:var(--B);color:var(--muted);font-size:.9rem}
.hlist{width:var(--B);display:grid;gap:8px}
.hitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hitem b{font-size:1.02rem}
.hitem .hs{color:var(--muted);text-align:right}
.hitem .hd{grid-column:1/-1;color:var(--muted);font-size:.82rem}
.hitem .hm{font-size:.85rem}
.hitem .hm:nth-of-type(5){text-align:right}
.hitem .hm:last-child{grid-column:1/-1}
.hm.warn{color:var(--ring)}
.hstats{width:var(--B);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:var(--card);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.hstats b{font-size:1.25rem}
.hstats span{color:var(--muted);font-size:.8rem}
.controls.two{grid-template-columns:1fr 1fr}

/* Pirámide */
.board.py{aspect-ratio:auto;touch-action:manipulation}
.board.py svg{width:100%;height:auto;display:block}
.board.py .bk{fill:var(--card);stroke:var(--ink);stroke-width:.03}
.board.py .bk.k{fill:color-mix(in srgb,var(--ink) 8%,var(--card))}
.board.py .bk.sel{fill:color-mix(in srgb,var(--user) 20%,var(--card));stroke:var(--user);stroke-width:.05}
.board.py .bk.h{fill:color-mix(in srgb,var(--hint) 45%,var(--card))}
.board.py text{font-size:.3px;text-anchor:middle;dominant-baseline:central;fill:var(--user);font-weight:500;pointer-events:none}
.board.py text.k{fill:var(--ink);font-weight:800}
.board.py text.e{fill:var(--err)}
.board.py.won .bk{fill:color-mix(in srgb,var(--ok) 18%,var(--card))}

/* Turbo Láser */
.board.lr{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none;overflow:hidden}
.board.lr svg{width:100%;height:100%;display:block}
.board.lr .gl{stroke:var(--line);stroke-width:.025}
.board.lr .cv{fill:color-mix(in srgb,var(--user) 12%,transparent)}
.board.lr .ry{stroke:var(--user);stroke-width:.13;stroke-linecap:round}
.board.lr .re{fill:var(--user)}
.board.lr .ry.h{stroke:var(--hint)}
.board.lr .dm{fill:var(--ink)}
.board.lr .dm.ok{fill:var(--muted)}
.board.lr .dm.over{fill:var(--err)}
.board.lr text{font-size:.36px;text-anchor:middle;dominant-baseline:central;fill:var(--card);font-weight:800;pointer-events:none}
.board.lr.won .ry{stroke:var(--ok)} .board.lr.won .re{fill:var(--ok)}

/* LITS */
.board.li{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none;background:var(--card)}
.lic{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--card);border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);font-weight:800;font-size:calc(var(--B) / var(--n) * .34);color:rgba(255,255,255,.85)}
.lic.r{border-right:3px solid var(--ink)} .lic.b{border-bottom:3px solid var(--ink)}
.lic.s{background:#55504a}
.lic.tL{background:#3f6fa8} .lic.tI{background:#3d8a5a} .lic.tT{background:#c0702c} .lic.tS{background:#8a4f9a}
.lic.e{background:var(--err)!important}
.lic .dot{width:20%;height:20%;border-radius:50%;background:var(--muted)}
.lic.h{animation:hint 1.3s ease}

header.brand{flex-direction:column;align-items:flex-start;gap:0}
header.brand h1{font-size:2rem;font-weight:900;letter-spacing:-.01em}
header.brand span{color:var(--muted);font-size:.95rem;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<main id="app"></main>
<script>
(()=>{
/* ================== utilidades comunes ================== */
const U={
  range:n=>[...Array(n).keys()],
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},
  pick:a=>a[Math.random()*a.length|0],
  fmt:s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),
  load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  _geo:{},
  geometry(n){
    if(U._geo[n])return U._geo[n];
    const N=n*n,nb=[],peers=[],nb8=[];
    for(let i=0;i<N;i++){
      const r=i/n|0,c=i%n,o=[];
      if(r>0)o.push(i-n); if(r<n-1)o.push(i+n); if(c>0)o.push(i-1); if(c<n-1)o.push(i+1);
      nb.push(o);
      const p=[]; for(let k=0;k<n;k++){ if(k!==c)p.push(r*n+k); if(k!==r)p.push(k*n+c); }
      peers.push(p);
      const e=[]; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc)continue; const rr=r+dr,cc=c+dc; if(rr>=0&&rr<n&&cc>=0&&cc<n)e.push(rr*n+cc); }
      nb8.push(e);
    }
    return U._geo[n]={n,N,nb,peers,nb8};
  },
  connected(isSh,g){
    let start=-1,total=0;
    for(let i=0;i<g.N;i++) if(!isSh(i)){total++; if(start<0)start=i;}
    if(!total) return false;
    const seen=new Uint8Array(g.N),q=[start]; seen[start]=1; let cnt=1;
    while(q.length){const i=q.pop(); for(const j of g.nb[i]) if(!seen[j]&&!isSh(j)){seen[j]=1;cnt++;q.push(j);}}
    return cnt===total;
  },
  best(id,n,secs){
    const b=U.load('best-'+id)||{};
    if(!b[n]||secs<b[n]){b[n]=secs;U.save('best-'+id,b);return true}
    return false;
  }
};

/* ================== estadísticas anónimas ==================

   window.AENIGMATON_STATS tiene el código de tu cuenta y la página está en http(s). */
const Stats={
  code:(typeof window!=='undefined'&&window.AENIGMATON_STATS)||'',

  init(){
    if(!this.code||!/^https?:/.test(location.protocol))return;
    window.goatcounter={no_onload:true};
    const sc=document.createElement('script'); sc.async=true; sc.src='https://gc.zgo.at/count.js';
    sc.dataset.goatcounter='https://'+this.code+'.goatcounter.com/count';
    sc.onload=()=>{ this.ready=true; this.queue.splice(0).forEach(a=>this.send(a)); };
    document.head.appendChild(sc);
  },

/* ================== HITORI ================== */
(()=>{
  function latin(n){
    const rows=U.shuffle(U.range(n)),cols=U.shuffle(U.range(n)),sym=U.shuffle(U.range(n)),g=[];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)g.push(sym[(rows[r]+cols[c])%n]+1);
    return g;
  }
  function build(gm){
    const {N}=gm, g=latin(gm.n), sh=new Array(N).fill(false);
    const target=Math.round(N*(0.27+Math.random()*0.07)); let k=0;
    for(const i of U.shuffle(U.range(N))){
      if(k>=target)break;
      if(gm.nb[i].some(j=>sh[j]))continue;
      sh[i]=true;
      if(!U.connected(j=>sh[j],gm)){sh[i]=false;continue;}
      k++;
    }
    for(let i=0;i<N;i++) if(sh[i]) g[i]=U.pick(gm.peers[i].filter(j=>!sh[j]).map(j=>g[j]));
    return g;
  }
  function solve(g,gm,limit){
    const {N,nb,peers}=gm, sols=[];
    const st0=new Array(N).fill(0);
    for(let i=0;i<N;i++) if(!peers[i].some(j=>g[j]===g[i])) st0[i]=1;
    function prop(st){
      let ch=true;
      while(ch){
        ch=false;
        for(let i=0;i<N;i++){
          if(st[i]===2){ for(const j of nb[i]){ if(st[j]===2)return false; if(st[j]===0){st[j]=1;ch=true;} } }
          else if(st[i]===1){ for(const j of peers[i]) if(g[j]===g[i]){ if(st[j]===1)return false; if(st[j]===0){st[j]=2;ch=true;} } }
        }
      }
      return U.connected(j=>st[j]===2,gm);
    }
    (function rec(st){
      if(sols.length>=limit||!prop(st))return;
      const i=st.indexOf(0);
      if(i<0){sols.push(st.slice());return;}
      const a=st.slice();a[i]=2;rec(a);
      const b=st.slice();b[i]=1;rec(b);
    })(st0);
    return sols;
  }
  function errors(S,gm){
    const e=new Set(),st=S.st,g=S.puz.g;
    for(let i=0;i<gm.N;i++){
      if(st[i]===1){ for(const j of gm.nb[i]) if(st[j]===1){e.add(i);e.add(j);} }
      else if(st[i]===2){ for(const j of gm.peers[i]) if(st[j]===2&&g[j]===g[i]){e.add(i);e.add(j);} }
    }
    return e;
  }
  register({
    id:'hitori', name:'Hitori',
    desc:'Tacha casillas para que no se repita ningún número en filas ni columnas.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--line)"/>${[0,1,2].map(r=>[0,1,2].map(c=>{const s=(r===0&&c===1)||(r===1&&c===2)||(r===2&&c===0);return `<rect x="${4+c*21}" y="${4+r*21}" width="18" height="18" rx="3" fill="${s?'var(--shade)':'var(--card)'}"/><text x="${13+c*21}" y="${18+r*21}" font-size="12" font-weight="700" text-anchor="middle" fill="${s?'var(--shade-ink)':'var(--ink)'}">${[[1,2,3],[3,1,2],[2,3,1]][r][c]}</text>`}).join('')).join('')}<circle cx="34" cy="34" r="8" fill="none" stroke="var(--ring)" stroke-width="2"/></svg>`,
    sizes:[5,6,7,8,10], defaultSize:6,
    rules:`<ol>
      <li>En cada fila y columna no puede quedar ningún número repetido entre las casillas sin tachar.</li>
      <li>Dos casillas tachadas no pueden tocarse por un lado (en diagonal sí).</li>
      <li>Todas las casillas sin tachar deben formar un único bloque conectado.</li></ol>
      <ul><li>Toca una casilla: <b>tachar</b> → <b>círculo</b> (seguro que es blanca) → vacía.</li>
      <li>La pista corrige primero una casilla equivocada; si no hay, revela una nueva.</li></ul>`,
    generate(n){
      const gm=U.geometry(n), t0=performance.now(); let fb=null;
      while(true){
        const g=build(gm), s=solve(g,gm,2);
        if(s.length===1) return {g,sol:s[0]};
        if(s.length&&!fb) fb={g,sol:s[0]};
        if(performance.now()-t0>2500&&fb) return fb;
      }
    },
    init:(puz,n)=>new Array(n*n).fill(0),   // 0 vacía, 1 tachada, 2 círculo
    solved(S){
      const gm=U.geometry(S.n), sh=i=>S.st[i]===1;

      }

    },
    render(board,S,api,flash){

        c.textContent=S.puz.g[i];

      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta casilla estaba mal'}; }
      const open=U.range(N).filter(j=>S.st[j]===0);
      if(!open.length) return null;
      const toShade=open.filter(j=>sol[j]===2);
      const i=U.pick(toShade.length?toShade:open);
      S.st[i]=sol[i]===2?1:2;
      return {i,msg:sol[i]===2?'Esta hay que tacharla':'Esta queda blanca'};
    }
  });
})();

/* ================== FILLOMINO ================== */
(()=>{
  const W=[0,10,22,26,20,14,8]; // probabilidad de tamaños 1..6
  function pickSize(){let r=Math.random()*100;for(let k=1;k<W.length;k++){r-=W[k];if(r<=0)return k}return 3}
  function partition(gm){
    const {N,nb}=gm, reg=new Int32Array(N).fill(-1), regions=[];
    const free=i=>nb[i].reduce((a,j)=>a+(reg[j]<0),0);
    const frontier=cells=>{const f=[];for(const c of cells)for(const j of nb[c])if(reg[j]<0&&!f.includes(j))f.push(j);return f};
    const clash=(cells,id)=>{const k=cells.length;for(const c of cells)for(const j of nb[c]){const r=reg[j];if(r>=0&&r!==id&&regions[r].length===k)return true}return false};
    let left=N;
    while(left){
      // semilla: la casilla libre más encajonada (evita dejar huecos sueltos)
      let best=[],bf=9;
      for(let i=0;i<N;i++) if(reg[i]<0){const f=free(i);if(f<bf){bf=f;best=[i]}else if(f===bf)best.push(i)}
      const s=U.pick(best), id=regions.length, cells=[s]; reg[s]=id;
      const target=pickSize();
      while(cells.length<target){ const f=frontier(cells); if(!f.length)break; const j=U.pick(f); reg[j]=id; cells.push(j); }
      // si choca con una región vecina del mismo tamaño, crece un poco más
      while(clash(cells,id)){
        const f=frontier(cells);
        if(!f.length||cells.length>=9) return null;
        const j=U.pick(f); reg[j]=id; cells.push(j);
      }
      regions.push(cells); left-=cells.length;
    }
    const val=new Array(N);
    regions.forEach(r=>r.forEach(c=>val[c]=r.length));
    for(let i=0;i<N;i++) for(const j of nb[i]) if(reg[i]!==reg[j]&&val[i]===val[j]) return null;
    return val;
  }
  // ¿La región que contiene i es válida (no se pasa y aún puede completarse)?
  function checker(gm){
    const {N,nb}=gm, mark=new Int32Array(N), buf=new Int32Array(N), stack=new Int32Array(N); let stamp=0;
    return function(v,i){
      const x=v[i]; stamp++; let n=0; buf[n++]=i; mark[i]=stamp;
      for(let k=0;k<n;k++){const a=buf[k]; for(const j of nb[a]) if(mark[j]!==stamp&&v[j]===x){mark[j]=stamp;buf[n++]=j}}
      if(n>x) return false; if(n===x) return true;
      let cnt=n, sp=0; for(let k=0;k<n;k++) stack[sp++]=buf[k];
      while(sp&&cnt<x){const a=stack[--sp]; for(const j of nb[a]) if(mark[j]!==stamp&&(v[j]===0||v[j]===x)){mark[j]=stamp;stack[sp++]=j;cnt++}}
      return cnt>=x;
    };
  }
  function solve(clue,gm,limit,maxNodes){
    const {N,nb}=gm, check=checker(gm), v=Array.from(clue), sols=[]; let nodes=0, aborted=false;
    for(let i=0;i<N;i++) if(v[i]&&!check(v,i)) return {sols,aborted};
    function valid(i,x){
      v[i]=x; let ok=check(v,i);
      if(ok) for(const j of nb[i]) if(v[j]&&v[j]!==x&&!check(v,j)){ok=false;break}
      v[i]=0; return ok;
    }
    (function rec(){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      let best=-1,bestVals=null;
      for(let i=0;i<N;i++) if(!v[i]){
        const vals=[]; for(let x=1;x<=9;x++) if(valid(i,x)) vals.push(x);
        if(!vals.length) return;
        if(!bestVals||vals.length<bestVals.length){best=i;bestVals=vals; if(vals.length===1)break}
      }
      if(best<0){ for(let i=0;i<N;i++) if(!check(v,i)) return; sols.push(v.slice()); return; }
      for(const x of bestVals){ v[best]=x; rec(); v[best]=0; if(sols.length>=limit||aborted)return; }
    })();
    return {sols,aborted};
  }
  function components(v,gm){
    const {N,nb}=gm, id=new Int32Array(N).fill(-1), size=[];
    for(let s=0;s<N;s++){
      if(id[s]>=0||!v[s])continue;
      const k=size.length, q=[s]; id[s]=k; let cnt=0;
      while(q.length){const a=q.pop();cnt++;for(const j of nb[a]) if(id[j]<0&&v[j]===v[s]){id[j]=k;q.push(j)}}
      size.push(cnt);
    }
    return {id,size};
  }
  let tool=1, stroke=null;
  register({
    id:'fillomino', name:'Fillomino',
    desc:'Divide la cuadrícula en regiones: cada región lleva su tamaño en todas sus casillas.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">
      ${[[3,3,1],[3,2,2],[1,3,3]].map((row,r)=>row.map((x,c)=>`<text x="${14+c*20}" y="${19+r*20}">${x}</text>`).join('')).join('')}</g>
      <path d="M4 4h60v60H4z M44 4v20 M4 24h40 M24 24v20 M24 44h40 M64 44 M24 44v20 M4 44h20 M44 24h20" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/></svg>`,
    sizes:[5,6,7,8,10], defaultSize:6,
    rules:`<ol>
      <li>Divide la cuadrícula en regiones (grupos de casillas unidas por los lados).</li>
      <li>Cada casilla lleva el tamaño de su región: una región de 4 casillas tiene un 4 en cada una.</li>
      <li>Dos regiones del mismo tamaño no pueden tocarse por un lado.</li>
      <li>Los números iniciales (en negrita) no cambian. Puede haber regiones sin ningún número inicial.</li></ol>
      <ul><li>Elige un número abajo y <b>toca o arrastra</b> sobre las casillas para pintarlas.</li>
      <li>Tocar una casilla que ya tiene ese número la borra. ⌫ es la goma.</li>
      <li>Las regiones completas se sombrean y se cierran con borde grueso.</li></ul>`,
    generate(n){
      const gm=U.geometry(n); let sol=null;
      while(!sol) sol=partition(gm);
      const clue=sol.slice(), t0=performance.now();
      for(const i of U.shuffle(U.range(gm.N))){
        if(performance.now()-t0>3000)break;
        const keep=clue[i]; clue[i]=0;
        const r=solve(clue,gm,2,2500);
        if(r.aborted||r.sols.length!==1) clue[i]=keep;
      }
      return {clue,sol};
    },
    init:(puz)=>puz.clue.slice(),
    solved(S){
      if(S.st.some(x=>!x))return false;
      const {id,size}=components(S.st,U.geometry(S.n));
      for(let i=0;i<S.st.length;i++) if(size[id[i]]!==S.st[i]) return false;

    },
    render(board,S,api,flash){
      const n=S.n, gm=U.geometry(n), v=S.st, {id,size}=components(v,gm);
      const done=i=>v[i]&&size[id[i]]===v[i];
      let bad=new Set();
      if(S.errs){ const ck=checker(gm); for(let i=0;i<gm.N;i++) if(v[i]&&!ck(v,i)) bad.add(i); }
      const thick=(i,j)=>v[i]!==v[j]&&((v[i]&&v[j])||done(i)||done(j));
      board.className='board fl';
      board.innerHTML='<div class="gen">Generando…</div>';
      for(let i=0;i<gm.N;i++){
        const r=i/n|0,c=i%n, d=document.createElement('div');
        d.dataset.i=i;
        d.className='fc'+(S.puz.clue[i]?' k':'')+(done(i)?' d':'')+(bad.has(i)?' e':'')+(flash===i?' h':'')
          +((c===n-1||thick(i,i+1))?' r':'')+((r===n-1||thick(i,i+n))?' b':'');
        d.textContent=v[i]||'';
        board.appendChild(d);
      }
      const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.fc');return c&&board.contains(c)?+c.dataset.i:-1};
      const paint=i=>{

      };

      board.onpointerup=board.onpointercancel=()=>{ if(!stroke)return; if(!stroke.changed)api.S.undo.pop(); stroke=null; api.commit(); };
    },
    renderExtra(el,S,api){

      for(const x of [1,2,3,4,5,6,7,8,9,0]){
        const b=document.createElement('button'); b.textContent=x||'⌫';
        if(x===tool)b.className='on';
        b.onclick=()=>{tool=x;api.draw();};

      }
      el.appendChild(pad);
    },
    hint(S){
      const sol=S.puz.sol, N=S.n*S.n;
      const wrong=U.range(N).filter(i=>S.st[i]&&S.st[i]!==sol[i]);
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta casilla estaba mal'}; }
      const open=U.range(N).filter(i=>!S.st[i]);

})();


/* ================== SURUGU / SUGURU ================== */
(()=>{
  const SW=[0,3,7,14,32,44]; // probabilidad de tamaños de región 1..5
  function pickSize(){let r=Math.random()*100;for(let k=1;k<SW.length;k++){r-=SW[k];if(r<=0)return k}return 5}
  // Construye regiones y números a la vez, región a región
  function build(gm){
    const {N,nb,nb8}=gm, reg=new Int32Array(N).fill(-1), val=new Int32Array(N), size=[];
    const free=i=>nb[i].reduce((a,j)=>a+(reg[j]<0),0);
    const okv=(i,x)=>nb8[i].every(j=>val[j]!==x);
    let left=N, repairs=0;
    while(left){
      let best=[],bf=9;
      for(let i=0;i<N;i++) if(reg[i]<0){const f=free(i);if(f<bf){bf=f;best=[i]}else if(f===bf)best.push(i)}
      const s=U.pick(best), id=size.length;
      let placed=false;
      for(let att=0;att<30&&!placed;att++){
        const target=pickSize(), cells=[s], inS=new Set(cells);
        while(cells.length<target){
          const f=[]; for(const c of cells) for(const j of nb[c]) if(reg[j]<0&&!inS.has(j)&&!f.includes(j)) f.push(j);
          if(!f.length)break;
          const j=U.pick(f); cells.push(j); inS.add(j);
        }
        if(cells.length===1&&target>1&&att<29) continue; // casilla encajonada: mejor intentar otra cosa
        const k=cells.length, used=new Array(k+1).fill(false);
        const assign=t=>{
          if(t===k)return true;
          for(const x of U.shuffle(U.range(k).map(q=>q+1))){
            if(used[x]||!okv(cells[t],x))continue;
            used[x]=true; val[cells[t]]=x;
            if(assign(t+1))return true;
            used[x]=false; val[cells[t]]=0;
          }
          return false;
        };
        if(assign(0)){ cells.forEach(c=>reg[c]=id); size.push(k); left-=k; placed=true; }
      }
      if(placed)continue;
      // último recurso: unir la casilla a una región vecina con hueco
      const opts=U.shuffle(nb[s].map(j=>reg[j]).filter(r=>r>=0&&size[r]<5));
      const r=opts.find(r=>okv(s,size[r]+1));
      if(r!==undefined){ reg[s]=r; size[r]++; val[s]=size[r]; left--; continue; }
      // reparación: deshace una región vecina y vuelve a intentarlo
      if(++repairs>N*4) return null;
      const near=[...new Set(nb8[s].map(j=>reg[j]).filter(r=>r>=0))];
      const kill=U.pick(near);
      for(let i=0;i<N;i++) if(reg[i]===kill){reg[i]=-1;val[i]=0;left++;}
      size[kill]=0;
    }
    const map={},sz=[];
    const R=Array.from(reg).map(r=>{ if(!(r in map)){map[r]=sz.length;sz.push(size[r]);} return map[r]; });
    return {reg:R,size:sz,sol:Array.from(val)};
  }
  // Rellena/resuelve con búsqueda (casilla con menos candidatos primero)
  function search(puz,gm,given,limit,maxNodes,random){
    const {N,nb8}=gm, {reg,size}=puz, v=Array.from(given), sols=[]; let nodes=0, aborted=false;
    const cells=[]; reg.forEach((r,i)=>(cells[r]=cells[r]||[]).push(i));
    const cand=i=>{
      let m=0; for(let x=1;x<=size[reg[i]];x++) m|=1<<x;
      for(const j of cells[reg[i]]) if(v[j]) m&=~(1<<v[j]);
      for(const j of nb8[i]) if(v[j]) m&=~(1<<v[j]);
      return m;
    };
    for(let i=0;i<N;i++) if(v[i]){ const x=v[i]; v[i]=0; const ok=cand(i)&(1<<x); v[i]=x; if(!ok) return {sols,aborted}; }
    (function rec(){
      if(sols.length>=limit||aborted)return;

/* ================== STAR BATTLE ================== */
(()=>{
  // ---- star battle core ----
  const MASKS={};
  function rowMasks(n,k){const key=n+'_'+k;if(MASKS[key])return MASKS[key];const out=[];
    for(let m=0;m<(1<<n);m++){let c=0,ok=true;for(let b=0;b<n;b++)if(m&(1<<b)){c++;if(m&(1<<(b+1)))ok=false}if(c===k&&ok)out.push(m)}
    return MASKS[key]=out;}
  function placeStars(n,k){
    const masks=rowMasks(n,k), col=new Int8Array(n), rows=[];
    return (function rec(r,prev){
      if(r===n)return true;
      const forb=prev|(prev<<1)|(prev>>1);
      for(const m of U.shuffle(masks.slice())){
        if(m&forb)continue; let ok=true; for(let b=0;b<n;b++) if((m>>b&1)&&col[b]>=k){ok=false;break}
        if(!ok)continue;
        for(let b=0;b<n;b++) if(m>>b&1) col[b]++;
        rows[r]=m; if(rec(r+1,m))return true;
        for(let b=0;b<n;b++) if(m>>b&1) col[b]--;
      }
      return false;

      <li>El resto de casillas es <b>agua</b>, y toda el agua debe formar un único río conectado.</li>
      <li>No puede haber ningún bloque de <b>2×2 de agua</b>.</li></ol>
      <ul><li>Toca una casilla: <b>agua</b> → <b>punto</b> (seguro que es isla) → vacía.</li>
      <li>Arrastra el dedo para pintar varias casillas igual que la primera.</li>
      <li>Las islas completas y cerradas se tiñen de verde.</li>

      };
      board.onpointermove=e=>{
        const g=board._g; if(!g)return; const j=cellAt(e); if(j<0||j===g.last)return;
        g.last=j; const S2=api.S;
        if(!S2.puz.clues[j]&&S2.st[j]!==g.val){S2.st[j]=g.val;api.draw();}
      };

    },
    hint(S){
      const {sol,clues}=S.puz, N=S.n*S.n;

      return {i,msg:sol[i]?'Esta casilla es isla':'Esta casilla es agua'};
    }
  });
})();

(()=>{

      for(const [dr,dc] of [[0,1],[1,0]]){let rr=r+dr,cc=c+dc,cells=[];
        while(rr<n&&cc<n){const j=rr*n+cc;if(isl[j]>=0){if(cells.length)edges.push({a,b:isl[j],cells,h:dr===0});break}cells.push(j);rr+=dr;cc+=dc}}});

    edges.forEach(e=>e.cross=[]);
    Object.values(onCell).forEach(l=>{for(const x of l)for(const y of l)if(x!==y&&edges[x].h!==edges[y].h&&!edges[x].cross.includes(y))edges[x].cross.push(y)});
    return {edges,pos};

    const maxv=k=>{const e=edges[k]; for(const x of e.cross) if(val[x]>0) return 0; return Math.min(2,nums[e.a]-sum[e.a],nums[e.b]-sum[e.b]);};
    const okIsland=a=>{let p=0;for(const k of inc[a]) if(val[k]<0) p+=Math.max(0,maxv(k)); return sum[a]<=nums[a]&&sum[a]+p>=nums[a]};
    const connectedPossible=()=>{const seen=new Uint8Array(I),q=[0];seen[0]=1;let c=1;
      while(q.length){const a=q.pop();for(const k of inc[a]){if(val[k]===0||(val[k]<0&&maxv(k)<=0))continue;const e=edges[k],b=e.a===a?e.b:e.a;if(!seen[b]){seen[b]=1;c++;q.push(b)}}}
      return c===I};

      for(let a=0;a<I;a++) if(!okIsland(a)) return;
      if(!connectedPossible()) return;

        let p=0; for(const k of free) p+=Math.max(0,maxv(k)); const slack=sum[a]+p-nums[a];

      const e=edges[bk], mv=Math.max(0,maxv(bk));

    const first=(Math.random()*N)|0; isl[first]=0; isls.push(first);

      const a=U.pick(U.range(isls.length)), p=isls[a], r=p/n|0, c=p%n, [dr,dc]=U.pick(DIRS);

    }
  }
  
  const sums=S=>{const t=new Array(S.puz.nums.length).fill(0); S.puz.edges.forEach((e,k)=>{t[e.a]+=S.st[k];t[e.b]+=S.st[k];}); return t;};
  register({
    id:'hashi', name:'Hashi',
    desc:'Une las islas con puentes: cada número dice cuántos puentes salen de ella, y todo debe quedar conectado.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g stroke="var(--ink)" stroke-width="2"><path d="M14 14H54"/><path d="M14 12V56M18 14V56" stroke-width="0"/><path d="M12 14V54M16 14V54"/><path d="M54 14V34"/><path d="M16 54H54"/></g>
      ${[[14,14,3],[54,14,2],[54,34,1],[14,54,3],[54,54,1]].map(([x,y,v])=>`<circle cx="${x}" cy="${y}" r="8" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="11" font-weight="800" text-anchor="middle" fill="var(--ink)">${v}</text>`).join('')}</svg>`,
    sizes:[7,8,9,10,12], defaultSize:8,
    rules:`<ol>
      <li>Une las islas con puentes horizontales o verticales.</li>
      <li>El número de cada isla indica cuántos puentes salen de ella.</li>
      <li>Entre dos islas puede haber 1 o 2 puentes como mucho.</li>
      <li>Los puentes no se cruzan ni pasan por encima de otras islas.</li>
      <li>Al final, todas las islas deben quedar conectadas en un solo grupo.</li></ol>
      <ul><li><b>Arrastra</b> desde una isla hacia una vecina: 1 puente → 2 → ninguno.</li>
      <li>También puedes <b>tocar un puente</b> para cambiarlo.</li>

    generate(n){ const g=generateH(n); return {pos:g.pos,nums:g.nums,edges:g.edges,sol:g.sol}; },
    init:(puz)=>new Array(puz.edges.length).fill(0),

      return {i:k,msg:sol[k]===2?'Aquí van dos puentes':'Aquí va un puente'};
    }
  });
})();


/* ================== BINAIRO ================== */
(()=>{
  // ---- binairo core ----
  const LINES={};
  function lines(n){ if(LINES[n])return LINES[n]; const L=[];
    for(let r=0;r<n;r++)L.push({t:0,cells:U.range(n).map(c=>r*n+c)});
    for(let c=0;c<n;c++)L.push({t:1,cells:U.range(n).map(r=>r*n+c)});
    return LINES[n]=L; }
  function propagate(v,n){ // v: Int8Array con -1 vacía; devuelve false si hay contradicción
    const L=lines(n), h=n/2; let ch=true;
    while(ch){ ch=false;
      for(const ln of L){ const cs=ln.cells; let z=0,o=0;
        for(const i of cs){ if(v[i]===0)z++; else if(v[i]===1)o++; }
        if(z>h||o>h) return false;
        if((z===h||o===h)&&z+o<n){ const f=z===h?1:0; for(const i of cs) if(v[i]<0){v[i]=f;ch=true} continue; }
        for(let k=0;k+2<n;k++){ const a=v[cs[k]],b=v[cs[k+1]],c=v[cs[k+2]];
          if(a>=0&&a===b&&b===c) return false;
          if(a>=0&&a===b&&c<0){v[cs[k+2]]=1-a;ch=true}
          else if(b>=0&&b===c&&a<0){v[cs[k]]=1-b;ch=true}
          else if(a>=0&&a===c&&b<0){v[cs[k+1]]=1-a;ch=true}
        }
      }
    }
    // filas/columnas completas no pueden repetirse
    for(const t of [0,1]){ const seen=new Set(); for(const ln of L) if(ln.t===t){ let s=''; for(const i of ln.cells){ if(v[i]<0){s=null;break} s+=v[i]; } if(s!==null){ if(seen.has(s)) return false; seen.add(s); } } }
    return true;
  }
  function solveB(given,n,limit,maxNodes,random){
    const sols=[]; let nodes=0,aborted=false;
    (function rec(v){
      if(sols.length>=limit||aborted)return; if(++nodes>maxNodes){aborted=true;return}
      if(!propagate(v,n))return;
      const i=v.indexOf(-1); if(i<0){sols.push(Array.from(v));return}
      const order=random&&Math.random()<.5?[1,0]:[0,1];
      for(const x of order){ const w=v.slice(); w[i]=x; rec(w); if(sols.length>=limit||aborted)return; }
    })(Int8Array.from(given));
    return {sols,aborted};
  }
  function generateB(n){
    let sol=null; while(!sol){ const r=solveB(new Array(n*n).fill(-1),n,1,5000,true); sol=r.sols[0]; }
    const clue=sol.slice(), t0=Date.now();
    for(const i of U.shuffle(U.range(n*n))){
      if(Date.now()-t0>2500)break;
      const keep=clue[i]; clue[i]=-1;
      const r=solveB(clue,n,2,4000,false);
      if(r.aborted||r.sols.length!==1) clue[i]=keep;
    }
    return {clue,sol};
  }
  
  function conflicts(S){
    const n=S.n, v=S.st, h=n/2, bad=new Set(), L=lines(n);
    for(const ln of L){ const cs=ln.cells;
      const z=cs.filter(i=>v[i]===0).length, o=cs.filter(i=>v[i]===1).length;
      if(z>h) cs.forEach(i=>{if(v[i]===0)bad.add(i)}); if(o>h) cs.forEach(i=>{if(v[i]===1)bad.add(i)});
      for(let k=0;k+2<n;k++){ const a=v[cs[k]]; if(a>=0&&a===v[cs[k+1]]&&a===v[cs[k+2]]) [cs[k],cs[k+1],cs[k+2]].forEach(i=>bad.add(i)); }
    }
    for(const t of [0,1]){ const full=L.filter(l=>l.t===t&&l.cells.every(i=>v[i]>=0));
      for(let a=0;a<full.length;a++)for(let b=a+1;b<full.length;b++) if(full[a].cells.every((i,k)=>v[i]===v[full[b].cells[k]])){ full[a].cells.forEach(i=>bad.add(i)); full[b].cells.forEach(i=>bad.add(i)); } }
    return bad;
  }
  register({
    id:'binairo', name:'Binairo',

          const opts=[[1-cx,0],[1-cy,1],[cx,2],[cy,3]].sort((a,b)=>a[0]-b[0]);

    },

      if(!miss.length) return null;
      const e=U.pick(miss); S.st[e]=1;
      return {i:e,msg:'El circuito pasa por aquí'};
    }
  });
})();


/* ================== NUMBRIX ================== */
(()=>{
  // ---- numbrix core ----

  function nbrs(n){ if(NBR[n])return NBR[n]; const o=[]; for(let i=0;i<n*n;i++){const r=i/n|0,c=i%n,a=[];if(r>0)a.push(i-n);if(r<n-1)a.push(i+n);if(c>0)a.push(i-1);if(c<n-1)a.push(i+1);o.push(a)} return NBR[n]=o; }

      if(Math.random()<.5){ path.reverse(); path.forEach((x,k)=>idx[x]=k); }
      const e=path[N-1], x=U.pick(nb[e]); const i=idx[x]; if(i===N-2)continue;
      // invierte path[i+1..N-1]
      let a=i+1,b=N-1; while(a<b){const t=path[a];path[a]=path[b];path[b]=t;idx[path[a]]=a;idx[path[b]]=b;a++;b--;}
    }

    return sol;
  }

    for(let i=0;i<N;i++) if(val[i]) at[val[i]]=i;

    { let g=0; for(let v=N;v>=1;v--){ if(at[v]>=0&&clue[at[v]])g=v; nextGiven[v]=g; } }
    { let g=0; for(let v=1;v<=N;v++){ if(at[v]>=0&&clue[at[v]])g=v; prevGiven[v]=g; } }
    const md=(a,b)=>Math.abs((a/n|0)-(b/n|0))+Math.abs(a%n-b%n);

    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>

      ${[[1,2,3],[6,5,4],[7,8,9]].map((row,r)=>row.map((x,c)=>`<text x="${14+c*20}" y="${18+r*20}">${x}</text>`).join('')).join('')}</g></svg>`,
    sizes:[5,6,7,8,9], defaultSize:6,
    rules:`<ol>
      <li>Rellena la cuadrícula con todos los números del 1 al último (25 en un 5×5, 81 en un 9×9).</li>

      <li>Truco: entre dos pistas, cuenta cuántos pasos faltan; si la distancia coincide justo, el camino es recto.</li></ul>`,
    generate(n){ const g=generateNB(n); return {clue:g.clue,sol:g.sol}; },
    init:(puz)=>puz.clue.slice(),
    solved(S){

/* ================== FUTOSHIKI ================== */
(()=>{
  // ---- futoshiki core ----
  // rel: lista de {a,b} que significa valor(a) < valor(b)
  function solveF(n,clue,rel,limit,maxNodes,random){
    const N=n*n, FULL=((1<<n)-1)<<1, sols=[]; let nodes=0,aborted=false;
    const pc=m=>{let c=0;for(;m;m&=m-1)c++;return c}, lo=m=>31-Math.clz32(m&-m), hi=m=>31-Math.clz32(m);
    const peers=[]; for(let i=0;i<N;i++){const r=i/n|0,c=i%n,p=[];for(let k=0;k<n;k++){if(k!==c)p.push(r*n+k);if(k!==r)p.push(k*n+c)}peers.push(p)}
    const units=[]; for(let r=0;r<n;r++)units.push(U.range(n).map(c=>r*n+c)); for(let c=0;c<n;c++)units.push(U.range(n).map(r=>r*n+c));
    function prop(m){
      let ch=true;
      while(ch){ ch=false;
        for(let i=0;i<N;i++){ const x=m[i]; if(!x)return false; if(pc(x)===1) for(const j of peers[i]) if(m[j]&x){ m[j]&=~x; if(!m[j])return false; ch=true; } }
        for(const u of units) for(let d=1;d<=n;d++){ const b=1<<d; let cnt=0,last=-1; for(const i of u) if(m[i]&b){cnt++;last=i} if(!cnt)return false; if(cnt===1&&m[last]!==b){m[last]=b;ch=true} }
        for(const {a,b} of rel){
          const ma=m[a], mb=m[b];
          const hb=hi(mb), la=lo(ma);
          const na=ma&((1<<hb)-1), nb=mb&~((1<<(la+1))-1);
          if(!na||!nb)return false;
          if(na!==ma||nb!==mb){m[a]=na;m[b]=nb;ch=true}
        }
      }
      return true;
    }
    const m0=new Int32Array(N); for(let i=0;i<N;i++) m0[i]=clue[i]?1<<clue[i]:FULL;
    (function rec(m){
      if(sols.length>=limit||aborted)return; if(++nodes>maxNodes){aborted=true;return}
      if(!prop(m))return;
      let best=-1,bc=99; for(let i=0;i<N;i++){const c=pc(m[i]); if(c>1&&c<bc){bc=c;best=i}}
      if(best<0){ sols.push(Array.from(m,x=>lo(x))); return; }
      const ds=[]; for(let d=1;d<=n;d++) if(m[best]&(1<<d)) ds.push(d);
      if(random) U.shuffle(ds);
      for(const d of ds){ const c=m.slice(); c[best]=1<<d; rec(c); if(sols.length>=limit||aborted)return; }
    })(m0);
    return {sols,aborted};
  }
  function generateF(n){
    const N=n*n;
    const sol=solveF(n,new Array(N).fill(0),[],1,1e5,true).sols[0];
    // todas las desigualdades entre vecinas
    const all=[]; for(let i=0;i<N;i++){ const r=i/n|0,c=i%n;
      if(c<n-1){ const j=i+1; all.push(sol[i]<sol[j]?{a:i,b:j}:{a:j,b:i}); }
      if(r<n-1){ const j=i+n; all.push(sol[i]<sol[j]?{a:i,b:j}:{a:j,b:i}); } }
    const clue=sol.slice(); let rel=all.slice(); const t0=Date.now();
    for(const i of U.shuffle(U.range(N))){ if(Date.now()-t0>1500)break; const k=clue[i]; clue[i]=0; const r=solveF(n,clue,rel,2,4000,false); if(r.aborted||r.sols.length!==1) clue[i]=k; }
    for(const e of U.shuffle(all.slice())){ if(Date.now()-t0>3000)break; const k=rel.indexOf(e); const tr=rel.filter(x=>x!==e); const r=solveF(n,clue,tr,2,4000,false); if(!r.aborted&&r.sols.length===1) rel=tr; }
    return {clue,sol,rel};
  }
  
  const G=.5;
  function conflicts(S){
    const n=S.n, v=S.st, bad=new Set(), badRel=new Set();
    for(let i=0;i<n*n;i++){ if(v[i]<=0)continue; const r=i/n|0,c=i%n;
      for(let k=0;k<n;k++){ const a=r*n+k,b=k*n+c; if(a!==i&&v[a]===v[i]){bad.add(i);bad.add(a)} if(b!==i&&v[b]===v[i]){bad.add(i);bad.add(b)} } }
    S.puz.rel.forEach((e,k)=>{ const x=v[e.a],y=v[e.b]; if(x>0&&y>0&&!(x<y)){bad.add(e.a);bad.add(e.b);badRel.add(k)} });

  }

  register({
    id:'futoshiki', name:'Futoshiki',
    desc:'Un cuadrado latino con signos de mayor y menor: sin repetir en filas ni columnas y respetando cada desigualdad.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"><rect x="8" y="8" width="20" height="20" rx="3"/><rect x="40" y="8" width="20" height="20" rx="3"/><rect x="8" y="40" width="20" height="20" rx="3"/><rect x="40" y="40" width="20" height="20" rx="3"/></g>
      <g font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)"><text x="18" y="22">1</text><text x="50" y="22">2</text><text x="18" y="54">2</text><text x="50" y="54">1</text>
      <text x="34" y="22">&lt;</text><text x="34" y="54">&gt;</text><text x="18" y="38">∧</text></g></svg>`,
    sizes:[4,5,6,7,8], defaultSize:5,
    rules:`<ol>
      <li>Rellena la cuadrícula con números del 1 al tamaño (del 1 al 5 en un 5×5).</li>
      <li>En cada fila y cada columna aparece cada número exactamente una vez.</li>
      <li>Los signos entre casillas se deben cumplir: <b>&lt;</b> y <b>&gt;</b> en horizontal; <b>∧</b> (la de arriba es menor) y <b>∨</b> (la de arriba es mayor) en vertical.</li></ol>
      <ul><li>Elige un número abajo y toca una casilla. Tocarla con el mismo número la borra; ⌫ es la goma.</li>
      <li>✎ activa las <b>notas</b>. Al colocar un número se borra esa nota en su fila y su columna.</li>
      <li>Truco: una casilla menor que otra nunca puede ser el número más alto; y en una cadena a&lt;b&lt;c, la primera vale como mucho el máximo menos dos.</li></ul>`,
    generate(n){ const g=generateF(n); return {clue:g.clue,sol:g.sol,rel:g.rel}; },
    init:(puz)=>puz.clue.slice(),

})();


/* ================== PIRÁMIDE NUMÉRICA ================== */
(()=>{
  const idx=(r,k)=>r*(r+1)/2+k;

    const v=new Array(n*(n+1)/2).fill(0), top=n<=4?12:9;
    for(let k=0;k<n;k++) v[idx(n-1,k)]=1+(Math.random()*top|0);
    for(let r=n-2;r>=0;r--) for(let k=0;k<=r;k++) v[idx(r,k)]=v[idx(r+1,k)]+v[idx(r+1,k+1)];
    return v;
  }

    const K=known.slice(); let ch=true;

        const a=idx(r,k),b=idx(r+1,k),c=idx(r+1,k+1), s=K[a]+K[b]+K[c];
        if(s===2){ if(!K[a]){K[a]=1;ch=true} else if(!K[b]){K[b]=1;ch=true} else {K[c]=1;ch=true} }
      } }
    return K.every(x=>x);
  }

    id:'piramide', name:'Pirámide numérica',
    desc:'Cada ladrillo es la suma de los dos que tiene debajo. Completa la pirámide sumando y restando.',

      <g font-size="9" font-weight="800" text-anchor="middle" fill="var(--ink)"><text x="34" y="20">12</text><text x="24" y="34">5</text><text x="44" y="34">7</text><text x="14" y="48">2</text><text x="34" y="48">3</text><text x="54" y="48">4</text></g></svg>`,
    sizes:[4,5,6,7], defaultSize:5,
    sizeLabel:s=>s+' pisos',
    rules:`<ol>
      <li>Cada ladrillo vale la <b>suma de los dos ladrillos</b> que tiene justo debajo.</li>
      <li>Rellena todos los ladrillos vacíos.</li></ol>
      <ul><li>Toca un ladrillo y escribe el número con el teclado. ⌫ borra la última cifra.</li>
      <li>Si conoces dos de los tres números de un "triángulo" (un ladrillo y los dos de debajo), sacas el tercero: sumando si falta el de arriba, restando si falta uno de abajo.</li>
      <li>Truco: no hace falta empezar por abajo; busca cualquier triángulo con dos números ya puestos.</li></ul>`,

    init:(puz)=>puz.clue.slice(),

    render(board,S,api,flash){

      if(S.errs) for(let r=0;r<n-1;r++) for(let k=0;k<=r;k++){ const a=idx(r,k),b=idx(r+1,k),c=idx(r+1,k+1); if(v[a]&&v[b]&&v[c]&&v[a]!==v[b]+v[c]){bad.add(a);bad.add(b);bad.add(c);} }
      let h=`<svg viewBox="-.05 -.05 ${n+.1} ${n*H+.1}">`;

    },

      const clr=document.createElement('button'); clr.textContent='Borrar'; clr.style.fontSize='.85rem'; clr.style.gridColumn='span 3'; clr.onclick=()=>put(S2=>{S2.st[sel]=0}); pad.appendChild(clr);
      el.appendChild(pad);
    },
    hint(S){
      const {sol}=S.puz, T=sol.length;
      const wrong=U.range(T).filter(i=>S.st[i]&&S.st[i]!==sol[i]);
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Este ladrillo estaba mal'}; }
      const open=U.range(T).filter(i=>!S.st[i]);
      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=sol[i];
      return {i,msg:'Aquí va un '+sol[i]};
    }
  });
})();


/* ================== TURBO LÁSER ================== */
(()=>{

  function rstep(i,d,n){const r=(i/n|0)+RD[d][0],c=i%n+RD[d][1];return (r<0||c<0||r>=n||c>=n)?-1:r*n+c}

    const sols=[]; let nodes=0,aborted=false; const cov=mk(); const curL=new Array(ids.length);

      if(sols.length>=limit||aborted)return; if(++nodes>maxNodes){aborted=true;return}

    let best=null;
    for(let lay=0;lay<10;lay++){
      var N=n*n, isClue=new Array(N).fill(false), own=new Int32Array(N).fill(-1);
      const nc=Math.round(N*(0.09+Math.random()*0.03));
      // cápsulas al azar sin tocarse en lado
      let placed=0; for(const i of U.shuffle(U.range(N))){ if(placed>=nc)break; if([0,1,2,3].some(d=>{const j=rstep(i,d,n);return j>=0&&isClue[j]}))continue; isClue[i]=true; placed++; }
      const L={}; for(let i=0;i<N;i++) if(isClue[i]) L[i]=[0,0,0,0];

  }
  register({
    id:'turbolaser', name:'Turbo Láser',
    desc:'Cada cápsula lanza rayos rectos que cubren tantas casillas como su número, hasta llenar todo el tablero.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g stroke="var(--user)" stroke-width="3.5" stroke-linecap="round"><path d="M24 24H56M24 24V58"/><path d="M46 46V12"/></g>
      <rect x="16" y="16" width="16" height="16" transform="rotate(45 24 24)" fill="var(--ink)"/><rect x="38" y="38" width="16" height="16" transform="rotate(45 46 46)" fill="var(--ink)"/>
      <g font-size="10" font-weight="800" text-anchor="middle" fill="var(--card)"><text x="24" y="28">5</text><text x="46" y="50">3</text></g></svg>`,
    sizes:[6,7,8,10,12], defaultSize:7,
    rules:`<ol>
      <li>Cada <b>cápsula</b> lanza rayos en línea recta hacia arriba, abajo, izquierda o derecha (en una o varias de esas direcciones).</li>
      <li>El número de la cápsula es el <b>total de casillas</b> que cubren sus rayos (sin contar la suya).</li>
      <li>Los rayos no se cruzan ni pasan por encima de otras cápsulas.</li>
      <li>Al terminar, <b>todas las casillas</b> quedan cubiertas por algún rayo.</li></ol>
      <ul><li><b>Arrastra</b> desde una cápsula en una dirección para lanzar el rayo hasta donde sueltes; arrastra desde el extremo de un rayo para alargarlo o acortarlo.</li>

/* ================== LITS ================== */
(()=>{

  function regionTets(cells,n){ // todas las piezas de 4 dentro de la región (sin O)
    const inR=new Set(cells), res=[], seen=new Set();

      const mark=new Set([s]), cur=[s];
      (function rec(untried){
        const U2=untried.slice();
        while(U2.length){
          const c=U2.pop(); cur.push(c);
          if(cur.length===4){ const k=cur.slice().sort((a,b)=>a-b); const key=k.join(); if(!seen.has(key)){seen.add(key); const t=tetType(k,n); if(t!=='O') res.push({cells:k,t});} }
          else { const added=[]; for(const j of lnb(c,n)) if(inR.has(j)&&!mark.has(j)&&j>s){mark.add(j);added.push(j)} rec(U2.concat(added)); for(const j of added) mark.delete(j); }
          cur.pop();
        }
      })((()=>{const a=[];for(const j of lnb(s,n)) if(inR.has(j)&&j>s){mark.add(j);a.push(j)}return a})());

  }
  const TCACHE=new Map();
  function solveL(n,reg,limit,maxNodes,force){
    const N=n*n, R=Math.max(...reg)+1, cellsOf=Array.from({length:R},()=>[]); reg.forEach((r,i)=>{if(r>=0)cellsOf[r].push(i)});
    const opts=cellsOf.map(c=>{ const k=n+':'+c.join(','); let v=TCACHE.get(k); if(!v){ v=regionTets(c,n); if(TCACHE.size>20000)TCACHE.clear(); TCACHE.set(k,v);} return v; });
    if(force) opts[force.r]=opts[force.r].filter(o=>o.cells.includes(force.cell));
    const shade=new Int8Array(N), typeAt=new Array(N).fill(null), sols=[]; let nodes=0,aborted=false;
    const prep=o=>{ if(o.nb)return; const set=new Set(o.cells); o.set=set; const nb=new Set(); o.cells.forEach(c=>lnb(c,n).forEach(j=>{if(!set.has(j))nb.add(j)})); o.nb=[...nb];
      const bl=new Set(); o.cells.forEach(c=>{const r=c/n|0,cc=c%n; for(const [dr,dc] of [[0,0],[-1,0],[0,-1],[-1,-1]]){const r0=r+dr,c0=cc+dc; if(r0>=0&&c0>=0&&r0<n-1&&c0<n-1) bl.add(r0*n+c0);}}); o.bl=[...bl]; };

      for(const a of o.bl){ const q=[a,a+1,a+n,a+n+1]; if(q.every(x=>shade[x]||o.set.has(x))) return false; }

    };

      if(!left.length){ // conexión final
        const s0=shade.indexOf(1), seen=new Uint8Array(N), q=[s0]; seen[s0]=1; let cnt=1;
        while(q.length){const a=q.pop();for(const b of lnb(a,n)) if(shade[b]&&!seen[b]){seen[b]=1;cnt++;q.push(b)}}
        if(cnt===4*R) sols.push(Array.from(shade)); return;
      }

      let bi=-1,bl=null; const can=new Uint8Array(N);

      // conectividad posible: cada componente sombreada debe poder unirse al resto
      { const pos=i=>shade[i]||can[i]; const s0=shade.indexOf(1);
        if(s0>=0){ const seen=new Uint8Array(N),q=[s0];seen[s0]=1; while(q.length){const a=q.pop();for(const b of lnb(a,n)) if(pos(b)&&!seen[b]){seen[b]=1;q.push(b)}}
          for(let i=0;i<N;i++) if(shade[i]&&!seen[i]) return;

      const rest=left.filter(r=>r!==bi);
      for(const o of bl){
        o.cells.forEach(c=>{shade[c]=1;typeAt[c]=o.t});

        o.cells.forEach(c=>{shade[c]=0;typeAt[c]=null});

      }
    })(U.range(R));
    return {sols,aborted};
  }
  // todas las piezas del tablero
  function allTets(n){ const out=[]; const cells=U.range(n*n); return regionTets(cells,n); }
  const TETS={};
  function buildL(n){
    const N=n*n, T=Math.round(N/5.5), all=TETS[n]||(TETS[n]=allTets(n));
    const shade=new Int8Array(N), typeAt=new Array(N).fill(null), own=new Int32Array(N).fill(-1), pieces=[];
    const fits=o=>{
      if(o.cells.some(c=>shade[c]))return false;
      if(pieces.length&&!o.cells.some(c=>lnb(c,n).some(j=>shade[j])))return false;
      for(const c of o.cells) for(const j of lnb(c,n)) if(typeAt[j]===o.t) return false;
      // no deben tocar otra pieza en más de… (vale) ; evitar 2x2
      o.cells.forEach(c=>shade[c]=1);
      let bad=false; for(let r=0;r<n-1&&!bad;r++)for(let c=0;c<n-1;c++){const a=r*n+c;if(shade[a]&&shade[a+1]&&shade[a+n]&&shade[a+n+1]){bad=true;break}}
      o.cells.forEach(c=>shade[c]=0); return !bad;
    };
    for(let tries=0;pieces.length<T&&tries<T*60;tries++){
      const o=U.pick(all); if(!fits(o))continue;
      o.cells.forEach(c=>{shade[c]=1;typeAt[c]=o.t;own[c]=pieces.length}); pieces.push(o);

    if(pieces.length<T*0.8) return null;

  }
  function connectedWithoutL(reg,n,r,skip){ let s=-1,t=0; for(let i=0;i<reg.length;i++) if(i!==skip&&reg[i]===r){t++;if(s<0)s=i}
    if(!t)return false; const seen=new Uint8Array(reg.length),q=[s];seen[s]=1;let c=1; while(q.length){const a=q.pop();for(const b of lnb(a,n)) if(b!==skip&&!seen[b]&&reg[b]===r){seen[b]=1;c++;q.push(b)}} return c===t; }
  function generateL(n){
    const N=n*n;
    for(let att=0;att<5000;att++){
      const g=buildL(n); if(!g)continue;
      const reg=g.own.slice(); // -1 = sin asignar (fuera de toda región por ahora)
      let fail=false;
      while(reg.includes(-1)){
        // para cada casilla de la frontera, opciones que mantienen la solución única
        let best=null;
        for(let i=0;i<N;i++){ if(reg[i]>=0)continue;
          const qs=[...new Set(lnb(i,n).map(j=>reg[j]).filter(q=>q>=0))]; if(!qs.length)continue;
          const safe=[]; for(const q of qs){ reg[i]=q; const r=solveL(n,reg,1,6000,{r:q,cell:i}); reg[i]=-1; if(!r.aborted&&r.sols.length===0) safe.push(q); }
          if(safe.length&&(!best||safe.length<best.safe.length||(safe.length===best.safe.length&&Math.random()<.3))) best={i,safe};
        }
        if(!best){fail=true;break}
        reg[best.i]=U.pick(best.safe);
      }
      if(!fail) return {reg,sol:g.sol};
    }
    return null;
  }
  
  function analysis(S){
    const n=S.n, N=n*n, {reg}=S.puz, st=S.st, R=Math.max(...reg)+1;
    const cells=Array.from({length:R},()=>[]); for(let i=0;i<N;i++) if(st[i]===1) cells[reg[i]].push(i);
    const typeOf=new Array(N).fill(null), bad=new Set();
    cells.forEach(c=>{ if(c.length>4) c.forEach(i=>bad.add(i)); else if(c.length===4){ const set=new Set(c), q=[c[0]], seen=new Set([c[0]]); while(q.length){const a=q.pop(); for(const b of lnb(a,n)) if(set.has(b)&&!seen.has(b)){seen.add(b);q.push(b)}}
      if(seen.size===4){ const t=tetType(c,n); if(t==='O') c.forEach(i=>bad.add(i)); else c.forEach(i=>typeOf[i]=t); } } });
    for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++){const a=r*n+c; if(st[a]===1&&st[a+1]===1&&st[a+n]===1&&st[a+n+1]===1)[a,a+1,a+n,a+n+1].forEach(i=>bad.add(i));}
    for(let i=0;i<N;i++) if(typeOf[i]) for(const j of lnb(i,n)) if(reg[j]!==reg[i]&&typeOf[j]===typeOf[i]){bad.add(i);bad.add(j)}
    return {cells,typeOf,bad};
  }
  register({
    id:'lits', name:'LITS',
    desc:'Sombrea una pieza de 4 casillas en cada región (L, I, T o S) formando un único bloque, sin cuadrados 2×2.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g><rect x="8" y="8" width="12" height="36" fill="#3d8a5a"/><rect x="20" y="32" width="12" height="12" fill="#3d8a5a"/>
      <rect x="32" y="20" width="12" height="12" fill="#3f6fa8"/><rect x="32" y="32" width="12" height="12" fill="#3f6fa8"/><rect x="44" y="32" width="12" height="12" fill="#3f6fa8"/><rect x="44" y="44" width="12" height="12" fill="#3f6fa8"/></g>
      <path d="M8 8H60V60H8Z M32 8V60 M8 44H32" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>`,
    sizes:[6,7,8], defaultSize:6,
    rules:`<ol>
      <li>En cada región (bordes gruesos) sombrea <b>exactamente 4 casillas</b> unidas por los lados: una pieza con forma de <b>L, I, T o S</b> (girada o en espejo vale; el cuadrado no).</li>
      <li>Todas las casillas sombreadas forman un <b>único bloque</b> conectado.</li>
      <li>No puede haber ningún <b>cuadrado 2×2</b> sombreado.</li>
      <li>Dos piezas <b>iguales</b> de regiones distintas no pueden tocarse por un lado.</li></ol>
      <ul><li>Toca una casilla: <b>sombrear</b> → <b>punto</b> (aquí no) → vacía. Arrastra para pintar varias igual que la primera.</li>
      <li>Cuando una región tiene su pieza completa, se colorea según su forma: L azul, I verde, T naranja, S morada. Así ves enseguida si dos iguales se tocan.</li>
      <li>Truco: en una región de 4 casillas, la pieza es la región entera; y en una región estrecha, busca las casillas por las que pasan todas las piezas posibles.</li></ul>`,
    generate(n){ let g=null; while(!g) g=generateL(n); return {reg:g.reg,sol:g.sol}; },
    init:(puz,n)=>new Array(n*n).fill(0),   // 0 vacía, 1 sombreada, 2 punto

    render(board,S,api,flash){

        const r=i/n|0,c=i%n, d=document.createElement('div'); d.dataset.i=i;
        d.className='lic'+((c===n-1||reg[i]!==reg[i+1])?' r':'')+((r===n-1||reg[i]!==reg[i+n])?' b':'')
          +(st[i]===1?(A.typeOf[i]?' t'+A.typeOf[i]:' s'):'')+(S.errs&&A.bad.has(i)?' e':'')+(flash===i?' h':'');
        if(st[i]===2) d.innerHTML='<span class="dot"></span>';
        else if(st[i]===1&&A.typeOf[i]) d.textContent=A.typeOf[i];
        board.appendChild(d);
      }
      const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.lic');return c&&board.contains(c)?+c.dataset.i:-1};
      board.onclick=null;
      board.onpointerdown=e=>{
        const S2=api.S; if(!S2||S2.won)return; const i=cellAt(e); if(i<0)return;
        e.preventDefault(); try{board.setPointerCapture(e.pointerId)}catch(_){}
        api.pushUndo(); const val=(S2.st[i]+1)%3; S2.st[i]=val; board._g={val,last:i}; api.draw();
      };
      board.onpointermove=e=>{ const g=board._g; if(!g)return; const j=cellAt(e); if(j<0||j===g.last)return; g.last=j; const S2=api.S; if(S2.st[j]!==g.val){S2.st[j]=g.val;api.draw();} };
      board.onpointerup=board.onpointercancel=()=>{ if(!board._g)return; board._g=null; api.commit(); };
    },
    hint(S){
      const {sol}=S.puz, N=S.n*S.n;

      if(wrong.length){ const i=U.pick(wrong); const w=S.st[i]; S.st[i]=0; return {i,msg:w===1?'Esta casilla no va sombreada':'Esta casilla sí va sombreada'}; }
      const open=U.range(N).filter(i=>sol[i]&&S.st[i]!==1);
      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=1;
      return {i,msg:'Esta casilla va sombreada'};
    }
  });
})();

const app=document.getElementById('app');
let cleanup=null;

function home(){
  document.title='Aenigmaton · Juegos de lógica';
  app.innerHTML=`<header class="brand"><h1>Aenigmaton</h1><span>juegos de lógica</span></header>
    <div class="home-sub">Elige un juego. Cada partida es nueva y tiene solución única.</div>
    <a class="histlink" href="#historial">📚 Puzzles resueltos <span>${(U.load('historial')||[]).length}</span></a>
    <div class="cards"></div>
    <div class="soon">Más juegos próximamente…</div>`;
  const cards=app.querySelector('.cards');
  for(const G of GAMES){
    const S=U.load('game-'+G.id), b=U.load('best-'+G.id)||{};
    let stat='';
    const lab=k=>{ const [m,n]=String(k).includes('-')?String(k).split('-'):[null,k]; const md=m&&G.modes&&G.modes.find(x=>x.id===m); return (md?md.short+' ':'')+(G.sizeLabel?G.sizeLabel(+n):n+'×'+n); };
    if(S&&S.puz&&!S.won) stat=`En curso: ${lab((S.mode?S.mode+'-':'')+S.n)} · ${U.fmt(S.elapsed||0)}`;
    const bests=Object.keys(b).sort().map(k=>`${lab(k)} ${U.fmt(b[k])}`).join(' · ');
    if(bests) stat+=(stat?'<br>':'')+'Mejores: '+bests;
    const a=document.createElement('a'); a.className='gcard'; a.href='#'+G.id;
    a.innerHTML=`${G.icon}<div><h2>${G.name}</h2><p>${G.desc}</p>${stat?`<div class="stat">${stat}</div>`:''}</div>`;
    cards.appendChild(a);
  }
}

function mountGame(G){
  document.title=G.name+' · Aenigmaton';
  app.innerHTML=`<header><a class="back" href="#">← Juegos</a><h1>${G.name}</h1><div class="timer">0:00</div></header>
    ${G.modes?'<div class="sizes modes"></div>':''}
    <div class="sizes main"></div>
    <div class="board busy"><div class="gen">Generando…</div></div>
    <div class="msg"></div>
    <div class="extra"></div>
    <div class="controls"><button data-a="undo">↶ Deshacer</button><button data-a="hint">💡 Pista</button><button data-a="reset">Reiniciar</button><button data-a="new">Nuevo</button></div>
    <div class="opts"><label><input type="checkbox" class="errs"> Marcar errores</label><span class="hints"></span></div>
    <details><summary>Reglas y controles</summary>${G.rules}</details>`;
  const q=s=>app.querySelector(s), board=q('.board'), msg=q('.msg'), timer=q('.timer');
  let S=U.load('game-'+G.id);
  const modeOf=id=>G.modes&&(G.modes.find(m=>m.id===id)||G.modes[0]);
  const sizesOf=id=>G.modes?modeOf(id).sizes:G.sizes;
  if(!S||!S.puz||(G.modes&&!G.modes.some(m=>m.id===S.mode))||!sizesOf(S.mode).includes(S.n)) S=null;
  let mode=S?S.mode:(G.modes?G.modes[0].id:null);
  let busy=false, msgT=null, keepMsg=false;
  const save=()=>{ if(S) U.save('game-'+G.id,S); };
  const api={
    get S(){return S},
    pushUndo(){S.undo.push(S.st.slice()); if(S.undo.length>300)S.undo.shift();},
    commit(flash){
      S.won=G.solved(S);
      if(S.won&&!S.recorded){S.recorded=true;S.record=U.best(G.id,(S.mode?S.mode+'-':'')+S.n,S.elapsed);
        const H=U.load('historial')||[];
        H.unshift({id:G.id,mode:S.mode,n:S.n,puz:S.puz,st:S.st.slice(),elapsed:S.elapsed,hints:S.hints||0,errsUsed:!!(S.errsUsed||S.errs),date:new Date().toISOString(),record:S.record});
        while(H.length>400) H.pop();
        U.save('historial',H);
        Stats.track('resuelto-'+G.id+'-'+(S.mode?S.mode+'-':'')+S.n, 'Resuelto '+G.name+' '+S.n+(S.hints?' (con pistas)':''), true);}
      draw(flash); save();
    },
    draw:()=>draw(),
    say:t=>setMsg(t)
  };
  function sizes(){
    if(G.modes){
      const me=q('.modes'); me.innerHTML='';
      for(const m of G.modes){
        const b=document.createElement('button'); b.textContent=m.label;
        if(m.id===mode)b.className='on';
        b.onclick=()=>{ if(busy)return; mode=m.id; newGame(m.defaultSize); };
        me.appendChild(b);
      }
    }
    const el=q('.sizes.main'); el.innerHTML='';
    for(const s of sizesOf(mode)){
      const b=document.createElement('button'); b.textContent=G.sizeLabel?G.sizeLabel(s):s+'×'+s;
      if(S&&s===S.n&&S.mode===(mode||undefined))b.className='on';
      b.onclick=()=>newGame(s); el.appendChild(b);
    }
  }
  function draw(flash){
    if(!S)return;
    board.style.setProperty('--n',S.n);
    G.render(board,S,api,flash);
    board.classList.toggle('won',!!S.won);
    board.classList.toggle('busy',busy);
    if(G.renderExtra) G.renderExtra(q('.extra'),S,api);
    q('.hints').textContent='Pistas: '+S.hints;
    q('.errs').checked=!!S.errs;
    timer.textContent=U.fmt(S.elapsed);
    if(S.won){msg.className='msg win';msg.textContent='¡Resuelto en '+U.fmt(S.elapsed)+(S.hints?' con '+S.hints+' pista'+(S.hints>1?'s':''):'')+'!'+(S.record?' Nuevo récord 🏆':' 🎉');}
    else if(!keepMsg){msg.className='msg';msg.textContent='';}
  }
  function setMsg(t){
    msg.className='msg'; msg.textContent=t; keepMsg=true; clearTimeout(msgT);
    msgT=setTimeout(()=>{keepMsg=false; if(S&&!S.won)msg.textContent='';},2200);
  }
  function newGame(n){
    busy=true; board.classList.add('busy');
    keepMsg=false; clearTimeout(msgT); msg.className='msg'; msg.textContent='';
    setTimeout(()=>{
      const puz=G.generate(n,mode);
      S={n,puz,st:G.init(puz,n),undo:[],elapsed:0,won:false,hints:0,errs:S?S.errs:false};
      S.errsUsed=S.errs;
      if(mode)S.mode=mode;
      Stats.track('nuevo-'+G.id+'-'+(mode?mode+'-':'')+n, 'Nuevo '+G.name+' '+n, true);
      busy=false; sizes(); draw(); save();
    },30);
  }
  q('.controls').onclick=e=>{
    const a=e.target.closest('button'); if(!a||!S||busy)return;
    const act=a.dataset.a;
    if(act==='new') return newGame(S.n);
    if(act==='undo'){ if(!S.undo.length)return; S.st=S.undo.pop(); S.won=false; S.recorded=S.recorded; api.commit(); }
    if(act==='reset'){ const fresh=G.init(S.puz,S.n); if(S.st.every((x,i)=>x===fresh[i]))return; api.pushUndo(); S.st=fresh; api.commit(); }
    if(act==='hint'){ if(S.won)return; api.pushUndo(); const r=G.hint(S); if(!r){S.undo.pop();return;} S.hints++; api.commit(r.i); if(!S.won) setMsg(r.msg); }
  };
  q('.errs').onchange=e=>{ if(!S)return; S.errs=e.target.checked; if(S.errs&&!S.won) S.errsUsed=true; draw(); save(); };
  const iv=setInterval(()=>{
    if(S&&!S.won&&!busy&&!document.hidden){ S.elapsed++; timer.textContent=U.fmt(S.elapsed); if(S.elapsed%5===0)save(); }
  },1000);
  if(S){ sizes(); draw(); } else { sizes(); newGame(G.modes?modeOf(mode).defaultSize:G.defaultSize); }
  return ()=>{ clearInterval(iv); clearTimeout(msgT); save(); };
}


function historial(){
  document.title='Resueltos · Aenigmaton';
  const H=U.load('historial')||[];
  let filtro=null, abierto=null;
  const nameOf=id=>(GAMES.find(g=>g.id===id)||{name:id}).name;
  const sizeLab=e=>{ const G=GAMES.find(g=>g.id===e.id); const md=e.mode&&G&&G.modes&&G.modes.find(m=>m.id===e.mode); return (md?md.short+' ':'')+(G&&G.sizeLabel?G.sizeLabel(e.n):e.n+'×'+e.n); };
  const fecha=d=>{ const x=new Date(d); return x.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' · '+x.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); };
  function lista(){
    abierto=null;
    const ids=[...new Set(H.map(e=>e.id))];
    const L=filtro?H.filter(e=>e.id===filtro):H;
    const limpias=L.filter(e=>!e.hints&&!e.errsUsed).length;
    app.innerHTML=`<header><a class="back" href="#">← Juegos</a><h1>Resueltos</h1><div class="timer">${L.length}</div></header>
      ${H.length?`<div class="chips"><button data-f="" class="${filtro?'':'on'}">Todos</button>${ids.map(id=>`<button data-f="${id}" class="${filtro===id?'on':''}">${nameOf(id)}</button>`).join('')}</div>
      <div class="hsum">${L.length} resuelto${L.length===1?'':'s'} · ${limpias} sin pistas ni ayuda de errores${L.length?` · tiempo medio ${U.fmt(Math.round(L.reduce((a,e)=>a+e.elapsed,0)/L.length))}`:''}</div>
      <div class="hlist">${L.map(e=>`<button class="hitem" data-k="${H.indexOf(e)}">
        <b>${nameOf(e.id)}</b><span class="hs">${sizeLab(e)}</span><span class="hd">${fecha(e.date)}</span>
        <span class="hm">⏱ ${U.fmt(e.elapsed)}${e.record?' 🏆':''}</span><span class="hm ${e.hints?'warn':''}">💡 ${e.hints}</span><span class="hm ${e.errsUsed?'warn':''}">${e.errsUsed?'⚠ errores marcados':'✓ sin marcar errores'}</span></button>`).join('')}</div>`
      :'<div class="soon">Todavía no has resuelto ningún puzzle. Cuando termines uno aparecerá aquí.</div>'}`;
    app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{filtro=b.dataset.f||null;lista();});
    app.querySelectorAll('.hitem').forEach(b=>b.onclick=()=>detalle(+b.dataset.k));
  }
  function detalle(k){
    const e=H[k], G=GAMES.find(g=>g.id===e.id); if(!G)return;
    app.innerHTML=`<header><a class="back" href="#historial">← Resueltos</a><h1>${G.name}</h1><div class="timer">${sizeLab(e)}</div></header>
      <div class="hsum">${fecha(e.date)}</div>
      <div class="board"></div>
      <div class="hstats"><div><b>${U.fmt(e.elapsed)}</b><span>tiempo${e.record?' · récord 🏆':''}</span></div><div><b>${e.hints}</b><span>pista${e.hints===1?'':'s'}</span></div><div><b>${e.errsUsed?'Sí':'No'}</b><span>marcar errores</span></div></div>
      <div class="controls two"><button data-a="again">↻ Volver a jugarlo</button><button data-a="del">🗑 Borrar del historial</button></div>`;
    const board=app.querySelector('.board');
    const S={n:e.n,mode:e.mode,puz:e.puz,st:e.st.slice(),undo:[],won:true,errs:false,hints:e.hints};
    const api={get S(){return S},pushUndo(){},commit(){},draw(){},say(){}};
    board.style.setProperty('--n',e.n);
    try{ G.render(board,S,api); }catch(err){ board.textContent='No se puede mostrar este puzzle.'; }
    board.classList.add('won'); board.style.pointerEvents='none';
    app.querySelector('[data-a=again]').onclick=()=>{
      U.save('game-'+G.id,{n:e.n,mode:e.mode,puz:e.puz,st:G.init(e.puz,e.n),undo:[],elapsed:0,won:false,hints:0,errs:false,errsUsed:false});
      location.hash='#'+G.id;
    };
    const del=app.querySelector('[data-a=del]');
    del.onclick=()=>{ if(del.dataset.sure){ H.splice(k,1); U.save('historial',H); lista(); history.replaceState(null,'','#historial'); } else { del.dataset.sure=1; del.textContent='¿Seguro? Toca otra vez'; } };
  }
  lista();
}


// migración: el juego "lanzarrayos" ahora se llama "turbolaser"
try{ for(const k of ['game-','best-']){ const v=localStorage.getItem(k+'lanzarrayos'); if(v!==null){ if(localStorage.getItem(k+'turbolaser')===null) localStorage.setItem(k+'turbolaser',v); localStorage.removeItem(k+'lanzarrayos'); } }
  const H=U.load('historial'); if(H&&H.some(e=>e.id==='lanzarrayos')){ H.forEach(e=>{if(e.id==='lanzarrayos')e.id='turbolaser'}); U.save('historial',H); }
  if(location.hash==='#lanzarrayos') history.replaceState(null,'','#turbolaser'); }catch(e){}

function route(){
  if(cleanup){cleanup();cleanup=null;}
  const id=location.hash.slice(1), G=GAMES.find(g=>g.id===id);
  if(G) cleanup=mountGame(G); else if(id==='historial') historial(); else home();
  Stats.track(G?'/'+G.id:(id==='historial'?'/resueltos':'/'), G?G.name:(id==='historial'?'Resueltos':'Portada'));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',()=>{ if(cleanup)cleanup(); });
route();
})();
</script>

  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
