<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aenigmaton</title>
<meta name="theme-color" content="#2b2620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aenigmaton">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // ESTADÍSTICAS: pon entre las comillas el código de tu cuenta de GoatCounter
  // (si tu panel es https://aenigmaton.goatcounter.com, el código es aenigmaton).
  // Vacío = sin estadísticas.
  window.AENIGMATON_STATS = 'aenigmaton';
</script>

<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2620; --muted:#857a6b; --line:#d9cfbe; --thin:#e4dccd;
  --shade:#2b2620; --shade-ink:#6f675c; --ring:#c2702f; --err:#d2413a; --hint:#e9b949; --ok:#3f8f5a;
  --user:#2f63a8; --done:#efe6d3;
  --btn:#efe6d6; --btn-ink:#2b2620;
  --B:min(94vw,520px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1a17; --card:#26231f; --ink:#efe8dc; --muted:#9c9384; --line:#3d3832; --thin:#36322c;
  --shade:#0d0c0b; --shade-ink:#4f4942; --ring:#e09454; --user:#7fb0f0; --done:#302c26; --btn:#34302a; --btn-ink:#efe8dc}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 3vw calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
header{width:var(--B);display:flex;justify-content:space-between;align-items:center;gap:10px}
header .back{text-decoration:none;color:var(--muted);font-size:1rem;padding:6px 0}
h1{margin:0;font-size:1.6rem;letter-spacing:.02em}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:1.05rem;min-width:3.5em;text-align:right}
button{font:inherit;border:0;border-radius:10px;padding:10px 8px;background:var(--btn);color:var(--btn-ink);cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.sizes{width:var(--B);display:flex;gap:6px}
.sizes button{flex:1}
.sizes button.on{background:var(--ink);color:var(--bg)}
.board{width:var(--B);aspect-ratio:1;position:relative;user-select:none;-webkit-user-select:none}
.gen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 75%,transparent);border-radius:12px;font-weight:600;z-index:2}
.board.busy .gen{display:flex}
.msg{min-height:1.4em;text-align:center;color:var(--muted)}
.msg.win{color:var(--ok);font-weight:700;font-size:1.15rem}
.controls{width:var(--B);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts{width:var(--B);display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.opts label{display:flex;gap:6px;align-items:center}
.extra:empty{display:none}
details{width:var(--B);background:var(--card);border-radius:12px;padding:10px 14px;line-height:1.45}
summary{cursor:pointer;font-weight:600}
details ol,details ul{padding-left:1.2em;margin:.5em 0}
@keyframes hint{0%,60%{box-shadow:inset 0 0 0 4px var(--hint)}100%{box-shadow:inset 0 0 0 0 transparent}}

/* Portada */
.home-sub{width:var(--B);color:var(--muted);margin:-6px 0 4px}
.cards{width:var(--B);display:grid;gap:12px}
.gcard{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:14px;text-decoration:none;border:1px solid var(--line)}
.gcard:active{transform:scale(.99)}
.gcard svg{flex:none;width:68px;height:68px}
.gcard h2{margin:0 0 3px;font-size:1.2rem}
.gcard p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.35}
.gcard .stat{margin-top:6px;font-size:.85rem;color:var(--ring)}
.soon{width:var(--B);text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:14px;padding:14px}

/* Hitori */
.board.hi{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px;background:var(--line);padding:3px;border-radius:12px}
.hc{min-width:0;min-height:0;position:relative;background:var(--card);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--B) / var(--n) * .44);font-weight:600;padding:0;color:var(--ink);transition:background .12s}
.hc.s{background:var(--shade);color:var(--shade-ink)}
.hc.c::after{content:"";position:absolute;inset:12%;border:3px solid var(--ring);border-radius:50%}
.hc.e{color:var(--err)}
.hc.s.e{background:#5a1f1c;color:#c98b86}
.hc.c.e::after{border-color:var(--err)}
.hc.h{animation:hint 1.3s ease}
.board.hi.won .hc:not(.s){background:color-mix(in srgb,var(--ok) 18%,var(--card))}

/* Fillomino */
.board.fl{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);background:var(--card);border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none}
.fc{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:calc(var(--B) / var(--n) * .46);
  border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);color:var(--user);font-weight:500;background:var(--card);transition:background .12s}
.fc.r{border-right:3px solid var(--ink)} .fc.b{border-bottom:3px solid var(--ink)}
.fc.k{color:var(--ink);font-weight:800}
.fc.d{background:var(--done)}
.fc.e{color:var(--err)}
.fc.h{animation:hint 1.3s ease}
.board.fl.won .fc:not(.kb){background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.pad{width:var(--B);display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pad button{padding:10px 0;font-weight:700;font-size:1.1rem}
.pad button.on{background:var(--user);color:#fff}
.padhint{width:var(--B);color:var(--muted);font-size:.85rem;text-align:center;margin-top:-6px}

/* Suguru */
.fc .notes{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;padding:6%;font-size:calc(var(--B) / var(--n) * .2);color:var(--muted);font-weight:600;line-height:1}
.fc .notes span{display:flex;align-items:center;justify-content:center}
.fc.same{background:color-mix(in srgb,var(--user) 14%,var(--card))}
.pad.su{grid-template-columns:repeat(var(--k),1fr)}
.pad button.notes-on{background:var(--ring);color:#fff}

/* Kakuro */
:root{--kb:#3a342c;--kb-ink:#f3ead9}
@media (prefers-color-scheme:dark){:root{--kb:#0f0e0c;--kb-ink:#cfc6b6}}
.fc.kb{position:relative;background:var(--kb);color:var(--kb-ink);font-size:calc(var(--B) / var(--n) * .27);font-weight:700;border-color:var(--kb)}
.fc.kb.diag{background:linear-gradient(to top right,transparent calc(50% - 1px),color-mix(in srgb,var(--kb-ink) 55%,transparent) 50%,transparent calc(50% + 1px)),var(--kb)}
.fc.kb .kd{position:absolute;left:9%;bottom:5%}
.fc.kb .ka{position:absolute;right:9%;top:5%}
.board.ka .fc{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}

/* Star Battle */
.board.sb{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none}
.sbc{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:hsl(var(--h) 68% 84%);
  border-right:1px solid rgba(0,0,0,.12);border-bottom:1px solid rgba(0,0,0,.12);color:#2b2620;font-size:calc(var(--B) / var(--n) * .58);line-height:1}
@media (prefers-color-scheme:dark){.sbc{background:hsl(var(--h) 30% 30%);color:#f3ead9;border-color:rgba(255,255,255,.08)}}
.sbc.r{border-right:3px solid var(--ink)} .sbc.b{border-bottom:3px solid var(--ink)}
.sbc .x{font-size:.55em;opacity:.55} .sbc .x.auto{opacity:.25}
.sbc.e{color:var(--err)}
.sbc.h{animation:hint 1.3s ease}
.board.sb.won .sbc{filter:saturate(1.4) brightness(1.05)}
.sizes.modes button{font-weight:600}
.sbopts{width:var(--B);display:flex;justify-content:center;color:var(--muted);font-size:.95rem}
.sbopts label{display:flex;gap:6px;align-items:center}

/* Nurikabe */
.board.nk{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:1px;background:var(--line);border:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none}
.nkc{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);font-weight:800;font-size:calc(var(--B) / var(--n) * .46);transition:background .1s}
.nkc.s{background:#2f5d7c}
@media (prefers-color-scheme:dark){.nkc.s{background:#2c4f69}}
.nkc .dot{width:22%;height:22%;border-radius:50%;background:var(--muted)}
.nkc.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.nkc.e{color:var(--err)} .nkc.s.e{background:#8a2e2a}
.nkc.h{animation:hint 1.3s ease}
.board.nk.won .nkc:not(.s){background:color-mix(in srgb,var(--ok) 22%,var(--card))}

/* Hashi */
.board.hs{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none}
.board.hs svg{width:100%;height:100%;display:block}
.board.hs .gd{fill:var(--line)}
.board.hs .br{stroke:var(--ink);stroke-width:.07;stroke-linecap:round}
.board.hs .br.h{stroke:var(--hint);stroke-width:.12}
.board.hs .is{fill:var(--card);stroke:var(--ink);stroke-width:.06}
.board.hs .is.full{fill:color-mix(in srgb,var(--ok) 30%,var(--card));stroke:var(--ok)}
.board.hs .is.over{stroke:var(--err);fill:color-mix(in srgb,var(--err) 18%,var(--card))}
.board.hs .is.sel{stroke:var(--user);stroke-width:.1}
.board.hs text{fill:var(--ink);font-weight:800;font-size:.46px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.board.hs.won .is{fill:color-mix(in srgb,var(--ok) 35%,var(--card))}

/* Binairo */
.board.bn{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:3px;background:var(--line);padding:3px;border-radius:12px;touch-action:none}
.bnc{min-width:0;min-height:0;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--card);font-size:calc(var(--B) / var(--n) * .5);font-weight:500;color:var(--ink)}
.bnc.v0{background:#f3d9b8;color:#8a4a12} .bnc.v1{background:#c9dcf2;color:#1f4f86}
@media (prefers-color-scheme:dark){.bnc.v0{background:#5a3d1f;color:#f0c48e}.bnc.v1{background:#24405f;color:#a9cbf2}}
.bnc.k{font-weight:900}
.bnc.k::after{content:"";position:absolute}
.bnc.e{box-shadow:inset 0 0 0 3px var(--err)}
.bnc.h{animation:hint 1.3s ease}
.board.bn.won .bnc{filter:saturate(1.3)}

/* Masyu */
.board.ms{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none}
.board.ms svg{width:100%;height:100%;display:block}
.board.ms .gl{stroke:var(--line);stroke-width:.02}
.board.ms .ln{stroke:var(--user);stroke-width:.16;stroke-linecap:round}
.board.ms .ln.h{stroke:var(--hint)}
.board.ms .xx{stroke:var(--muted);stroke-width:.05;stroke-linecap:round}
.board.ms .cw{fill:var(--card);stroke:var(--ink);stroke-width:.07}
.board.ms .cb{fill:var(--ink);stroke:var(--ink);stroke-width:.07}
.board.ms .cw.e,.board.ms .cb.e{stroke:var(--err);stroke-width:.1}
.board.ms .cb.e{fill:var(--err)}
.board.ms .bad{fill:var(--err)}
.board.ms.won .ln{stroke:var(--ok)}

/* Numbrix */
.board.nx{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none;overflow:hidden}
.board.nx svg{width:100%;height:100%;display:block}
.board.nx .gl{stroke:var(--line);stroke-width:.025}
.board.nx .sel{fill:color-mix(in srgb,var(--user) 18%,transparent)}
.board.nx .hl{fill:color-mix(in srgb,var(--hint) 45%,transparent)}
.board.nx .lk{stroke:color-mix(in srgb,var(--user) 35%,transparent);stroke-width:.09;stroke-linecap:round}
.board.nx text{font-size:.42px;text-anchor:middle;dominant-baseline:central;fill:var(--user);font-weight:500;pointer-events:none}
.board.nx text.k{fill:var(--ink);font-weight:800}
.board.nx text.e{fill:var(--err)}
.board.nx.won .lk{stroke:var(--ok)}
.pad.nx{grid-template-columns:repeat(7,1fr)}
.pad.nx button.dir{font-size:.9rem}

/* Futoshiki */
.board.fu{touch-action:manipulation}
.board.fu svg{width:100%;height:100%;display:block}
.board.fu .cell{fill:var(--card);stroke:var(--ink);stroke-width:.04}
.board.fu .cell.same{fill:color-mix(in srgb,var(--user) 14%,var(--card))}
.board.fu .cell.h{fill:color-mix(in srgb,var(--hint) 45%,var(--card))}
.board.fu .v{font-size:.56px;text-anchor:middle;dominant-baseline:central;fill:var(--user);font-weight:500;pointer-events:none}
.board.fu .v.k{fill:var(--ink);font-weight:800}
.board.fu .v.e{fill:var(--err)}
.board.fu .nt{font-size:.22px;text-anchor:middle;dominant-baseline:central;fill:var(--muted);font-weight:600;pointer-events:none}
.board.fu .sg{font-size:.42px;text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-weight:800;pointer-events:none}
.board.fu .sg.e{fill:var(--err)}
.board.fu.won .cell{fill:color-mix(in srgb,var(--ok) 18%,var(--card))}

/* Desvíos */
.board.tt{touch-action:none}
.board.tt svg{width:100%;height:100%;display:block}
.board.tt .bg{fill:var(--card);stroke:var(--ink);stroke-width:.05}
.board.tt .gl{stroke:var(--line);stroke-width:.025}
.board.tt .sl{stroke-width:.42;stroke-dasharray:.07 .13;fill:none}
.board.tt .rl{stroke-width:.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.board.tt .in{stroke:var(--card);stroke-width:.17;fill:none;stroke-linecap:round;stroke-linejoin:round}
.board.tt .gv{stroke:var(--ink)} .board.tt .us{stroke:var(--user)}
.board.tt .x{stroke:var(--muted);stroke-width:.05;stroke-linecap:round}
.board.tt .cnt{font-size:.44px;text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-weight:800}
.board.tt .cnt.ok{fill:var(--muted);font-weight:500}
.board.tt .cnt.over{fill:var(--err)}
.board.tt .bad{fill:var(--err)}
.board.tt.won .us{stroke:var(--ok)}

/* Historial */
.histlink{width:var(--B);display:flex;justify-content:space-between;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600}
.histlink span{color:var(--muted);font-weight:500}
.chips{width:var(--B);display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;font-size:.88rem}
.chips button.on{background:var(--ink);color:var(--bg)}
.hsum{width:var(--B);color:var(--muted);font-size:.9rem}
.hlist{width:var(--B);display:grid;gap:8px}
.hitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hitem b{font-size:1.02rem}
.hitem .hs{color:var(--muted);text-align:right}
.hitem .hd{grid-column:1/-1;color:var(--muted);font-size:.82rem}
.hitem .hm{font-size:.85rem}
.hitem .hm:nth-of-type(5){text-align:right}
.hitem .hm:last-child{grid-column:1/-1}
.hm.warn{color:var(--ring)}
.hstats{width:var(--B);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:var(--card);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.hstats b{font-size:1.25rem}
.hstats span{color:var(--muted);font-size:.8rem}
.controls.two{grid-template-columns:1fr 1fr}

/* Pirámide */
.board.py{aspect-ratio:auto;touch-action:manipulation}
.board.py svg{width:100%;height:auto;display:block}
.board.py .bk{fill:var(--card);stroke:var(--ink);stroke-width:.03}
.board.py .bk.k{fill:color-mix(in srgb,var(--ink) 8%,var(--card))}
.board.py .bk.sel{fill:color-mix(in srgb,var(--user) 20%,var(--card));stroke:var(--user);stroke-width:.05}
.board.py .bk.h{fill:color-mix(in srgb,var(--hint) 45%,var(--card))}
.board.py text{font-size:.3px;text-anchor:middle;dominant-baseline:central;fill:var(--user);font-weight:500;pointer-events:none}
.board.py text.k{fill:var(--ink);font-weight:800}
.board.py text.e{fill:var(--err)}
.board.py.won .bk{fill:color-mix(in srgb,var(--ok) 18%,var(--card))}

/* Turbo Láser */
.board.lr{background:var(--card);border-radius:12px;border:1px solid var(--line);touch-action:none;overflow:hidden}
.board.lr svg{width:100%;height:100%;display:block}
.board.lr .gl{stroke:var(--line);stroke-width:.025}
.board.lr .cv{fill:color-mix(in srgb,var(--user) 12%,transparent)}
.board.lr .ry{stroke:var(--user);stroke-width:.13;stroke-linecap:round}
.board.lr .re{fill:var(--user)}
.board.lr .ry.h{stroke:var(--hint)}
.board.lr .dm{fill:var(--ink)}
.board.lr .dm.ok{fill:var(--muted)}
.board.lr .dm.over{fill:var(--err)}
.board.lr text{font-size:.36px;text-anchor:middle;dominant-baseline:central;fill:var(--card);font-weight:800;pointer-events:none}
.board.lr.won .ry{stroke:var(--ok)} .board.lr.won .re{fill:var(--ok)}

/* LITS */
.board.li{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-radius:4px;overflow:hidden;touch-action:none;background:var(--card)}
.lic{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--card);border-right:1px solid var(--thin);border-bottom:1px solid var(--thin);font-weight:800;font-size:calc(var(--B) / var(--n) * .34);color:rgba(255,255,255,.85)}
.lic.r{border-right:3px solid var(--ink)} .lic.b{border-bottom:3px solid var(--ink)}
.lic.s{background:#55504a}
.lic.tL{background:#3f6fa8} .lic.tI{background:#3d8a5a} .lic.tT{background:#c0702c} .lic.tS{background:#8a4f9a}
.lic.e{background:var(--err)!important}
.lic .dot{width:20%;height:20%;border-radius:50%;background:var(--muted)}
.lic.h{animation:hint 1.3s ease}

/* Sudoku, Nonomino, KenKen */
.board.nm .fc{position:relative}
.board.nm .fc .cg{position:absolute;left:5%;top:3%;font-size:calc(var(--B) / var(--n) * .2);font-weight:800;color:var(--ink);line-height:1;pointer-events:none}
.board.nm.cc .fc .notes{padding:24% 6% 4%}
.board.nm .fc .notes{font-size:calc(var(--B) / var(--n) * .19)}

/* Shikaku */
.board.sk{touch-action:none}
.board.sk svg{width:100%;height:100%;display:block}
.board.sk .bgd{fill:var(--card)}
.board.sk .rc{fill:hsl(var(--h) 65% 84%)}
@media (prefers-color-scheme:dark){.board.sk .rc{fill:hsl(var(--h) 30% 30%)}}
.board.sk .rc.e{fill:color-mix(in srgb,var(--err) 45%,var(--card))}
.board.sk .rc.h{fill:color-mix(in srgb,var(--hint) 60%,var(--card))}
.board.sk .gl{stroke:var(--thin);stroke-width:.03}
.board.sk .ro{fill:none;stroke:var(--ink);stroke-width:.07}
.board.sk .fr{fill:none;stroke:var(--ink);stroke-width:.1}
.board.sk .pv{fill:color-mix(in srgb,var(--user) 22%,transparent);stroke:var(--user);stroke-width:.07;stroke-dasharray:.15 .1}
.board.sk .pa{font-size:.3px;fill:var(--user);font-weight:800;text-anchor:middle;dominant-baseline:central;opacity:.6}
.board.sk .cl{font-size:.5px;font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.board.sk.won .rc{fill:color-mix(in srgb,var(--ok) 25%,var(--card))}

/* Kuromasu */
.board.km .hc.k{font-weight:800}
.board.km .hc.k.ok{color:var(--muted)}
.board.km .hc.k.e{color:var(--err)}

<body>
<main id="app"></main>
<script>
(()=>{
/* ================== utilidades comunes ================== */
const U={
  range:n=>[...Array(n).keys()],
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},
  pick:a=>a[Math.random()*a.length|0],
  fmt:s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),
  load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  _geo:{},
  geometry(n){
    if(U._geo[n])return U._geo[n];
    const N=n*n,nb=[],peers=[],nb8=[];
    for(let i=0;i<N;i++){
      const r=i/n|0,c=i%n,o=[];
      if(r>0)o.push(i-n); if(r<n-1)o.push(i+n); if(c>0)o.push(i-1); if(c<n-1)o.push(i+1);
      nb.push(o);
      const p=[]; for(let k=0;k<n;k++){ if(k!==c)p.push(r*n+k); if(k!==r)p.push(k*n+c); }
      peers.push(p);
      const e=[]; for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){ if(!dr&&!dc)continue; const rr=r+dr,cc=c+dc; if(rr>=0&&rr<n&&cc>=0&&cc<n)e.push(rr*n+cc); }
      nb8.push(e);
    }
    return U._geo[n]={n,N,nb,peers,nb8};
  },
  connected(isSh,g){
    let start=-1,total=0;
    for(let i=0;i<g.N;i++) if(!isSh(i)){total++; if(start<0)start=i;}
    if(!total) return false;
    const seen=new Uint8Array(g.N),q=[start]; seen[start]=1; let cnt=1;
    while(q.length){const i=q.pop(); for(const j of g.nb[i]) if(!seen[j]&&!isSh(j)){seen[j]=1;cnt++;q.push(j);}}
    return cnt===total;
  },
  best(id,n,secs){
    const b=U.load('best-'+id)||{};
    if(!b[n]||secs<b[n]){b[n]=secs;U.save('best-'+id,b);return true}
    return false;
  }
};

/* ================== estadísticas anónimas ==================
   Usa GoatCounter (sin cookies ni datos personales). Solo se activa si
   window.AENIGMATON_STATS tiene el código de tu cuenta y la página está en http(s). */
const Stats={
  code:(typeof window!=='undefined'&&window.AENIGMATON_STATS)||'',
  ready:false, queue:[],
  init(){
    if(!this.code||!/^https?:/.test(location.protocol))return;
    window.goatcounter={no_onload:true};
    const sc=document.createElement('script'); sc.async=true; sc.src='https://gc.zgo.at/count.js';
    sc.dataset.goatcounter='https://'+this.code+'.goatcounter.com/count';
    sc.onload=()=>{ this.ready=true; this.queue.splice(0).forEach(a=>this.send(a)); };
    document.head.appendChild(sc);
  },
  send(a){ try{ window.goatcounter.count(a); }catch(e){} },
  track(path,title,event){
    if(!this.code)return;
    const a={path,title:title||path,event:!!event};
    this.ready?this.send(a):this.queue.push(a);
  }
};
Stats.init();

/* ================== registro de juegos ==================
   Cada juego define: id, name, desc, icon (SVG), sizes, defaultSize, rules (HTML),
   generate(n) -> puz, init(puz,n) -> st, render(board,S,api,flash),
   solved(S) -> bool, hint(S) -> {i,msg}|null, y opcionalmente renderExtra(el,S,api). */
const GAMES=[];
const register=g=>GAMES.push(g);

/* ================== HITORI ================== */
(()=>{
  function latin(n){
    const rows=U.shuffle(U.range(n)),cols=U.shuffle(U.range(n)),sym=U.shuffle(U.range(n)),g=[];
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)g.push(sym[(rows[r]+cols[c])%n]+1);
    return g;
  }
  function build(gm){
    const {N}=gm, g=latin(gm.n), sh=new Array(N).fill(false);
    const target=Math.round(N*(0.27+Math.random()*0.07)); let k=0;
    for(const i of U.shuffle(U.range(N))){
      if(k>=target)break;
      if(gm.nb[i].some(j=>sh[j]))continue;
      sh[i]=true;
      if(!U.connected(j=>sh[j],gm)){sh[i]=false;continue;}
      k++;
    }
    for(let i=0;i<N;i++) if(sh[i]) g[i]=U.pick(gm.peers[i].filter(j=>!sh[j]).map(j=>g[j]));
    return g;
  }
  function solve(g,gm,limit){
    const {N,nb,peers}=gm, sols=[];
    const st0=new Array(N).fill(0);
    for(let i=0;i<N;i++) if(!peers[i].some(j=>g[j]===g[i])) st0[i]=1;
    function prop(st){
      let ch=true;
      while(ch){
        ch=false;
        for(let i=0;i<N;i++){
          if(st[i]===2){ for(const j of nb[i]){ if(st[j]===2)return false; if(st[j]===0){st[j]=1;ch=true;} } }
          else if(st[i]===1){ for(const j of peers[i]) if(g[j]===g[i]){ if(st[j]===1)return false; if(st[j]===0){st[j]=2;ch=true;} } }
        }
      }
      return U.connected(j=>st[j]===2,gm);
    }
    (function rec(st){
      if(sols.length>=limit||!prop(st))return;
      const i=st.indexOf(0);
      if(i<0){sols.push(st.slice());return;}
      const a=st.slice();a[i]=2;rec(a);
      const b=st.slice();b[i]=1;rec(b);
    })(st0);
    return sols;
  }
  function errors(S,gm){
    const e=new Set(),st=S.st,g=S.puz.g;
    for(let i=0;i<gm.N;i++){
      if(st[i]===1){ for(const j of gm.nb[i]) if(st[j]===1){e.add(i);e.add(j);} }
      else if(st[i]===2){ for(const j of gm.peers[i]) if(st[j]===2&&g[j]===g[i]){e.add(i);e.add(j);} }
    }
    return e;
  }
  register({
    id:'hitori', name:'Hitori',
    desc:'Tacha casillas para que no se repita ningún número en filas ni columnas.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--line)"/>${[0,1,2].map(r=>[0,1,2].map(c=>{const s=(r===0&&c===1)||(r===1&&c===2)||(r===2&&c===0);return `<rect x="${4+c*21}" y="${4+r*21}" width="18" height="18" rx="3" fill="${s?'var(--shade)':'var(--card)'}"/><text x="${13+c*21}" y="${18+r*21}" font-size="12" font-weight="700" text-anchor="middle" fill="${s?'var(--shade-ink)':'var(--ink)'}">${[[1,2,3],[3,1,2],[2,3,1]][r][c]}</text>`}).join('')).join('')}<circle cx="34" cy="34" r="8" fill="none" stroke="var(--ring)" stroke-width="2"/></svg>`,
    sizes:[5,6,7,8,10], defaultSize:6,
    rules:`<ol>
      <li>En cada fila y columna no puede quedar ningún número repetido entre las casillas sin tachar.</li>
      <li>Dos casillas tachadas no pueden tocarse por un lado (en diagonal sí).</li>
      <li>Todas las casillas sin tachar deben formar un único bloque conectado.</li></ol>
      <ul><li>Toca una casilla: <b>tachar</b> → <b>círculo</b> (seguro que es blanca) → vacía.</li>
      <li>La pista corrige primero una casilla equivocada; si no hay, revela una nueva.</li></ul>`,
    generate(n){
      const gm=U.geometry(n), t0=performance.now(); let fb=null;
      while(true){
        const g=build(gm), s=solve(g,gm,2);
        if(s.length===1) return {g,sol:s[0]};
        if(s.length&&!fb) fb={g,sol:s[0]};
        if(performance.now()-t0>2500&&fb) return fb;
      }
    },
    init:(puz,n)=>new Array(n*n).fill(0),   // 0 vacía, 1 tachada, 2 círculo
    solved(S){
      const gm=U.geometry(S.n), sh=i=>S.st[i]===1;
      for(let i=0;i<gm.N;i++){
        if(sh(i)){ if(gm.nb[i].some(sh))return false; }
        else for(const j of gm.peers[i]) if(!sh(j)&&S.puz.g[j]===S.puz.g[i]) return false;
      }
      return U.connected(sh,gm);
    },
    render(board,S,api,flash){
      const gm=U.geometry(S.n), err=S.errs?errors(S,gm):new Set();
      board.className='board hi';
      board.innerHTML='<div class="gen">Generando…</div>';
      for(let i=0;i<gm.N;i++){
        const c=document.createElement('button');
        c.className='hc'+(S.st[i]===1?' s':S.st[i]===2?' c':'')+(err.has(i)?' e':'')+(flash===i?' h':'');
        c.textContent=S.puz.g[i];
        c.setAttribute('aria-label','Fila '+((i/S.n|0)+1)+', columna '+(i%S.n+1)+', '+S.puz.g[i]);
        c.onclick=()=>{ if(S.won)return; api.pushUndo(); S.st[i]=(S.st[i]+1)%3; api.commit(); };
        board.appendChild(c);
      }
    },
    hint(S){
      const sol=S.puz.sol, N=S.n*S.n;
      const wrong=U.range(N).filter(i=>(S.st[i]===1&&sol[i]!==2)||(S.st[i]===2&&sol[i]===2));
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta casilla estaba mal'}; }
      const open=U.range(N).filter(j=>S.st[j]===0);
      if(!open.length) return null;
      const toShade=open.filter(j=>sol[j]===2);
      const i=U.pick(toShade.length?toShade:open);
      S.st[i]=sol[i]===2?1:2;
      return {i,msg:sol[i]===2?'Esta hay que tacharla':'Esta queda blanca'};
    }
  });
})();

/* ================== FILLOMINO ================== */
(()=>{
  const W=[0,10,22,26,20,14,8]; // probabilidad de tamaños 1..6
  function pickSize(){let r=Math.random()*100;for(let k=1;k<W.length;k++){r-=W[k];if(r<=0)return k}return 3}
  function partition(gm){
    const {N,nb}=gm, reg=new Int32Array(N).fill(-1), regions=[];
    const free=i=>nb[i].reduce((a,j)=>a+(reg[j]<0),0);
    const frontier=cells=>{const f=[];for(const c of cells)for(const j of nb[c])if(reg[j]<0&&!f.includes(j))f.push(j);return f};
    const clash=(cells,id)=>{const k=cells.length;for(const c of cells)for(const j of nb[c]){const r=reg[j];if(r>=0&&r!==id&&regions[r].length===k)return true}return false};
    let left=N;
    while(left){
      // semilla: la casilla libre más encajonada (evita dejar huecos sueltos)
      let best=[],bf=9;
      for(let i=0;i<N;i++) if(reg[i]<0){const f=free(i);if(f<bf){bf=f;best=[i]}else if(f===bf)best.push(i)}
      const s=U.pick(best), id=regions.length, cells=[s]; reg[s]=id;
      const target=pickSize();
      while(cells.length<target){ const f=frontier(cells); if(!f.length)break; const j=U.pick(f); reg[j]=id; cells.push(j); }
      // si choca con una región vecina del mismo tamaño, crece un poco más
      while(clash(cells,id)){
        const f=frontier(cells);
        if(!f.length||cells.length>=9) return null;
        const j=U.pick(f); reg[j]=id; cells.push(j);
      }
      regions.push(cells); left-=cells.length;
    }
    const val=new Array(N);
    regions.forEach(r=>r.forEach(c=>val[c]=r.length));
    for(let i=0;i<N;i++) for(const j of nb[i]) if(reg[i]!==reg[j]&&val[i]===val[j]) return null;
    return val;
  }
  // ¿La región que contiene i es válida (no se pasa y aún puede completarse)?
  function checker(gm){
    const {N,nb}=gm, mark=new Int32Array(N), buf=new Int32Array(N), stack=new Int32Array(N); let stamp=0;
    return function(v,i){
      const x=v[i]; stamp++; let n=0; buf[n++]=i; mark[i]=stamp;
      for(let k=0;k<n;k++){const a=buf[k]; for(const j of nb[a]) if(mark[j]!==stamp&&v[j]===x){mark[j]=stamp;buf[n++]=j}}
      if(n>x) return false; if(n===x) return true;
      let cnt=n, sp=0; for(let k=0;k<n;k++) stack[sp++]=buf[k];
      while(sp&&cnt<x){const a=stack[--sp]; for(const j of nb[a]) if(mark[j]!==stamp&&(v[j]===0||v[j]===x)){mark[j]=stamp;stack[sp++]=j;cnt++}}
      return cnt>=x;
    };
  }
  function solve(clue,gm,limit,maxNodes){
    const {N,nb}=gm, check=checker(gm), v=Array.from(clue), sols=[]; let nodes=0, aborted=false;
    for(let i=0;i<N;i++) if(v[i]&&!check(v,i)) return {sols,aborted};
    function valid(i,x){
      v[i]=x; let ok=check(v,i);
      if(ok) for(const j of nb[i]) if(v[j]&&v[j]!==x&&!check(v,j)){ok=false;break}
      v[i]=0; return ok;
    }
    (function rec(){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      let best=-1,bestVals=null;
      for(let i=0;i<N;i++) if(!v[i]){
        const vals=[]; for(let x=1;x<=9;x++) if(valid(i,x)) vals.push(x);
        if(!vals.length) return;

(()=>{

/* ================== KAKURO ================== */
(()=>{
  // ---- kakuro core ----

    return {hr,vr,runs};
  }

    if(!t)return false; const seen=new Uint8Array(N),q=[s];seen[s]=1;let c=1;

    id:'binairo', name:'Binairo',
    desc:'Rellena con 0 y 1: mitad y mitad en cada línea, nunca tres iguales seguidos y sin filas ni columnas repetidas.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--line)"/>

    sizes:[6,8,10,12,14], defaultSize:8,

      <li>Trucos: junto a dos iguales seguidos va el contrario (0 0 → 1); entre dos iguales separados por un hueco, también (0 _ 0 → 1).</li></ul>`,
    generate(n){ const g=generateB(n); return {clue:g.clue,sol:g.sol}; },
    init:(puz)=>puz.clue.slice(),   // -1 vacía, 0, 1

    },

      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=sol[i];
      return {i,msg:'Aquí va un '+sol[i]};
    }
  });
})();


/* ================== MASYU ================== */
(()=>{
  // ---- masyu core ----

    for(let r=0;r<n-1;r++)for(let c=0;c<n;c++){ if(f(r,c-1)!==f(r,c)) edge(r*n+c,(r+1)*n+c); }

    if(start<0)return null;
    const loop=[start]; let prev=-1,cur=start;
    while(true){ const nx=adj[cur][0]!==prev?adj[cur][0]:adj[cur][1]; if(nx===start)break; loop.push(nx); prev=cur; cur=nx; if(loop.length>cnt)return null; }
    return loop.length===cnt?loop:null;
  }
  function randomFaces(n){
    const F=n-1, inS=new Uint8Array(F*F);
    inS[(Math.random()*F|0)*F+(Math.random()*F|0)]=1;

    for(let it=0;it<F*F*12;it++){
      const cand=[],thin=[]; for(let i=0;i<F*F;i++) if(!inS[i]){const r=i/F|0,c=i%F; const k=(r>0&&inS[i-F]?1:0)+(r<F-1&&inS[i+F]?1:0)+(c>0&&inS[i-1]?1:0)+(c<F-1&&inS[i+1]?1:0); if(k){cand.push(i); if(k===1)thin.push(i)}}
      if(!cand.length)break; const f=U.pick(thin.length&&Math.random()<0.75?thin:cand); inS[f]=1;

    const L=loop.length, kind=new Int8Array(n*n), dirs=[];

/* ================== FUTOSHIKI ================== */
(()=>{

  function solveF(n,clue,rel,limit,maxNodes,random){

    const peers=[]; for(let i=0;i<N;i++){const r=i/n|0,c=i%n,p=[];for(let k=0;k<n;k++){if(k!==c)p.push(r*n+k);if(k!==r)p.push(k*n+c)}peers.push(p)}
    const units=[]; for(let r=0;r<n;r++)units.push(U.range(n).map(c=>r*n+c)); for(let c=0;c<n;c++)units.push(U.range(n).map(r=>r*n+c));

      <g font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)"><text x="18" y="22">1</text><text x="50" y="22">2</text><text x="18" y="54">2</text><text x="50" y="54">1</text>

    generate(n){ const g=generateF(n); return {clue:g.clue,sol:g.sol,rel:g.rel}; },

/* ================== DESVÍOS ================== */
(()=>{
  // ---- desvíos (train tracks) core ----
  const TD=[[0,1],[1,0],[0,-1],[-1,0]]; // der, abajo, izq, arriba
  function tstep(i,d,n){const r=(i/n|0)+TD[d][0],c=i%n+TD[d][1];return (r<0||c<0||r>=n||c>=n)?-1:r*n+c}
  function tedge(a,b,n){ if(a>b)[a,b]=[b,a]; return b-a===1?(a/n|0)*(n-1)+a%n : n*(n-1)+a; }
  function tends(e,n){ if(e<n*(n-1)){const r=e/(n-1)|0,c=e%(n-1);const a=r*n+c;return [a,a+1]} const a=e-n*(n-1); return [a,a+n]; }

  function randomTrack(n){
    const N=n*n, lo=Math.floor(N*.42), hi=Math.floor(N*.62);
    const border=U.range(N).filter(i=>outDirs(i,n).length);
    for(let t=0;t<200;t++){
      const s=U.pick(border), vis=new Uint8Array(N), path=[s]; vis[s]=1; let nodes=0;
      const ok=(function rec(){
        if(++nodes>4000)return false;
        const h=path[path.length-1];
        if(path.length>=lo&&outDirs(h,n).length&&h!==s&&Math.random()<.35) return true;
        if(path.length>=hi) return outDirs(h,n).length>0&&h!==s;
        for(const d of U.shuffle([0,1,2,3])){
          const j=tstep(h,d,n); if(j<0||vis[j])continue;
          // evita caminos pegados a sí mismos (casilla vecina ya usada que no sea la anterior)
          let touch=0; for(let k=0;k<4;k++){const q=tstep(j,k,n); if(q>=0&&vis[q])touch++} if(touch>1)continue;
          vis[j]=1; path.push(j); if(rec())return true; path.pop(); vis[j]=0;
        }
        return false;
      })();
      if(ok&&path.length>=lo){
        const e=path[path.length-1];
        return {path, sOut:U.pick(outDirs(s,n)), eOut:U.pick(outDirs(e,n))};
      }
    }
    return null;
  }
  // solución como aristas internas + extremos con salida al exterior
  function trackEdges(tr,n){ const E=new Uint8Array(2*n*(n-1)); for(let k=0;k+1<tr.path.length;k++) E[tedge(tr.path[k],tr.path[k+1],n)]=1; return E; }

    let m=0; for(let d=0;d<4;d++){const j=tstep(i,d,n); if(j>=0&&E[tedge(i,j,n)])m|=1<<d;} if(ext[i]!==undefined)m|=1<<ext[i]; return m;
  }
  function checkTrack(n,rows,cols,ends,E){ // ends: [{cell,dir},{cell,dir}]
    const N=n*n, ext={}; ends.forEach(e=>ext[e.cell]=e.dir);
    const deg=new Int8Array(N);
    for(let i=0;i<N;i++){ const m=pieceOf(i,n,E,ext); let c=0; for(let d=0;d<4;d++) if(m&(1<<d))c++; deg[i]=c; if(c!==0&&c!==2) return false; }
    // recorrer desde el primer extremo
    let prev=-1,cur=ends[0].cell,cnt=1; const seen=new Uint8Array(N); seen[cur]=1;
    while(cur!==ends[1].cell){ let nx=-1; for(let d=0;d<4;d++){const j=tstep(cur,d,n); if(j>=0&&j!==prev&&E[tedge(cur,j,n)]){nx=j;break}} if(nx<0||seen[nx])return false; prev=cur;cur=nx;seen[cur]=1;cnt++; }

    for(let c=0;c<n;c++){let k=0;for(let r=0;r<n;r++)if(deg[r*n+c])k++;if(k!==cols[c])return false}

  function solveT(n,rows,cols,ends,given,limit,maxNodes){ // given: map celda->máscara de pieza

        for(const [cells,k] of lines){
          let used=0,open=[]; for(const c of cells){ if(yesC[c]>0)used++; else if(unkC[c]>=2) open.push(c); }
          if(used>k||used+open.length<k){bad=true;break}
          if(used===k) for(const c of open) for(const e of CE[c]) if(e>=0&&E[e]<0) set(e,0);
          if(used+open.length===k) for(const c of open) if(unkC[c]===2) for(const e of CE[c]) if(e>=0&&E[e]<0) set(e,1);

        for(let e=0;e<M;e++) if(E[e]===1){const [a,b]=tends(e,n);adj[a].push(b);adj[b].push(a)}
        const comp=new Int32Array(N).fill(-1); const ends2=[];
        for(let s0=0;s0<N;s0++){ if(comp[s0]>=0||(!adj[s0].length&&ext[s0]===undefined))continue; const k=ends2.length,q=[s0],cl=[s0];comp[s0]=k;
          while(q.length){const a=q.pop();for(const b of adj[a]) if(comp[b]<0){comp[b]=k;q.push(b);cl.push(b)}}
          const tips=cl.filter(c=>adj[c].length+(ext[c]!==undefined?1:0)<2); ends2.push({cl,tips}); }
        for(const C of ends2){
          if(!C.tips.length){ if(!C.cl.some(c=>ext[c]!==undefined)){bad=true;break} continue; } // ciclo cerrado sin extremos
          if(C.tips.length===2){ const [a,b]=C.tips; const d=[0,1,2,3].find(d=>tstep(a,d,n)===b); if(d!==undefined){const e=CE[a][d]; if(E[e]<0) set(e,0);} }
        }
      }
      return !bad;
    }
    const E0=new Int8Array(M).fill(-1);
    for(const c in given){ const m=given[c]; for(let d=0;d<4;d++){const e=CE[c][d]; if(e>=0) E0[e]=(m>>d)&1;} }
    (function rec(E){

      if(!prop(E))return;
      let pick=-1;
      for(let c=0;c<N&&pick<0;c++){ let y=ext[c]!==undefined?1:0; for(const e of CE[c]) if(e>=0&&E[e]===1)y++; if(y===1) for(const e of CE[c]) if(e>=0&&E[e]<0){pick=e;break} }
      if(pick<0) pick=E.indexOf(-1);

    })(E0);
    return {sols,aborted};
  }
  function generateT(n){
    for(;;){
      const tr=randomTrack(n); if(!tr)continue;

      const ends=[{cell:s,dir:tr.sOut},{cell:e,dir:tr.eOut}], ext={[s]:tr.sOut,[e]:tr.eOut};
      const used=new Uint8Array(N); tr.path.forEach(c=>used[c]=1);
      const rows=U.range(n).map(r=>U.range(n).filter(c=>used[r*n+c]).length), cols=U.range(n).map(c=>U.range(n).filter(r=>used[r*n+c]).length);
      const given={[s]:pieceOf(s,n,E,ext),[e]:pieceOf(e,n,E,ext)};

  const info=S=>{ // aristas bloqueadas por piezas dadas

  const M=n=>2*n*(n-1);
  register({
    id:'desvios', name:'Desvíos',
    desc:'Una sola vía de un borde a otro: los números de arriba y de la derecha dicen cuántas casillas ocupa en cada columna y fila.',

      <path d="M4 24H24V48H48V14H64" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M4 24H24V48H48V14H64" fill="none" stroke="var(--card)" stroke-width="3" stroke-linejoin="round"/></svg>`,
    sizes:[6,7,8,9], defaultSize:6,
    rules:`<ol>
      <li>Traza <b>una sola vía</b> que entra por un borde y sale por otro, uniendo las dos piezas que tocan el borde.</li>
      <li>La vía va de casilla en casilla en horizontal o vertical. No se bifurca ni pasa dos veces por la misma casilla.</li>
      <li>Los números de <b>arriba</b> y de la <b>derecha</b> dicen cuántas casillas ocupa la vía en esa columna y en esa fila.</li>
      <li>Las piezas impresas ya forman parte de la vía y no se pueden cambiar.</li></ol>
      <ul><li><b>Arrastra</b> de casilla en casilla para tender la vía; si empiezas sobre un tramo, lo borras.</li>
      <li>Toca el centro de una casilla para marcarla con ✕ (aquí no hay vía); toca cerca del borde entre dos casillas para poner o quitar un tramo.</li>
      <li>Los números se apagan cuando la fila o columna está completa, y se ponen en rojo si te pasas.</li>
      <li>Truco: las filas o columnas con un 0 se pueden tachar enteras; las que tienen el máximo, rellenarse.</li></ul>`,
    generate(n){ const g=generateT(n); return {rows:g.rows,cols:g.cols,ends:g.ends,given:g.given,sol:g.sol}; },
    init:(puz,n)=>{ const st=new Array(M(n)+n*n).fill(0); for(const c in puz.given){ const m=puz.given[c]; for(let d=0;d<4;d++){ const j=tstep(+c,d,n); if(j>=0&&(m>>d)&1) st[tedge(+c,j,n)]=1; } } return st; },
    solved(S){ const n=S.n; return checkTrack(n,S.puz.rows,S.puz.cols,S.puz.ends,S.st.slice(0,M(n))); },
    render(board,S,api,flash){

      const ext={}; ends.forEach(e=>ext[e.cell]=e.dir);

      const C=i=>[(i%n)+.5,(i/n|0)+.5];
      let h=`<svg viewBox="-.25 -1.2 ${n+1.45} ${n+1.45}"><rect class="bg" x="0" y="0" width="${n}" height="${n}"/>`;
      for(let k=1;k<n;k++) h+=`<line class="gl" x1="${k}" y1="0" x2="${k}" y2="${n}"/><line class="gl" x1="0" y1="${k}" x2="${n}" y2="${k}"/>`;

      const L=(sg,cls)=>`<line class="${cls}" x1="${sg.p[0][0]}" y1="${sg.p[0][1]}" x2="${sg.p[1][0]}" y2="${sg.p[1][1]}"/>`;
      segs.forEach(sg=>h+=L(sg,'sl '+(sg.g?'gv':'us')));
      segs.forEach(sg=>h+=L(sg,'rl '+(sg.g?'gv':'us')));

        if(S.errs&&deg[i]>2) h+=`<circle class="bad" cx="${x}" cy="${y}" r=".12"/>`; }
      if(flash!=null&&flash>=0&&flash<M(n)){ const [a,b]=tends(flash,n),[x1,y1]=C(a),[x2,y2]=C(b); h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--hint)" stroke-width=".12" stroke-linecap="round"/>`; }
      board.className='board tt';
      board.innerHTML='<div class="gen">Generando…</div>'+h+'</svg>';
      const toGrid=e=>{const r=board.getBoundingClientRect();const k=(n+1.45);return [(e.clientX-r.left)/r.width*k-.25,(e.clientY-r.top)/r.height*k-1.2]};

    },
    hint(S){

      const wrong=U.range(m).filter(e=>S.st[e]&&!sol[e]);
      if(wrong.length){ const e=U.pick(wrong); S.st[e]=0; return {i:e,msg:'Por aquí no pasa la vía'}; }
      const badX=U.range(n*n).filter(i=>S.st[m+i]&&used[i]);

      return {i:e,msg:'La vía pasa por aquí'};
    }
  });
})();


/* ================== PIRÁMIDE NUMÉRICA ================== */
(()=>{
  const idx=(r,k)=>r*(r+1)/2+k;
  function build(n){ // base aleatoria y sumas hacia arriba
    const v=new Array(n*(n+1)/2).fill(0), top=n<=4?12:9;
    for(let k=0;k<n;k++) v[idx(n-1,k)]=1+(Math.random()*top|0);
    for(let r=n-2;r>=0;r--) for(let k=0;k<=r;k++) v[idx(r,k)]=v[idx(r+1,k)]+v[idx(r+1,k+1)];
    return v;
  }
  function deducible(n,known){ // ¿se rellena todo solo con "dos de tres"?
    const K=known.slice(); let ch=true;
    while(ch){ ch=false;
      for(let r=0;r<n-1;r++) for(let k=0;k<=r;k++){
        const a=idx(r,k),b=idx(r+1,k),c=idx(r+1,k+1), s=K[a]+K[b]+K[c];
        if(s===2){ if(!K[a]){K[a]=1;ch=true} else if(!K[b]){K[b]=1;ch=true} else {K[c]=1;ch=true} }
      } }
    return K.every(x=>x);
  }
  let sel=-1;
  register({
    id:'piramide', name:'Pirámide numérica',
    desc:'Cada ladrillo es la suma de los dos que tiene debajo. Completa la pirámide sumando y restando.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"><rect x="24" y="10" width="20" height="14"/><rect x="14" y="24" width="20" height="14"/><rect x="34" y="24" width="20" height="14"/><rect x="4" y="38" width="20" height="14"/><rect x="24" y="38" width="20" height="14"/><rect x="44" y="38" width="20" height="14"/></g>
      <g font-size="9" font-weight="800" text-anchor="middle" fill="var(--ink)"><text x="34" y="20">12</text><text x="24" y="34">5</text><text x="44" y="34">7</text><text x="14" y="48">2</text><text x="34" y="48">3</text><text x="54" y="48">4</text></g></svg>`,
    sizes:[4,5,6,7], defaultSize:5,
    sizeLabel:s=>s+' pisos',
    rules:`<ol>
      <li>Cada ladrillo vale la <b>suma de los dos ladrillos</b> que tiene justo debajo.</li>
      <li>Rellena todos los ladrillos vacíos.</li></ol>
      <ul><li>Toca un ladrillo y escribe el número con el teclado. ⌫ borra la última cifra.</li>
      <li>Si conoces dos de los tres números de un "triángulo" (un ladrillo y los dos de debajo), sacas el tercero: sumando si falta el de arriba, restando si falta uno de abajo.</li>
      <li>Truco: no hace falta empezar por abajo; busca cualquier triángulo con dos números ya puestos.</li></ul>`,
    generate(n){
      const sol=build(n), T=sol.length, known=new Array(T).fill(1);
      for(const i of U.shuffle(U.range(T))){ known[i]=0; if(!deducible(n,known)) known[i]=1; }
      return {clue:sol.map((x,i)=>known[i]?x:0),sol};
    },
    init:(puz)=>puz.clue.slice(),
    solved(S){
      const n=S.n, v=S.st; if(v.some(x=>!x))return false;
      for(let r=0;r<n-1;r++) for(let k=0;k<=r;k++) if(v[idx(r,k)]!==v[idx(r+1,k)]+v[idx(r+1,k+1)]) return false;
      return true;
    },
    render(board,S,api,flash){
      const n=S.n, v=S.st, {clue}=S.puz, H=.62, bad=new Set();
      if(S.errs) for(let r=0;r<n-1;r++) for(let k=0;k<=r;k++){ const a=idx(r,k),b=idx(r+1,k),c=idx(r+1,k+1); if(v[a]&&v[b]&&v[c]&&v[a]!==v[b]+v[c]){bad.add(a);bad.add(b);bad.add(c);} }
      let h=`<svg viewBox="-.05 -.05 ${n+.1} ${n*H+.1}">`;
      for(let r=0;r<n;r++) for(let k=0;k<=r;k++){
        const i=idx(r,k), x=(n-r-1)/2+k, y=r*H;
        h+=`<rect class="bk${clue[i]?' k':''}${sel===i?' sel':''}${flash===i?' h':''}" data-i="${i}" x="${x}" y="${y}" width="1" height="${H}" rx=".04"/>`;
        if(v[i]) h+=`<text class="${clue[i]?'k':''}${bad.has(i)?' e':''}" x="${x+.5}" y="${y+H/2+.01}">${v[i]}</text>`;
      }
      board.className='board py';
      board.innerHTML='<div class="gen">Generando…</div>'+h+'</svg>';
      board.onpointerdown=null; board.onpointermove=null; board.onpointerup=null;
      board.onclick=e=>{ const el=e.target.closest('rect.bk'); if(!el)return; const i=+el.dataset.i; if(api.S.puz.clue[i])return; sel=i; api.draw(); };
    },
    renderExtra(el,S,api){
      el.innerHTML='';
      const pad=document.createElement('div'); pad.className='pad nx';
      const put=f=>{ const S2=api.S; if(sel<0||sel>=S2.st.length||S2.won||S2.puz.clue[sel])return; api.pushUndo(); f(S2); api.commit(); };
      for(const x of [1,2,3,4,5,6,7,8,9,0]){
        const b=document.createElement('button'); b.textContent=x;
        b.onclick=()=>put(S2=>{ const nv=S2.st[sel]*10+x; S2.st[sel]=nv>9999?S2.st[sel]:nv; });
        pad.appendChild(b);
      }
      const del=document.createElement('button'); del.textContent='⌫'; del.onclick=()=>put(S2=>{S2.st[sel]=Math.floor(S2.st[sel]/10)}); pad.appendChild(del);
      const clr=document.createElement('button'); clr.textContent='Borrar'; clr.style.fontSize='.85rem'; clr.style.gridColumn='span 3'; clr.onclick=()=>put(S2=>{S2.st[sel]=0}); pad.appendChild(clr);
      el.appendChild(pad);
    },
    hint(S){
      const {sol}=S.puz, T=sol.length;
      const wrong=U.range(T).filter(i=>S.st[i]&&S.st[i]!==sol[i]);
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Este ladrillo estaba mal'}; }
      const open=U.range(T).filter(i=>!S.st[i]);
      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=sol[i];
      return {i,msg:'Aquí va un '+sol[i]};
    }
  });
})();


/* ================== TURBO LÁSER ================== */
(()=>{
  // ---- turbo láser core ----
  const RD=[[-1,0],[0,1],[1,0],[0,-1]]; // arriba, derecha, abajo, izquierda
  function rstep(i,d,n){const r=(i/n|0)+RD[d][0],c=i%n+RD[d][1];return (r<0||c<0||r>=n||c>=n)?-1:r*n+c}
  function rayCells(i,d,len,n){const o=[];let c=i;for(let k=0;k<len;k++){c=rstep(c,d,n);o.push(c)}return o}
  function maxLen(i,d,n,isClue){let k=0,c=i;while(true){c=rstep(c,d,n);if(c<0||isClue[c])break;k++}return k}
  function solveR(n,clues,limit,maxNodes){ // clues: array N con -1 (no) o valor
    const N=n*n, W=Math.ceil(N/32), isClue=clues.map(v=>v>=0), ids=[]; for(let i=0;i<N;i++) if(isClue[i]) ids.push(i);
    const mk=()=>new Uint32Array(W), set=(m,i)=>{m[i>>5]|=1<<(i&31)}, has=(m,i)=>(m[i>>5]>>>(i&31))&1;
    const opts=ids.map(i=>{ const v=clues[i], M=[0,1,2,3].map(d=>maxLen(i,d,n,isClue)), out=[];
      for(let a=0;a<=Math.min(M[0],v);a++)for(let b=0;b<=Math.min(M[1],v-a);b++)for(let c=0;c<=Math.min(M[2],v-a-b);c++){const d=v-a-b-c; if(d<=M[3]){const L=[a,b,c,d],m=mk(); L.forEach((len,dd)=>rayCells(i,dd,len,n).forEach(x=>set(m,x))); out.push({L,m})}}
      return out; });
    const free=[]; for(let i=0;i<N;i++) if(!isClue[i]) free.push(i);
    const sols=[]; let nodes=0,aborted=false; const cov=mk(); const curL=new Array(ids.length);
    const clash=(m)=>{for(let w=0;w<W;w++) if(m[w]&cov[w]) return true; return false};
    (function rec(lists){
      if(sols.length>=limit||aborted)return; if(++nodes>maxNodes){aborted=true;return}
      const can=mk(); let bi=-1;
      for(let x=0;x<lists.length;x++){ const l=lists[x].l; if(!l.length)return; for(const o of l) for(let w=0;w<W;w++) can[w]|=o.m[w]; if(bi<0||l.length<lists[bi].l.length)bi=x; }
      for(const i of free) if(!has(cov,i)&&!has(can,i)) return;
      if(bi<0){ sols.push(curL.slice()); return; }
      const pick=lists[bi], rest=lists.filter((_,x)=>x!==bi);
      for(const o of pick.l){
        for(let w=0;w<W;w++) cov[w]|=o.m[w]; curL[pick.k]=o.L;
        rec(rest.map(q=>({k:q.k,l:q.l.filter(p=>{for(let w=0;w<W;w++) if(p.m[w]&o.m[w]) return false; return true})})));
        for(let w=0;w<W;w++) cov[w]&=~o.m[w];
        if(sols.length>=limit||aborted)break;
      }
    })(opts.map((l,k)=>({k,l})));
    return {sols,aborted,ids};
  }
  function generateR(n){
    for(;;){
    let best=null;
    for(let lay=0;lay<10;lay++){
      var N=n*n, isClue=new Array(N).fill(false), own=new Int32Array(N).fill(-1);
      const nc=Math.round(N*(0.09+Math.random()*0.03));
      // cápsulas al azar sin tocarse en lado
      let placed=0; for(const i of U.shuffle(U.range(N))){ if(placed>=nc)break; if([0,1,2,3].some(d=>{const j=rstep(i,d,n);return j>=0&&isClue[j]}))continue; isClue[i]=true; placed++; }
      const L={}; for(let i=0;i<N;i++) if(isClue[i]) L[i]=[0,0,0,0];
      const grow=()=>{ let moves=true;
        while(moves){ moves=false;
          for(const i of U.shuffle(Object.keys(L).map(Number))){
            for(const d of U.shuffle([0,1,2,3])){ const end=rayCells(i,d,L[i][d]+1,n).pop(); if(end===undefined||end<0||isClue[end]||own[end]>=0)continue; if(Math.random()<.15)continue; own[end]=i; L[i][d]++; moves=true; break; }
          } } };
      grow();

      while(true){ const left=U.range(N).filter(i=>!isClue[i]&&own[i]<0); if(!left.length)break; const x=U.pick(left); isClue[x]=true; L[x]=[0,0,0,0]; grow(); }
      const zeros=Object.keys(L).filter(i=>L[i].every(x=>!x)).length, score=zeros*3+Object.keys(L).length;

    let clues=new Array(N).fill(-1); for(const i in L) clues[i]=L[i].reduce((a,b)=>a+b,0);

      for(let it=0;it<40;it++){
        const r=solveR(n,clues,2,30000); if(r.aborted)break;

        else if(st[i]===1&&A.typeOf[i]) d.textContent=A.typeOf[i];
        board.appendChild(d);
      }
      const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.lic');return c&&board.contains(c)?+c.dataset.i:-1};
      board.onclick=null;
      board.onpointerdown=e=>{
        const S2=api.S; if(!S2||S2.won)return; const i=cellAt(e); if(i<0)return;
        e.preventDefault(); try{board.setPointerCapture(e.pointerId)}catch(_){}
        api.pushUndo(); const val=(S2.st[i]+1)%3; S2.st[i]=val; board._g={val,last:i}; api.draw();
      };
      board.onpointermove=e=>{ const g=board._g; if(!g)return; const j=cellAt(e); if(j<0||j===g.last)return; g.last=j; const S2=api.S; if(S2.st[j]!==g.val){S2.st[j]=g.val;api.draw();} };
      board.onpointerup=board.onpointercancel=()=>{ if(!board._g)return; board._g=null; api.commit(); };
    },
    hint(S){
      const {sol}=S.puz, N=S.n*S.n;
      const wrong=U.range(N).filter(i=>(S.st[i]===1&&!sol[i])||(S.st[i]===2&&sol[i]));
      if(wrong.length){ const i=U.pick(wrong); const w=S.st[i]; S.st[i]=0; return {i,msg:w===1?'Esta casilla no va sombreada':'Esta casilla sí va sombreada'}; }
      const open=U.range(N).filter(i=>sol[i]&&S.st[i]!==1);
      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=1;
      return {i,msg:'Esta casilla va sombreada'};
    }
  });
})();

/* ================== utilidades de rellenar números (Sudoku, Nonomino, KenKen) ================== */
const NUMS=(()=>{
  const bits=m=>{let c=0;for(;m;m&=m-1)c++;return c};
  const latinUnits=n=>{const u=[];for(let r=0;r<n;r++)u.push(U.range(n).map(c=>r*n+c));for(let c=0;c<n;c++)u.push(U.range(n).map(r=>r*n+c));return u};
  const regUnits=reg=>{const m={};reg.forEach((r,i)=>(m[r]=m[r]||[]).push(i));return Object.values(m)};
  const peersOf=(units,N)=>{const p=Array.from({length:N},()=>new Set());for(const u of units)for(const a of u)for(const b of u)if(a!==b)p[a].add(b);return p.map(s=>[...s])};
  // búsqueda con la casilla de menos candidatos primero; extra(i,v) limita candidatos (jaulas)
  function search(n,peers,given,limit,maxNodes,random,extra){
    const N=n*n, full=((1<<(n+1))-1)&~1, v=Array.from(given,x=>x>0?x:0), sols=[]; let nodes=0,aborted=false;
    const cand=i=>{let m=full;for(const j of peers[i]) if(v[j]) m&=~(1<<v[j]); if(extra) m&=extra(i,v); return m};
    for(let i=0;i<N;i++) if(v[i]){const x=v[i];v[i]=0;const ok=cand(i)&(1<<x);v[i]=x;if(!ok)return {sols,aborted}}
    (function rec(){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      let best=-1,bm=0,bc=99;
      for(let i=0;i<N;i++) if(!v[i]){const m=cand(i);if(!m)return;const c=bits(m);if(c<bc){bc=c;bm=m;best=i;if(c===1)break}}
      if(best<0){sols.push(v.slice());return}
      const xs=[];for(let x=1;x<=n;x++)if(bm&(1<<x))xs.push(x);
      if(random)U.shuffle(xs);
      for(const x of xs){v[best]=x;rec();v[best]=0;if(sols.length>=limit||aborted)return}
    })();
    return {sols,aborted};
  }
  // ¿se resuelve solo con "únicos" (desnudos y ocultos)? → dificultad normal
  function singles(n,units,peers,given){
    const N=n*n, full=((1<<(n+1))-1)&~1, v=Array.from(given);
    const cand=i=>{let m=full;for(const j of peers[i]) if(v[j]) m&=~(1<<v[j]);return m};
    let prog=true;
    while(prog){
      prog=false;
      for(let i=0;i<N;i++) if(!v[i]){const m=cand(i); if(!m)return false; if(bits(m)===1){v[i]=31-Math.clz32(m);prog=true}}
      for(const u of units) for(let x=1;x<=n;x++){
        let pos=-1,cnt=0,has=false;
        for(const i of u){ if(v[i]===x){has=true;break} if(!v[i]&&(cand(i)&(1<<x))){cnt++;pos=i} }
        if(!has&&cnt===1){v[pos]=x;prog=true}
      }
    }
    return v.every(x=>x>0);
  }
  function reduce(sol,ok,ms){
    const clue=sol.slice(), t0=performance.now();
    for(const i of U.shuffle(U.range(sol.length))){
      if(performance.now()-t0>ms)break;
      const k=clue[i]; clue[i]=0;
      if(!ok(clue)) clue[i]=k;
    }
    return clue;
  }
  function dupes(units,v){
    const bad=new Set();
    for(const u of units){const seen={};for(const i of u){const x=v[i];if(x>0){if(seen[x]!==undefined){bad.add(i);bad.add(seen[x])}else seen[x]=i}}}
    return bad;
  }
  // interfaz común: tablero de números con regiones, etiquetas, notas y teclado
  function ui(cfg){
    let tool=1, notesMode=false;
    return {
      render(board,S,api,flash){
        const n=S.n, N=n*n, v=S.st, reg=cfg.borders(S), clue=S.puz.clue, bad=S.errs?cfg.bad(S):new Set();
        board.className='board fl nm'+(cfg.cls?' '+cfg.cls:'');
        board.innerHTML='<div class="gen">Generando…</div>';
        for(let i=0;i<N;i++){
          const r=i/n|0,c=i%n, d=document.createElement('div'), lab=cfg.label?cfg.label(S,i):'';
          d.dataset.i=i;
          d.className='fc'+(clue[i]?' k':'')+(bad.has(i)?' e':'')+(flash===i?' h':'')+(tool&&v[i]===tool?' same':'')
            +((c===n-1||reg[i]!==reg[i+1])?' r':'')+((r===n-1||reg[i]!==reg[i+n])?' b':'');
          let h=lab?`<span class="cg">${lab}</span>`:'';
          if(v[i]>0) h+=v[i];
          else if(v[i]<0){ const m=-v[i]; h+='<div class="notes">'; for(let x=1;x<=n;x++) h+='<span>'+((m&(1<<x))?x:'')+'</span>'; h+='</div>'; }
          d.innerHTML=h;
          board.appendChild(d);
        }
        board.onpointerdown=null; board.onpointermove=null; board.onpointerup=null;
        board.onclick=e=>{
          const el=e.target.closest('.fc'); if(!el)return;
          const S2=api.S, i=+el.dataset.i;
          if(S2.won||S2.puz.clue[i])return;
          api.pushUndo();
          const st=S2.st;
          if(tool===0) st[i]=0;
          else if(notesMode){ const m=st[i]<0?-st[i]:0; if(st[i]>0) st[i]=-(1<<tool); else { const nm=m^(1<<tool); st[i]=nm?-nm:0; } }
          else if(st[i]===tool) st[i]=0;
          else { st[i]=tool; for(const j of cfg.peers(S2)[i]) if(st[j]<0){ const nm=(-st[j])&~(1<<tool); st[j]=nm?-nm:0; } }
          api.commit();
        };
      },
      renderExtra(el,S,api){
        const k=cfg.k?cfg.k(S):S.n; if(tool>k) tool=k;
        el.innerHTML='';
        const pad=document.createElement('div'); pad.className='pad su'; pad.style.setProperty('--k',k+2);
        for(const x of [...U.range(k).map(t=>t+1),0]){
          const b=document.createElement('button'); b.textContent=x||'⌫';
          if(x===tool)b.className='on';
          b.onclick=()=>{tool=x;api.draw();};
          pad.appendChild(b);
        }
        const nb=document.createElement('button'); nb.textContent='✎'; nb.title='Notas';
        if(notesMode) nb.className='notes-on';
        nb.onclick=()=>{notesMode=!notesMode;api.draw();};
        pad.appendChild(nb);
        el.appendChild(pad);
      },
      hint(S){
        if(cfg.hint) return cfg.hint(S);
        const sol=S.puz.sol, N=S.n*S.n;
        const wrong=U.range(N).filter(i=>S.st[i]>0&&S.st[i]!==sol[i]);
        if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta casilla estaba mal'}; }
        const open=U.range(N).filter(i=>S.st[i]<=0);
        if(!open.length) return null;
        const i=U.pick(open); S.st[i]=sol[i];
        return {i,msg:'Aquí va un '+sol[i]};
      }
    };
  }
  return {bits,latinUnits,regUnits,peersOf,search,singles,reduce,dupes,ui};
})();

/* ================== SUDOKU ================== */
(()=>{
  const box=n=>n===4?[2,2]:n===6?[2,3]:[3,3];
  const cache={};
  const geo=n=>cache[n]||(cache[n]=(()=>{
    const [bh,bw]=box(n), reg=U.range(n*n).map(i=>((i/n|0)/bh|0)*(n/bw)+((i%n)/bw|0));
    const units=[...NUMS.latinUnits(n),...NUMS.regUnits(reg)];
    return {reg,units,peers:NUMS.peersOf(units,n*n)};
  })());
  const ui=NUMS.ui({borders:S=>geo(S.n).reg, bad:S=>NUMS.dupes(geo(S.n).units,S.st), peers:S=>geo(S.n).peers});
  register({
    id:'sudoku', name:'Sudoku', jp:true,
    desc:'El clásico: cada fila, columna y caja lleva todos los números sin repetir.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <path d="M4 24.7H64M4 44.3H64M24.7 4V64M44.3 4V64" stroke="var(--ink)" stroke-width="2.5"/>
      <g font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)"><text x="14" y="18">5</text><text x="54" y="18">3</text><text x="34" y="38">7</text><text x="14" y="58">9</text><text x="54" y="58">1</text></g>
      <g font-size="11" font-weight="500" text-anchor="middle" fill="var(--user)"><text x="34" y="18">8</text><text x="54" y="38">2</text></g>
      <rect x="4" y="4" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>`,
    modes:[{id:'n',label:'Normal',short:'Normal',sizes:[4,6,9],defaultSize:9},{id:'x',label:'Experto',short:'Experto',sizes:[6,9],defaultSize:9}],
    rules:`<ol>
      <li>Rellena cada casilla con un número del 1 al N (N es el tamaño del tablero).</li>
      <li>Ningún número puede repetirse en una <b>fila</b>, en una <b>columna</b> ni en una <b>caja</b> (los bloques de borde grueso).</li></ol>
      <ul><li>Elige un número abajo y toca una casilla. Tocarla con el mismo número la borra; ⌫ es la goma.</li>
      <li>✎ activa las <b>notas</b>. Al colocar un número se borran solas esas notas en su fila, columna y caja.</li>
      <li><b>Normal</b> se resuelve buscando casillas con un solo candidato; <b>Experto</b> puede exigir técnicas más finas.</li></ul>`,
    generate(n,mode){
      const g=geo(n);
      const sol=NUMS.search(n,g.peers,new Array(n*n).fill(0),1,1e6,true).sols[0];
      const clue=NUMS.reduce(sol,c=>{
        if(mode!=='x') return NUMS.singles(n,g.units,g.peers,c);
        const r=NUMS.search(n,g.peers,c,2,30000,false); return !r.aborted&&r.sols.length===1;
      },3000);
      return {clue,sol};
    },
    init:(puz)=>puz.clue.slice(),
    solved(S){ return S.st.every(x=>x>0)&&NUMS.dupes(geo(S.n).units,S.st).size===0; },
    render:ui.render, renderExtra:ui.renderExtra, hint:ui.hint
  });
})();

/* ================== NONOMINO (sudoku de piezas) ================== */
(()=>{
  function jigsaw(n){
    const N=n*n, gm=U.geometry(n), reg=U.range(N).map(i=>i/n|0);
    const conn=R=>{ let s=-1,tot=0; for(let i=0;i<N;i++) if(reg[i]===R){tot++; if(s<0)s=i;}
      const seen=new Uint8Array(N),q=[s]; seen[s]=1; let k=1;
      while(q.length){const a=q.pop(); for(const b of gm.nb[a]) if(reg[b]===R&&!seen[b]){seen[b]=1;k++;q.push(b)}}
      return k===tot; };
    for(let it=0;it<N*60;it++){
      const a=Math.random()*N|0, ob=gm.nb[a].filter(b=>reg[b]!==reg[a]); if(!ob.length)continue;
      const A=reg[a], B=reg[U.pick(ob)];
      reg[a]=B;
      const cs=[]; for(let c=0;c<N;c++) if(reg[c]===B&&c!==a&&gm.nb[c].some(j=>reg[j]===A)) cs.push(c);
      if(!cs.length){reg[a]=A;continue}
      const c=U.pick(cs); reg[c]=A;
      if(!conn(A)||!conn(B)){reg[c]=B;reg[a]=A}
    }
    // que no quede ninguna pieza que sea una fila o columna entera
    const units=NUMS.regUnits(reg);
    if(units.some(u=>u.every(i=>(i/n|0)===(u[0]/n|0))||u.every(i=>i%n===u[0]%n))) return null;
    return reg;
  }
  const cache={};
  const geo=reg=>{ const k=reg.join(''); if(cache[k])return cache[k]; const n=Math.round(Math.sqrt(reg.length));
    const units=[...NUMS.latinUnits(n),...NUMS.regUnits(reg)]; return cache[k]={units,peers:NUMS.peersOf(units,n*n)}; };
  const ui=NUMS.ui({borders:S=>S.puz.reg, bad:S=>NUMS.dupes(geo(S.puz.reg).units,S.st), peers:S=>geo(S.puz.reg).peers});
  register({
    id:'nonomino', name:'Nonomino',
    desc:'Un sudoku sin cajas cuadradas: las piezas tienen formas irregulares.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <path d="M4 24H24V44H44V64 M44 4V24H64 M4 44H24 M44 44H64" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
      <g font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)"><text x="14" y="18">3</text><text x="54" y="38">1</text><text x="34" y="58">2</text></g>
      <g font-size="11" font-weight="500" text-anchor="middle" fill="var(--user)"><text x="34" y="38">4</text></g>
      <rect x="4" y="4" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>`,
    modes:[{id:'n',label:'Normal',short:'Normal',sizes:[5,6,7,8,9],defaultSize:9},{id:'x',label:'Experto',short:'Experto',sizes:[6,7,8,9],defaultSize:9}],
    rules:`<ol>
      <li>Rellena cada casilla con un número del 1 al N.</li>
      <li>Ningún número puede repetirse en una <b>fila</b>, en una <b>columna</b> ni en una <b>pieza</b> (las zonas de borde grueso, todas de N casillas).</li></ol>
      <ul><li>Elige un número abajo y toca una casilla. Tocarla con el mismo número la borra; ⌫ es la goma.</li>
      <li>✎ activa las <b>notas</b>. Al colocar un número se borran solas esas notas en su fila, columna y pieza.</li></ul>`,
    generate(n,mode){
      for(;;){
        const reg=jigsaw(n); if(!reg)continue;
        const g=geo(reg), r=NUMS.search(n,g.peers,new Array(n*n).fill(0),1,60000,true);
        if(!r.sols.length)continue;
        const sol=r.sols[0];
        const clue=NUMS.reduce(sol,c=>{
          if(mode!=='x') return NUMS.singles(n,g.units,g.peers,c);
          const q=NUMS.search(n,g.peers,c,2,30000,false); return !q.aborted&&q.sols.length===1;
        },3000);
        return {reg,clue,sol};
      }
    },
    init:(puz)=>puz.clue.slice(),
    solved(S){ return S.st.every(x=>x>0)&&NUMS.dupes(geo(S.puz.reg).units,S.st).size===0; },
    render:ui.render, renderExtra:ui.renderExtra, hint:ui.hint
  });
})();

/* ================== KENKEN (CALCUDOKU) ================== */
(()=>{
  const OPS={'+':a=>a.reduce((x,y)=>x+y,0),'×':a=>a.reduce((x,y)=>x*y,1),'−':a=>Math.abs(a[0]-a[1]),'÷':a=>Math.max(...a)/Math.min(...a)};
  function pickOp(vals){
    const k=vals.length; if(k===1) return {op:'',t:vals[0]};
    if(k===2){ const hi=Math.max(...vals), lo=Math.min(...vals), r=Math.random();
      if(hi%lo===0&&lo>1&&r<0.5) return {op:'÷',t:hi/lo};
      if(r<0.65) return {op:'−',t:hi-lo}; }
    const op=Math.random()<0.55?'+':'×'; return {op,t:OPS[op](vals)};
  }
  function cages(n){
    const N=n*n, gm=U.geometry(n), cg=new Array(N).fill(-1); let id=0, left=N;
    const free=i=>gm.nb[i].reduce((a,j)=>a+(cg[j]<0),0);
    while(left){
      let best=[],bf=9;
      for(let i=0;i<N;i++) if(cg[i]<0){const f=free(i);if(f<bf){bf=f;best=[i]}else if(f===bf)best.push(i)}
      const s=U.pick(best), r=Math.random(), target=r<0.06?1:r<0.5?2:r<0.85?3:4, cells=[s]; cg[s]=id;
      while(cells.length<target){ const f=[]; for(const c of cells) for(const j of gm.nb[c]) if(cg[j]<0&&!f.includes(j)) f.push(j); if(!f.length)break; const j=U.pick(f); cg[j]=id; cells.push(j); }
      left-=cells.length; id++;
    }
    return cg;
  }
  function tuples(cells,n,op,t){
    const k=cells.length, out=[], v=new Array(k), rc=cells.map(i=>[i/n|0,i%n]);
    (function rec(p,acc){
      if(p===k){ if(op===''?v[0]===t:OPS[op](v)===t) out.push(v.slice()); return; }
      for(let x=1;x<=n;x++){
        let ok=true; for(let q=0;q<p;q++) if(v[q]===x&&(rc[q][0]===rc[p][0]||rc[q][1]===rc[p][1])){ok=false;break}
        if(!ok)continue;
        if(op==='+'&&acc+x>t)break;
        if(op==='×'&&t%(acc*x))continue;
        v[p]=x; rec(p+1,op==='+'?acc+x:op==='×'?acc*x:0);
      }
    })(0,op==='×'?1:0);
    return out;
  }
  function model(puz,n){
    const cells={}; puz.cg.forEach((c,i)=>(cells[c]=cells[c]||[]).push(i));
    const tup={}, pos=new Array(n*n);
    for(const c in cells){ tup[c]=tuples(cells[c],n,puz.ops[c].op,puz.ops[c].t); cells[c].forEach((i,q)=>pos[i]=q); }
    return {cells,tup,pos};
  }
  function solve(puz,n,given,limit,maxNodes,random){
    const M=model(puz,n), peers=NUMS.peersOf(NUMS.latinUnits(n),n*n);
    const extra=(i,v)=>{
      const c=puz.cg[i], cs=M.cells[c], p=M.pos[i]; let m=0;
      for(const t of M.tup[c]){ let ok=true; for(let q=0;q<cs.length;q++){ const x=v[cs[q]]; if(x&&t[q]!==x){ok=false;break} } if(ok) m|=1<<t[p]; }
      return m;
    };
    return NUMS.search(n,peers,given,limit,maxNodes,random,extra);
  }
  function generate(n){
    const N=n*n, gm=U.geometry(n), peers=NUMS.peersOf(NUMS.latinUnits(n),N);
    const sol=NUMS.search(n,peers,new Array(N).fill(0),1,1e6,true).sols[0];
    let cg=cages(n), ops={};
    const opFor=c=>{ ops[c]=pickOp(U.range(N).filter(i=>cg[i]===c).map(i=>sol[i])); };
    [...new Set(cg)].forEach(opFor);
    for(let tries=0;tries<400;tries++){
      const puz={cg,ops};
      const r=solve(puz,n,new Array(N).fill(0),2,40000,false);
      if(r.aborted){ cg=cages(n); ops={}; [...new Set(cg)].forEach(opFor); continue; }
      if(r.sols.length===1) break;
      // reparación: separa una casilla en la que difieren las soluciones
      const alt=r.sols.find(s=>s.some((x,i)=>x!==sol[i]));
      const d=U.pick(U.range(N).filter(i=>alt[i]!==sol[i])), old=cg[d];
      let next=Math.max(...cg)+1;
      cg=cg.slice(); cg[d]=next++; opFor(cg[d]);
      const rest=U.range(N).filter(i=>cg[i]===old), seen=new Set();
      const ids=[];
      for(const s of rest){ if(seen.has(s))continue;
        const comp=[s],q=[s]; seen.add(s);
        while(q.length){const a=q.pop(); for(const b of gm.nb[a]) if(cg[b]===old&&!seen.has(b)){seen.add(b);comp.push(b);q.push(b)}}
        const id=ids.length?next++:old; ids.push(id); comp.forEach(i=>cg[i]=id);
      }
      ids.forEach(opFor);
      for(const k in ops) if(!cg.includes(+k)) delete ops[k];
    }
    // números de las jaulas de una sola casilla ya vienen puestos
    const clue=U.range(N).map(i=>ops[cg[i]].op===''?sol[i]:0);
    return {cg,ops,clue,sol};
  }
  function bad(S){
    const n=S.n, v=S.st, b=NUMS.dupes(NUMS.latinUnits(n),v), M={};
    S.puz.cg.forEach((c,i)=>(M[c]=M[c]||[]).push(i));
    for(const c in M){ const cs=M[c]; if(cs.some(i=>!(v[i]>0)))continue; const {op,t}=S.puz.ops[c];
      if((op===''?v[cs[0]]:OPS[op](cs.map(i=>v[i])))!==t) cs.forEach(i=>b.add(i)); }

/* ================== SHIKAKU ================== */
(()=>{
  const enc=(r,c,h,w,n)=>((r*n+c)*n+(h-1))*n+(w-1)+1;
  const dec=(code,n)=>{let x=code-1;const w=x%n+1;x=x/n|0;const h=x%n+1;x=x/n|0;return {r:x/n|0,c:x%n,h,w}};
  const cellsOf=({r,c,h,w},n)=>{const o=[];for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)o.push(y*n+x);return o};
  function partition(n){
    const N=n*n, cov=new Int32Array(N).fill(-1), rects=[], maxA=n<=6?8:n<=8?10:12;
    for(let i=0;i<N;i++){
      if(cov[i]>=0)continue;
      const r=i/n|0,c=i%n, opts=[];
      let wMax=0; while(c+wMax<n&&cov[r*n+c+wMax]<0)wMax++;
      for(let w=1;w<=wMax;w++) for(let h=1;r+h<=n;h++){
        let ok=true; for(let x=0;x<w;x++) if(cov[(r+h-1)*n+c+x]>=0){ok=false;break}
        if(!ok||w*h>maxA)break;
        const a=w*h; opts.push({r,c,w,h,wt:a===1?0.12:a===2?0.5:(Math.max(w,h)>5?0.4:1)});
      }
      let x=Math.random()*opts.reduce((s,o)=>s+o.wt,0), o=opts[0];
      for(const p of opts){x-=p.wt;if(x<=0){o=p;break}}
      cellsOf(o,n).forEach(j=>cov[j]=rects.length); rects.push({r:o.r,c:o.c,w:o.w,h:o.h});
    }
    return rects;
  }
  function solve(clues,n,limit,maxNodes){
    const N=n*n, ks=[], opts=[];

      const a=clues[i], r0=i/n|0, c0=i%n, L=[];
      for(let w=1;w<=a;w++){ if(a%w)continue; const h=a/w; if(w>n||h>n)continue;
        for(let r=Math.max(0,r0-h+1);r<=Math.min(r0,n-h);r++) for(let c=Math.max(0,c0-w+1);c<=Math.min(c0,n-w);c++){

        } }

    const cov=new Uint8Array(N), chosen=new Array(ks.length).fill(null), sols=[]; let nodes=0, aborted=false;
    const reach=new Uint8Array(N);

      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!left){ sols.push(chosen.map(o=>({r:o.r,c:o.c,w:o.w,h:o.h}))); return; }
      reach.fill(0);
      let bk=-1,bl=null;
      for(let k=0;k<ks.length;k++){ if(chosen[k])continue;
        const L=opts[k].filter(o=>o.cells.every(j=>!cov[j]));
        if(!L.length)return;
        for(const o of L) for(const j of o.cells) reach[j]=1;
        if(!bl||L.length<bl.length){bk=k;bl=L} }
      for(let j=0;j<N;j++) if(!cov[j]&&!reach[j]) return;
      for(const o of bl){ o.cells.forEach(j=>cov[j]=1); chosen[bk]=o; rec(left-1); chosen[bk]=null; o.cells.forEach(j=>cov[j]=0); if(sols.length>=limit||aborted)return; }
    })(ks.length);
    return {sols,aborted};
  }
  function generate(n){
    const N=n*n;
    for(;;){
      const rects=partition(n);
      for(let t=0;t<8;t++){
        const clues=new Array(N).fill(0);
        for(const R of rects) clues[U.pick(cellsOf(R,n))]=R.w*R.h;
        const r=solve(clues,n,2,20000);
        if(!r.aborted&&r.sols.length===1) return {clues,sol:rects.map(R=>enc(R.r,R.c,R.h,R.w,n))};
      }
    }
  }
  function groups(S){ const G={}; S.st.forEach((x,i)=>{ if(x)(G[x]=G[x]||[]).push(i); }); return G; }
  function okRect(S,code,cs){ const cl=cs.filter(i=>S.puz.clues[i]); return cl.length===1&&S.puz.clues[cl[0]]===cs.length; }

  let drag=null;
  register({
    id:'shikaku', name:'Shikaku', jp:true,
    desc:'Divide la cuadrícula en rectángulos: cada uno con un número igual a su área.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <rect x="4" y="4" width="40" height="20" fill="hsl(30 70% 82%)"/><rect x="44" y="4" width="20" height="40" fill="hsl(200 60% 82%)"/>
      <rect x="4" y="24" width="20" height="40" fill="hsl(140 45% 80%)"/><rect x="24" y="24" width="20" height="20" fill="hsl(280 45% 85%)"/><rect x="24" y="44" width="40" height="20" fill="hsl(50 70% 80%)"/>
      <path d="M4 24H44 M44 4V44 M24 24V64 M24 44H64 M44 24 M24 24" stroke="#2b2620" stroke-width="2.5" fill="none"/>
      <g font-size="11" font-weight="800" text-anchor="middle" fill="#2b2620"><text x="14" y="18">2</text><text x="54" y="38">2</text><text x="14" y="58">2</text><text x="34" y="38">1</text><text x="54" y="58">2</text></g>
      <rect x="4" y="4" width="60" height="60" fill="none" stroke="#2b2620" stroke-width="2.5"/></svg>`,
    sizes:[5,6,7,8,10], defaultSize:7,
    rules:`<ol>
      <li>Divide toda la cuadrícula en <b>rectángulos</b> (o cuadrados) siguiendo las líneas.</li>
      <li>Cada rectángulo contiene <b>exactamente un número</b>, y ese número es su área: un 6 puede ser de 1×6, 2×3, 3×2 o 6×1.</li></ol>
      <ul><li><b>Arrastra</b> de una esquina a la opuesta para dibujar un rectángulo. Si pisa otros, los sustituye.</li>
      <li>Toca un rectángulo para borrarlo. Tocar una casilla vacía crea un rectángulo de 1×1.</li>
      <li>Truco: empieza por los números grandes pegados al borde, que tienen pocas formas posibles.</li></ul>`,
    generate,
    init:(puz,n)=>new Array(n*n).fill(0),
    solved(S){
      if(S.st.some(x=>!x))return false;
      const G=groups(S); return Object.keys(G).every(k=>okRect(S,+k,G[k]));
    },
    render(board,S,api,flash){
      const n=S.n, st=S.st, {clues}=S.puz, G=groups(S);
      let h=`<svg viewBox="0 0 ${n} ${n}"><rect class="bgd" x="0" y="0" width="${n}" height="${n}"/>`;
      const codes=Object.keys(G).map(Number);
      for(const code of codes){
        const R=dec(code,n), ok=okRect(S,code,G[code]);
        const hue=(R.r*7+R.c*13)*29%360;
        h+=`<rect class="rc${S.errs&&!ok?' e':''}${flash===code?' h':''}" style="--h:${hue}" x="${R.c}" y="${R.r}" width="${R.w}" height="${R.h}"/>`;
      }
      for(let k=1;k<n;k++) h+=`<line class="gl" x1="${k}" y1="0" x2="${k}" y2="${n}"/><line class="gl" x1="0" y1="${k}" x2="${n}" y2="${k}"/>`;
      for(const code of codes){ const R=dec(code,n); h+=`<rect class="ro" x="${R.c}" y="${R.r}" width="${R.w}" height="${R.h}"/>`; }
      if(drag&&drag.b>=0){ const R=drag.rect(n); h+=`<rect class="pv" x="${R.c}" y="${R.r}" width="${R.w}" height="${R.h}"/><text class="pa" x="${R.c+R.w/2}" y="${R.r+R.h/2}">${R.w*R.h}</text>`; }
      for(let i=0;i<n*n;i++) if(clues[i]) h+=`<text class="cl" x="${i%n+.5}" y="${(i/n|0)+.5}">${clues[i]}</text>`;
      board.className='board sk';
      board.innerHTML='<div class="gen">Generando…</div>'+h+'<rect class="fr" x="0" y="0" width="'+n+'" height="'+n+'"/></svg>';
      const cellAt=e=>{const r=board.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);return [Math.max(0,Math.min(n-1,y)),Math.max(0,Math.min(n-1,x))]};

      board.onpointermove=e=>{
