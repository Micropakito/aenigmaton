/* ================== KUROMASU (KURODOKO) ================== */
(()=>{
  const D4=[[0,1],[1,0],[0,-1],[-1,0]];
  const rayCache={};
  const rays=n=>rayCache[n]||(rayCache[n]=U.range(n*n).map(i=>D4.map(([dr,dc])=>{const o=[];let r=(i/n|0)+dr,c=i%n+dc;while(r>=0&&c>=0&&r<n&&c<n){o.push(r*n+c);r+=dr;c+=dc}return o})));
  const sees=(n,white,i)=>1+rays(n)[i].reduce((a,ray)=>{let k=0;while(k<ray.length&&white(ray[k]))k++;return a+k},0);
  function build(n){
    const gm=U.geometry(n), sh=new Array(gm.N).fill(false);
    const target=Math.round(gm.N*(0.2+Math.random()*0.07)); let k=0;
    for(const i of U.shuffle(U.range(gm.N))){
      if(k>=target)break;
      if(gm.nb[i].some(j=>sh[j]))continue;
      sh[i]=true;
      if(!U.connected(j=>sh[j],gm)){sh[i]=false;continue;}
      k++;
    }
    return sh;
  }
  function solve(clue,n,limit,maxNodes){
    const gm=U.geometry(n), N=gm.N, R=rays(n), cl=U.range(N).filter(i=>clue[i]), sols=[]; let nodes=0,aborted=false;
    const onRay=new Uint8Array(N); for(const i of cl) for(const ray of R[i]) for(const j of ray) onRay[j]=1;
    function prop(st){
      let ch=true;
      while(ch){
        ch=false;
        for(let i=0;i<N;i++) if(st[i]===2) for(const j of gm.nb[i]){ if(st[j]===2)return false; if(!st[j]){st[j]=1;ch=true} }
        for(const i of cl){
          const t=clue[i]; let mn=1,mx=1; const info=[];
          for(const ray of R[i]){ let a=0; while(a<ray.length&&st[ray[a]]===1)a++; let b=a; while(b<ray.length&&st[ray[b]]!==2)b++; mn+=a; mx+=b; info.push([a,b]); }
          if(mn>t||mx<t) return false;
          for(let d=0;d<4;d++){
            const ray=R[i][d], [a,b]=info[d];
            if(a>=ray.length||st[ray[a]]) continue;  // no hay desconocida al final del tramo blanco
            if(mx===t){ for(let q=a;q<b;q++) if(!st[ray[q]]){st[ray[q]]=1;ch=true} }
            else if(mn===t){ st[ray[a]]=2; ch=true; }
            else if(mx-(b-a)<t){ st[ray[a]]=1; ch=true; }
          }
        }
      }
      return U.connected(j=>st[j]===2,gm);
    }
    (function rec(st){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!prop(st))return;
      let i=-1; for(let j=0;j<N;j++) if(!st[j]&&onRay[j]){i=j;break}
      if(i<0) i=st.indexOf(0);
      if(i<0){ for(const c of cl) if(sees(n,j=>st[j]!==2,c)!==clue[c]) return; sols.push(Array.from(st)); return; }
      for(const v of [2,1]){ const s=st.slice(); s[i]=v; rec(s); if(sols.length>=limit||aborted)return; }
    })(Int8Array.from(clue,x=>x?1:0));
    return {sols,aborted};
  }
  function check(S){
    const n=S.n, gm=U.geometry(n), st=S.st, {clue}=S.puz, R=rays(n), bad=new Set(), ok=new Set();
    for(let i=0;i<gm.N;i++) if(st[i]===1) for(const j of gm.nb[i]) if(st[j]===1){bad.add(i);bad.add(j)}
    for(let i=0;i<gm.N;i++) if(clue[i]){
      let mn=1,mx=1;
      for(const ray of R[i]){ let a=0; while(a<ray.length&&st[ray[a]]===2||a<ray.length&&clue[ray[a]])a++; let b=0; while(b<ray.length&&st[ray[b]]!==1)b++; mn+=a; mx+=b; }
      if(mn>clue[i]||mx<clue[i]) bad.add(i); else if(mn===clue[i]&&mx===clue[i]) ok.add(i);
    }
    return {bad,ok};
  }
  register({
    id:'kuromasu', name:'Kuromasu', jp:true,
    desc:'Ennegrece casillas para que cada número vea exactamente esas casillas blancas en línea recta.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--line)"/>${[0,1,2].map(r=>[0,1,2].map(c=>{const s=(r===0&&c===2)||(r===2&&c===0);const t={'0,0':'4','1,1':'5','2,2':'3'}[r+','+c]||'';return `<rect x="${4+c*21}" y="${4+r*21}" width="18" height="18" rx="3" fill="${s?'var(--shade)':'var(--card)'}"/>${t?`<text x="${13+c*21}" y="${18+r*21}" font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)">${t}</text>`:''}`}).join('')).join('')}</svg>`,
    sizes:[5,6,7,8,9], defaultSize:7,
    rules:`<ol>
      <li>Pinta de negro algunas casillas. Las casillas con número son siempre blancas.</li>
      <li>Cada número dice cuántas casillas blancas <b>ve</b> en horizontal y vertical, <b>contándose a sí misma</b>. La vista se corta en la primera casilla negra o en el borde.</li>
      <li>Dos casillas negras no pueden tocarse por un lado.</li>
      <li>Todas las casillas blancas deben formar un único bloque conectado.</li></ol>
      <ul><li>Toca una casilla: <b>negra</b> → <b>círculo</b> (seguro que es blanca) → vacía.</li>
      <li>Los números ya cumplidos se atenúan.</li>
      <li>Truco: si un número es tan grande como todo lo que puede ver, todas esas casillas son blancas.</li></ul>`,
    generate(n){
      for(;;){
        const sh=build(n), N=n*n, sol=sh.map(x=>x?2:1);
        const clue=U.range(N).map(i=>sh[i]?0:sees(n,j=>!sh[j],i));
        const t0=performance.now();
        for(const i of U.shuffle(U.range(N).filter(i=>clue[i]))){
          if(performance.now()-t0>3000)break;
          const k=clue[i]; clue[i]=0;
          const r=solve(clue,n,2,4000);
          if(r.aborted||r.sols.length!==1) clue[i]=k;
        }
        const r=solve(clue,n,2,20000);
        if(!r.aborted&&r.sols.length===1) return {clue,sol};
      }
    },
    init:(puz,n)=>new Array(n*n).fill(0),   // 0 vacía, 1 negra, 2 círculo
    solved(S){
      const n=S.n, gm=U.geometry(n), bl=i=>S.st[i]===1&&!S.puz.clue[i];
      for(let i=0;i<gm.N;i++) if(bl(i)&&gm.nb[i].some(bl)) return false;
      if(!U.connected(bl,gm)) return false;
      for(let i=0;i<gm.N;i++) if(S.puz.clue[i]&&sees(n,j=>!bl(j),i)!==S.puz.clue[i]) return false;
      return true;
    },
    render(board,S,api,flash){
      const gm=U.geometry(S.n), {clue}=S.puz, A=check(S);
      board.className='board hi km';
      board.innerHTML='<div class="gen">Generando…</div>';
      for(let i=0;i<gm.N;i++){
        const c=document.createElement('button'), st=S.st[i];
        c.className='hc'+(clue[i]?' k'+(A.ok.has(i)&&!S.won?' ok':''):st===1?' s':st===2?' c':'')+(S.errs&&A.bad.has(i)?' e':'')+(flash===i?' h':'');
        c.textContent=clue[i]||'';
        c.onclick=()=>{ if(S.won||clue[i])return; api.pushUndo(); S.st[i]=(S.st[i]+1)%3; api.commit(); };
        board.appendChild(c);
      }
    },
    hint(S){
      const {sol,clue}=S.puz, N=S.n*S.n;
      const wrong=U.range(N).filter(i=>!clue[i]&&((S.st[i]===1&&sol[i]!==2)||(S.st[i]===2&&sol[i]===2)));
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta casilla estaba mal'}; }
      const open=U.range(N).filter(i=>!clue[i]&&S.st[i]===0);
      if(!open.length) return null;
      const bl=open.filter(i=>sol[i]===2), i=U.pick(bl.length?bl:open);
      S.st[i]=sol[i]===2?1:2;
      return {i,msg:sol[i]===2?'Esta va en negro':'Esta queda blanca'};
    }
  });
})();

/* ================== GOKIGEN (SLANT) ================== */
(()=>{
  // casilla: 0 vacía, 1 "\" , 2 "/"

    },
    hint(S){
      const {sol}=S.puz, M=S.st.length;
      const wrong=U.range(M).filter(e=>(S.st[e]===1&&!sol[e])||(S.st[e]===2&&sol[e]));
      if(wrong.length){ const e=U.pick(wrong); const was=S.st[e]; S.st[e]=0; return {i:e,msg:was===1?'Por aquí no pasa el lazo':'Aquí sí pasa el lazo'}; }
      const miss=U.range(M).filter(e=>sol[e]&&S.st[e]!==1);
      if(!miss.length) return null;
      const e=U.pick(miss); S.st[e]=1;
      return {i:e,msg:'El lazo pasa por aquí'};
    }
  });
})();

const SHADE={
  render(board,S,api,flash,o){

    board.className='board fl shg '+(o.cls||'');
    board.innerHTML='<div class="gen">Generando…</div>';
    for(let i=0;i<N;i++){
      const r=i/n|0,c=i%n, d=document.createElement('div'), x=o.cell(i);
      d.dataset.i=i;
      d.className='fc '+(x.c||'')+(flash===i?' h':'')+((c===n-1||(reg&&reg[i]!==reg[i+1]))?' r':'')+((r===n-1||(reg&&reg[i]!==reg[i+n]))?' b':'');
      d.innerHTML=x.h||'';
      board.appendChild(d);
    }
    const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.fc');return c&&board.contains(c)?+c.dataset.i:-1};
    board.onclick=null;
    board.onpointerdown=e=>{
      const S2=api.S; if(!S2||S2.won)return;
      const i=cellAt(e); if(i<0||o.fixed(i))return;
      e.preventDefault(); try{board.setPointerCapture(e.pointerId)}catch(_){}
      api.pushUndo();
      const val=(S2.st[i]+1)%(o.states||3); S2.st[i]=val;
      board._g={val,last:i}; api.draw();
    };
    board.onpointermove=e=>{
      const g=board._g; if(!g)return; const j=cellAt(e); if(j<0||j===g.last)return;
      g.last=j; const S2=api.S;
      if(!o.fixed(j)&&S2.st[j]!==g.val){S2.st[j]=g.val;api.draw();}
    };
    board.onpointerup=board.onpointercancel=()=>{ if(!board._g)return; board._g=null; api.commit(); };
  }
};
// Pintar casillas en un SVG (toCell(e) → índice o -1)
function bindPaint(board,api,toCell,fixed){
  board.onclick=null;
  board.onpointerdown=e=>{
    const S2=api.S; if(!S2||S2.won)return;
    const i=toCell(e); if(i<0||(fixed&&fixed(i)))return;
    e.preventDefault(); try{board.setPointerCapture(e.pointerId)}catch(_){}
    api.pushUndo();
    const val=(S2.st[i]+1)%3; S2.st[i]=val; board._g={val,last:i}; api.draw();
  };
  board.onpointermove=e=>{
    const g=board._g; if(!g)return; const j=toCell(e); if(j<0||j===g.last)return;
    g.last=j; const S2=api.S;
    if(!(fixed&&fixed(j))&&S2.st[j]!==g.val){S2.st[j]=g.val;api.draw();}
  };
  board.onpointerup=board.onpointercancel=()=>{ if(!board._g)return; board._g=null; api.commit(); };
}
// Pista estándar para juegos de sombrear (st: 1 negra, 2 marca blanca; sol: true = negra)
function shadeHint(S,isBlack,fixed,msgs){
  const N=S.st.length;
  const wrong=U.range(N).filter(i=>!fixed(i)&&((S.st[i]===1&&!isBlack(i))||(S.st[i]===2&&isBlack(i))));
  if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta casilla estaba mal'}; }
  const open=U.range(N).filter(i=>!fixed(i)&&S.st[i]===0);
  if(!open.length) return null;
  const bl=open.filter(isBlack), i=U.pick(bl.length?bl:open);
  S.st[i]=isBlack(i)?1:2;
  return {i,msg:isBlack(i)?(msgs?msgs[0]:'Esta va en negro'):(msgs?msgs[1]:'Esta queda blanca')};
}
// Partición en rectángulos (Shikaku, Tatamibari, Heyawake)
const RECT={
  cellsOf:({r,c,h,w},n)=>{const o=[];for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)o.push(y*n+x);return o},
  partition(n,maxA,wt){
    const N=n*n, cov=new Int32Array(N).fill(-1), rects=[];
    for(let i=0;i<N;i++){
      if(cov[i]>=0)continue;
      const r=i/n|0,c=i%n, opts=[];
      let wMax=0; while(c+wMax<n&&cov[r*n+c+wMax]<0)wMax++;
      for(let w=1;w<=wMax;w++) for(let h=1;r+h<=n;h++){
        let ok=true; for(let x=0;x<w;x++) if(cov[(r+h-1)*n+c+x]>=0){ok=false;break}
        if(!ok||w*h>maxA)break;
        opts.push({r,c,w,h,wt:wt(w,h)});
      }
      let x=Math.random()*opts.reduce((s,o)=>s+o.wt,0), o=opts[0];
      for(const p of opts){x-=p.wt;if(x<=0){o=p;break}}
      RECT.cellsOf(o,n).forEach(j=>cov[j]=rects.length); rects.push({r:o.r,c:o.c,w:o.w,h:o.h});
    }
    return {rects,cov:Array.from(cov)};
  }
};

(()=>{
  const runs=line=>{const o=[];let k=0;for(const x of line){if(x===1)k++;else if(k){o.push(k);k=0}}if(k)o.push(k);return o};
  // deduce lo seguro de una línea: -1 desconocida, 0 vacía, 1 llena; null si es imposible
  function lineSolve(clue,line){
    const L=line.length, B=clue.length;
    const F=Array.from({length:B+1},()=>new Uint8Array(L+1));
    F[B][L]=1; for(let p=L-1;p>=0;p--) F[B][p]=line[p]!==1&&F[B][p+1]?1:0;
    for(let b=B-1;b>=0;b--){ const len=clue[b];
      for(let p=L-1;p>=0;p--){
        let ok=line[p]!==1&&F[b][p+1];
        if(!ok&&p+len<=L){ let fit=true; for(let q=p;q<p+len;q++) if(line[q]===0){fit=false;break}
          if(fit&&(p+len===L||line[p+len]!==1)&&F[b+1][p+len===L?L:p+len+1]) ok=1; }
        F[b][p]=ok?1:0;
      } }
    if(!F[0][0]) return null;
    const R=Array.from({length:B+1},()=>new Uint8Array(L+1)), cf=new Uint8Array(L), ce=new Uint8Array(L);
    R[0][0]=1;
    for(let p=0;p<L;p++) for(let b=0;b<=B;b++){
      if(!R[b][p]||!F[b][p])continue;
      if(line[p]!==1&&F[b][p+1]){ce[p]=1;R[b][p+1]=1}
      if(b<B){ const len=clue[b];
        if(p+len<=L){ let fit=true; for(let q=p;q<p+len;q++) if(line[q]===0){fit=false;break}
          const nx=p+len===L?L:p+len+1;
          if(fit&&(p+len===L||line[p+len]!==1)&&F[b+1][nx]){ for(let q=p;q<p+len;q++)cf[q]=1; if(p+len<L)ce[p+len]=1; R[b+1][nx]=1; } } }
    }
    return Array.from(line,(x,p)=>cf[p]&&!ce[p]?1:ce[p]&&!cf[p]?0:x);
  }
  function logicSolve(rc,cc,n){
    const g=new Array(n*n).fill(-1); let ch=true;
    while(ch){ ch=false;
      for(let r=0;r<n;r++){ const idx=U.range(n).map(c=>r*n+c), nl=lineSolve(rc[r],idx.map(i=>g[i])); if(!nl)return null; nl.forEach((x,k)=>{if(g[idx[k]]!==x){g[idx[k]]=x;ch=true}}); }
      for(let c=0;c<n;c++){ const idx=U.range(n).map(r=>r*n+c), nl=lineSolve(cc[c],idx.map(i=>g[i])); if(!nl)return null; nl.forEach((x,k)=>{if(g[idx[k]]!==x){g[idx[k]]=x;ch=true}}); }
    }
    return g;
  }
  const rowsOf=(v,n)=>U.range(n).map(r=>runs(U.range(n).map(c=>v[r*n+c])));
  const colsOf=(v,n)=>U.range(n).map(c=>runs(U.range(n).map(r=>v[r*n+c])));
  register({
    id:'nonograma', name:'Nonograma', jp:true,
    desc:'Picross: rellena casillas según los números de cada fila y columna y descubre el dibujo.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g font-size="8" font-weight="800" fill="var(--ink)" text-anchor="middle"><text x="30" y="13">1</text><text x="42" y="13">3</text><text x="54" y="13">1</text><text x="13" y="30">1 1</text><text x="13" y="42">3</text><text x="13" y="54">1</text></g>
      ${[[0,0],[2,0],[0,1],[1,1],[2,1],[1,2]].map(([c,r])=>`<rect x="${24+c*12}" y="${21+r*12}" width="11" height="11" fill="var(--ink)"/>`).join('')}
      <rect x="24" y="21" width="36" height="36" fill="none" stroke="var(--ink)" stroke-width="1.5"/></svg>`,
    modes:[{id:'d',label:'Dibujos',short:'Dibujo',sizes:[5,10,15],defaultSize:10},{id:'a',label:'Aleatorio',short:'Aleat.',sizes:[5,8,10,12,15],defaultSize:10}],
    rules:`<ol>
      <li>Los números de cada fila y columna dicen la longitud de los <b>bloques de casillas rellenas</b> que hay en ella, en orden.</li>
      <li>Entre dos bloques tiene que haber al menos una casilla vacía.</li>
      <li>En el modo <b>Dibujos</b> sale una de las 50 imágenes de la colección; en <b>Aleatorio</b>, un patrón abstracto nuevo cada vez.</li></ol>
      <ul><li>Toca una casilla: <b>rellena</b> → <b>✕</b> (seguro que está vacía) → vacía. Arrastra para pintar varias igual.</li>
      <li>Las filas y columnas ya correctas atenúan sus números.</li>
      <li>Truco: en una fila de 10 con un 7, las 4 casillas centrales van rellenas seguro.</li></ul>`,
    generate(n,mode){
      if(mode!=='a'&&NONO_PICS[n]){
        const L=NONO_PICS[n], key='nono-vistos-'+n, seen=U.load(key)||[];
        let opts=L.filter(p=>!seen.includes(p[0])); if(!opts.length){opts=L;seen.length=0}
        const [name,rows]=U.pick(opts); seen.push(name); U.save(key,seen);
        const v=rows.join('').split('').map(c=>c==='#'?1:0);
        return {rc:rowsOf(v,n),cc:colsOf(v,n),sol:v,name};
      }
      for(;;){
        const dens=0.52+Math.random()*0.1, v=U.range(n*n).map(()=>Math.random()<dens?1:0);
        const rc=rowsOf(v,n), cc=colsOf(v,n), g=logicSolve(rc,cc,n);
        if(g&&g.every(x=>x>=0)) return {rc,cc,sol:v};

      const rOk=rowsOf(v,n).map((r,k)=>r.join()===rc[k].join()), cOk=colsOf(v,n).map((c,k)=>c.join()===cc[k].join());

        else if(x===2) h+=`<path class="xm${S.errs&&S.puz.sol[i]?' e':''}" d="M${X+.3} ${Y+.3}L${X+.7} ${Y+.7}M${X+.7} ${Y+.3}L${X+.3} ${Y+.7}"/>`;
        else if(flash===i) h+=`<rect class="hl" x="${X}" y="${Y}" width="1" height="1"/>`; });

      h+=`<rect class="fr" x="${K}" y="${L}" width="${n}" height="${n}"/></svg>`;
      board.className='board ng';

      const toCell=e=>{const r=board.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*(K+n)-K,y=(e.clientY-r.top)/r.height*(L+n)-L;if(x<0||y<0||x>=n||y>=n)return -1;return Math.floor(y)*n+Math.floor(x)};

/* ================== AKARI ================== */
(()=>{
  function views(blk,n){ // casillas blancas visibles desde cada blanca
    const N=n*n, V=[];
    for(let i=0;i<N;i++){ const o=[]; if(!blk[i]) for(const [dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]]){ let r=(i/n|0)+dr,c=i%n+dc; while(r>=0&&c>=0&&r<n&&c<n&&!blk[r*n+c]){o.push(r*n+c);r+=dr;c+=dc} } V.push(o); }
    return V;
  }
  function solve(blk,num,n,limit,maxNodes){
    const N=n*n, V=views(blk,n), gm=U.geometry(n), sols=[]; let nodes=0,aborted=false;
    const nums=U.range(N).filter(i=>blk[i]&&num[i]>=0);
    const near=new Uint8Array(N); nums.forEach(i=>gm.nb[i].forEach(j=>near[j]=1));
    function prop(s){ // s: 0 ?, 1 luz, 2 sin luz (solo blancas)
      let ch=true;
      while(ch){ ch=false;
        for(let i=0;i<N;i++) if(s[i]===1) for(const j of V[i]){ if(s[j]===1)return false; if(!s[j]){s[j]=2;ch=true} }
        for(const i of nums){ let L=0,u=[]; for(const j of gm.nb[i]) if(!blk[j]){ if(s[j]===1)L++; else if(!s[j])u.push(j); }
          const t=num[i]; if(L>t||L+u.length<t)return false;
          if(u.length&&L===t){u.forEach(j=>s[j]=2);ch=true} else if(u.length&&L+u.length===t){u.forEach(j=>s[j]=1);ch=true} }
        for(let i=0;i<N;i++){ if(blk[i]||s[i]===1)continue;
          if(V[i].some(j=>s[j]===1))continue;
          const c=[]; if(!s[i])c.push(i); for(const j of V[i]) if(!s[j])c.push(j);
          if(!c.length)return false;
          if(c.length===1){s[c[0]]=1;ch=true} }
      }
      return true;
    }
    (function rec(s){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!prop(s))return;
      let i=-1; for(let j=0;j<N;j++) if(!blk[j]&&!s[j]&&near[j]){i=j;break}
      if(i<0) for(let j=0;j<N;j++) if(!blk[j]&&!s[j]){i=j;break}
      if(i<0){sols.push(Array.from(s));return}
      for(const v of [1,2]){ const t=s.slice(); t[i]=v; rec(t); if(sols.length>=limit||aborted)return; }
    })(new Int8Array(N));
    return {sols,aborted};
  }

    const n=S.n, V=views(S.puz.blk,n), L=new Uint8Array(n*n);

    return {L,V};
  }

      <text x="54" y="58" font-size="12" font-weight="800" text-anchor="middle" fill="var(--kb-ink)">1</text>
      <rect x="4" y="4" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>`,
    sizes:[6,7,8,10], defaultSize:7,
    rules:`<ol>
      <li>Coloca <b>bombillas</b> en casillas blancas. Cada una ilumina su casilla y todas las de su fila y columna hasta chocar con una casilla negra o con el borde.</li>
      <li>Todas las casillas blancas deben quedar iluminadas.</li>
      <li>Dos bombillas no pueden iluminarse entre sí.</li>
      <li>Un número en una casilla negra dice cuántas bombillas hay justo a su lado (arriba, abajo, izquierda y derecha).</li></ol>
      <ul><li>Toca una casilla: <b>bombilla</b> → <b>punto</b> (aquí no va) → vacía. Arrastra para marcar varias.</li>
      <li>Truco: un 4 lleva bombillas en sus cuatro lados, y alrededor de un 0 no hay ninguna.</li></ul>`,
    generate(n){
      const N=n*n, gm=U.geometry(n);

        for(const i of U.shuffle(U.range(N))) if(!blk[i]&&!L[i]){ sol[i]=1; L[i]=1; V[i].forEach(j=>L[j]=1); }

  });
})();

/* ================== HEYAWAKE ================== */
(()=>{
  const roomsIn=(cells,room)=>{let k=cells.length?1:0;for(let q=1;q<cells.length;q++)if(room[cells[q]]!==room[cells[q-1]])k++;return k};
  const linesOf=n=>[...U.range(n).map(r=>U.range(n).map(c=>r*n+c)),...U.range(n).map(c=>U.range(n).map(r=>r*n+c))];
  function violations(isWhite,room,n){
    const out=[];

      for(let k=0;k<=n;k++) if(k===n||!isWhite(line[k])){ const run=line.slice(s,k); if(run.length&&roomsIn(run,room)>=3) out.push(run); s=k+1; } }
    return out;
  }
  function build(n,room){
    const gm=U.geometry(n), N=n*n, sh=new Uint8Array(N);
    const can=i=>{ if(sh[i]||gm.nb[i].some(j=>sh[j]))return false; sh[i]=1; const ok=U.connected(j=>sh[j],gm); sh[i]=0; return ok; };
    for(let it=0;it<N*3;it++){
      const V=violations(i=>!sh[i],room,n); if(!V.length)break;
      let done=false;
      for(const run of U.shuffle(V)){
        const a=room[run[0]], b=room[run[run.length-1]];
        const good=run.filter((i,k)=>roomsIn(run.slice(0,k),room)<=2&&roomsIn(run.slice(k+1),room)<=2&&can(i));
        const mid=good.length?good:run.filter(i=>room[i]!==a&&room[i]!==b&&can(i));
        const cand=mid.length?mid:run.filter(can);
        if(cand.length){ sh[U.pick(cand)]=1; done=true; break; }
      }
      if(!done) return null;
    }
    if(violations(i=>!sh[i],room,n).length) return null;
    const target=N*(0.17+Math.random()*0.06); let k=sh.reduce((a,x)=>a+x,0);
    for(const i of U.shuffle(U.range(N))){ if(k>=target)break; if(can(i)){sh[i]=1;k++} }

  }
  function solve(room,num,n,limit,maxNodes){
    const gm=U.geometry(n), N=n*n, R={}, sols=[]; let nodes=0,aborted=false;
    room.forEach((r,i)=>(R[r]=R[r]||[]).push(i));
    const L=linesOf(n);
    function span(st,i,d){ // casillas blancas seguidas que se unirían a i en dirección horizontal (d=1) o vertical (d=n)
      const r=i/n|0,c=i%n, cells=[i];
      if(d===1){ for(let x=c-1;x>=0&&st[r*n+x]===1;x--)cells.unshift(r*n+x); for(let x=c+1;x<n&&st[r*n+x]===1;x++)cells.push(r*n+x); }
      else { for(let y=r-1;y>=0&&st[y*n+c]===1;y--)cells.unshift(y*n+c); for(let y=r+1;y<n&&st[y*n+c]===1;y++)cells.push(y*n+c); }
      return cells;
    }
    function prop(st){
      let ch=true;

        for(let i=0;i<N;i++) if(st[i]===2) for(const j of gm.nb[i]){ if(st[j]===2)return false; if(!st[j]){st[j]=1;ch=true} }
        for(const r in R){ const t=num[R[r][0]]; if(t<0)continue; let b=0,u=0; for(const i of R[r]){ if(st[i]===2)b++; else if(!st[i])u++; }
          if(b>t||b+u<t)return false;
          if(u&&b===t){R[r].forEach(i=>{if(!st[i])st[i]=1});ch=true} else if(u&&b+u===t){R[r].forEach(i=>{if(!st[i])st[i]=2});ch=true} }
        for(const line of L){ let s=0; for(let k=0;k<=n;k++) if(k===n||st[line[k]]!==1){ const run=line.slice(s,k); if(run.length>2&&roomsIn(run,room)>=3)return false; s=k+1; } }
        for(let i=0;i<N;i++) if(!st[i]&&(roomsIn(span(st,i,1),room)>=3||roomsIn(span(st,i,n),room)>=3)){st[i]=2;ch=true}
        if(!U.connected(j=>st[j]===2,gm))return false;
        if(ch)continue;
        // una casilla cuya negra partiría las blancas tiene que ser blanca
        for(let i=0;i<N;i++) if(!st[i]){ st[i]=2; const ok=U.connected(j=>st[j]===2,gm); st[i]=0; if(!ok){st[i]=1;ch=true} }
      }
      return true;
    }
    (function rec(st){

      let i=-1, bu=99;
      for(const r in R){ if(num[R[r][0]]<0)continue; const u=R[r].filter(j=>!st[j]); if(u.length&&u.length<bu){bu=u.length;i=u[0]} }

  }
  function check(S){
    const n=S.n, gm=U.geometry(n), {room,num}=S.puz, st=S.st, bad=new Set(), R={};
    room.forEach((r,i)=>(R[r]=R[r]||[]).push(i));
    for(let i=0;i<n*n;i++) if(st[i]===1) for(const j of gm.nb[i]) if(st[j]===1){bad.add(i);bad.add(j)}

  register({
    id:'heyawake', name:'Heyawake', jp:true,
    desc:'Habitaciones con su número de casillas negras, y ninguna línea blanca cruza más de dos habitaciones.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>

      <rect x="4" y="4" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>`,
    sizes:[6,7,8,9], defaultSize:7,
    rules:`<ol>
      <li>Pinta de negro algunas casillas. Un número en una <b>habitación</b> (zona de borde grueso) dice cuántas casillas negras tiene.</li>
      <li>Dos casillas negras no pueden tocarse por un lado.</li>
      <li>Todas las casillas blancas deben formar un único bloque conectado.</li>
      <li>Una línea recta de casillas blancas <b>no puede atravesar más de dos habitaciones</b> (no puede cruzar dos bordes gruesos seguidos).</li></ol>
      <ul><li>Toca una casilla: <b>negra</b> → <b>punto</b> (blanca segura) → vacía. Arrastra para pintar varias.</li></ul>`,
    generate(n){
      for(;;){
        const room=RECT.partition(n,n>=9?12:9,(w,h)=>{const a=w*h;return a===1?0.03:a===2?0.3:a===3?0.6:Math.max(w,h)>5?0.5:1}).cov;
        const sh=build(n,room); if(!sh)continue;
        const num=room.map((r,i)=>room.indexOf(r)===i?room.reduce((a,rr,j)=>a+(rr===r&&sh[j]),0):-1);
        // el número se guarda en la primera casilla de cada habitación

        const numAt=full.map((x,i)=>first[i]?x:-1), cl=U.range(n*n).map(i=>full[i]);

      }});
    },
    hint(S){ return shadeHint(S,i=>!!S.puz.sol[i],()=>false); }
  });
})();

/* ================== NORINORI ================== */
(()=>{
  function build(n){
    const gm=U.geometry(n), N=n*n, bl=new Uint8Array(N), D=Math.round(N/(4.2+Math.random()*0.8));
    let d=0;
    for(const i of U.shuffle(U.range(N))){
      if(d>=D)break; if(bl[i])continue;
      const j=U.pick(gm.nb[i]); if(bl[j])continue;
      if(gm.nb[i].some(k=>k!==j&&bl[k])||gm.nb[j].some(k=>k!==i&&bl[k]))continue;
      bl[i]=bl[j]=1; d++;
    }
    // medias regiones: una por casilla negra, que crecen por las blancas
    const half=new Int32Array(N).fill(-1), seeds=U.range(N).filter(i=>bl[i]);
    seeds.forEach((i,k)=>half[i]=k);
    let left=N-seeds.length;
    while(left){
      const f=[]; for(let i=0;i<N;i++) if(half[i]<0&&gm.nb[i].some(j=>half[j]>=0)) f.push(i);
      if(!f.length) return null;
      const i=U.pick(f); half[i]=half[U.pick(gm.nb[i].filter(j=>half[j]>=0))]; left--;
    }
    const H=seeds.length, adj=Array.from({length:H},()=>new Set());
    for(let i=0;i<N;i++) for(const j of gm.nb[i]) if(half[i]!==half[j]) adj[half[i]].add(half[j]);
    const mate=k=>{ const i=seeds[k]; return half[gm.nb[i].find(j=>bl[j])]; };
    // emparejar medias regiones vecinas (preferiblemente de parejas negras distintas)
    const out=[];
    for(let t=0;t<200&&out.length<25;t++){
      const pair=new Int32Array(H).fill(-1); let ok=true;
      const order=U.shuffle(U.range(H)).sort((a,b)=>adj[a].size-adj[b].size);
      for(const k of order){ if(pair[k]>=0)continue;
        const opts=[...adj[k]].filter(x=>pair[x]<0);
        if(!opts.length){ok=false;break}
        const other=opts.filter(x=>x!==mate(k)), x=other.length&&Math.random()<0.8?U.pick(other):U.pick(opts);
        pair[k]=x; pair[x]=k; }
      if(!ok)continue;
      const reg=Array.from(half,h=>Math.min(h,pair[h]));
      if(!out.some(o=>o.reg.join()===reg.join())) out.push({bl:Array.from(bl),reg});
    }
    return out;
  }
  function solve(reg,n,limit,maxNodes){
    const gm=U.geometry(n), N=n*n, R={}, sols=[]; let nodes=0,aborted=false;
    reg.forEach((r,i)=>(R[r]=R[r]||[]).push(i));
    function prop(st){ // 1 blanca, 2 negra
      let ch=true;
      while(ch){ ch=false;
        for(const r in R){ let b=0,u=0; for(const i of R[r]){ if(st[i]===2)b++; else if(!st[i])u++; }
          if(b>2||b+u<2)return false;
          if(u&&b===2){R[r].forEach(i=>{if(!st[i])st[i]=1});ch=true} else if(u&&b+u===2){R[r].forEach(i=>{if(!st[i])st[i]=2});ch=true} }
        for(let i=0;i<N;i++){ if(st[i]!==2)continue; let k=0; const u=[]; for(const j of gm.nb[i]){ if(st[j]===2)k++; else if(!st[j])u.push(j); }
          if(k>1)return false;
          if(k===1&&u.length){u.forEach(j=>st[j]=1);ch=true}
          if(k===0){ if(!u.length)return false; if(u.length===1){st[u[0]]=2;ch=true} } }
      }
      return true;
    }
    (function rec(st){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!prop(st))return;
      const i=st.indexOf(0);
      if(i<0){sols.push(Array.from(st));return}
      for(const v of [2,1]){ const s=st.slice(); s[i]=v; rec(s); if(sols.length>=limit||aborted)return; }
    })(new Int8Array(N));
    return {sols,aborted};
  }
  function check(S){
    const n=S.n, gm=U.geometry(n), st=S.st, bad=new Set(), R={};
    S.puz.reg.forEach((r,i)=>(R[r]=R[r]||[]).push(i));
    for(let i=0;i<n*n;i++) if(st[i]===1){ const k=gm.nb[i].filter(j=>st[j]===1).length, f=gm.nb[i].filter(j=>st[j]!==2).length; if(k>1||f===0) bad.add(i); }
    for(const r in R){ const b=R[r].filter(i=>st[i]===1).length, f=R[r].filter(i=>st[i]!==2).length; if(b>2||f<2) R[r].forEach(i=>bad.add(i)); }
    return bad;
  }
  register({
    id:'norinori', name:'Norinori', jp:true,
    desc:'Cada región lleva dos casillas negras, y las negras van siempre de dos en dos, como fichas de dominó.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <rect x="4" y="4" width="40" height="20" fill="var(--shade)"/><rect x="44" y="24" width="20" height="40" fill="var(--shade)"/><rect x="4" y="44" width="20" height="20" fill="var(--shade)"/><rect x="24" y="44" width="20" height="20" fill="var(--shade)"/>
      <path d="M4 24H44V4 M44 24V64 M4 44H44" fill="none" stroke="var(--ring)" stroke-width="2.5"/>
      <rect x="4" y="4" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2.5"/></svg>`,
    sizes:[5,6,7], defaultSize:6,
    rules:`<ol>
      <li>Cada región (zona de borde grueso) tiene exactamente <b>dos casillas negras</b>.</li>
      <li>Cada casilla negra toca por un lado a <b>exactamente otra</b> casilla negra: las negras forman parejas tipo dominó que no se tocan entre sí. Una pareja puede repartirse entre dos regiones.</li></ol>
      <ul><li>Toca una casilla: <b>negra</b> → <b>punto</b> (blanca segura) → vacía. Arrastra para pintar varias.</li>
      <li>Truco: en una región de dos casillas, las dos son negras.</li></ul>`,
    generate(n){
      for(;;){
        const L=build(n); if(!L)continue;
        for(const b of L){
          const r=solve(b.reg,n,2,8000);
          if(!r.aborted&&r.sols.length===1) return {reg:b.reg,sol:b.bl};
        }
      }
    },
    init:(puz,n)=>new Array(n*n).fill(0),
    solved(S){
      const n=S.n, gm=U.geometry(n), bl=i=>S.st[i]===1, R={};
      S.puz.reg.forEach((r,i)=>(R[r]=R[r]||[]).push(i));
      for(let i=0;i<n*n;i++) if(bl(i)&&gm.nb[i].filter(bl).length!==1)return false;
      return Object.values(R).every(c=>c.filter(bl).length===2);
    },
    render(board,S,api,flash){
      const bad=S.errs?check(S):new Set();
      SHADE.render(board,S,api,flash,{reg:S.puz.reg,cls:'nr',fixed:()=>false,cell(i){ const st=S.st[i]; return {c:'v'+st+(bad.has(i)?' e':''),h:st===2?'<span class="dt"></span>':''}; }});
    },
    hint(S){ return shadeHint(S,i=>!!S.puz.sol[i],()=>false); }
  });
})();

/* ================== YIN-YANG ================== */
(()=>{
  // colores: 1 negro, 2 blanco
  function compsOK(col,n,c,allowUnk){ // ¿las casillas de color c están conectadas (pasando por desconocidas si allowUnk)?
    const N=n*n, gm=U.geometry(n); let s=-1; for(let i=0;i<N;i++) if(col[i]===c){s=i;break}
    if(s<0) return true;
    const seen=new Uint8Array(N), q=[s]; seen[s]=1;
    while(q.length){ const a=q.pop(); for(const b of gm.nb[a]) if(!seen[b]&&(col[b]===c||(allowUnk&&!col[b]))){seen[b]=1;q.push(b)} }
    for(let i=0;i<N;i++) if(col[i]===c&&!seen[i])return false;
    return true;
  }
  const blocks=n=>{const o=[];for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++){const i=r*n+c;o.push([i,i+1,i+n+1,i+n])}return o}; // en orden circular
  const badBlock=(a,b,c,d)=>(a===b&&b===c&&c===d)||(a===c&&b===d&&a!==b);
  function build(n){
    const N=n*n, gm=U.geometry(n), col=new Int8Array(N).fill(2), B=blocks(n);
    col[Math.random()*N|0]=1;
    for(let it=0;it<N*4;it++){
      const white4=B.filter(b=>b.every(i=>col[i]===2));
      const hot=new Set(); white4.forEach(b=>b.forEach(i=>hot.add(i)));
      const cand=[];
      for(let i=0;i<N;i++){ if(col[i]!==2||!gm.nb[i].some(j=>col[j]===1))continue;
        col[i]=1;
        const ok=B.every(b=>!b.includes(i)||!badBlock(...b.map(j=>col[j])))&&compsOK(col,n,2,false);
        col[i]=2; if(ok) cand.push(i); }
      if(!cand.length) break;
      const hc=cand.filter(i=>hot.has(i));
      if(!white4.length&&Math.random()<0.6) break;
      col[U.pick(hc.length?hc:cand)]=1;
    }
    if(B.some(b=>badBlock(...b.map(j=>col[j]))))return null;
    if(!compsOK(col,n,1,false)||!compsOK(col,n,2,false))return null;
    return col;
  }
  function solve(given,n,limit,maxNodes){
    const N=n*n, gm=U.geometry(n), B=blocks(n), sols=[]; let nodes=0,aborted=false;
    function prop(s){
      let ch=true;
      while(ch){ ch=false;
        for(const b of B){ const v=b.map(i=>s[i]), u=v.filter(x=>!x).length;
          if(!u){ if(badBlock(...v))return false; continue; }
          if(u!==1)continue;
          const k=v.indexOf(0), okv=[1,2].filter(x=>{const w=v.slice();w[k]=x;return !badBlock(...w)});
          if(!okv.length)return false;
          if(okv.length===1){s[b[k]]=okv[0];ch=true} }
        if(!compsOK(s,n,1,true)||!compsOK(s,n,2,true))return false;
      }
      return true;
    }
    (function rec(s){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!prop(s))return;
      let i=-1; for(let j=0;j<N;j++) if(!s[j]&&gm.nb[j].some(k=>s[k])){i=j;break}
      if(i<0) i=s.indexOf(0);
      if(i<0){ if(compsOK(s,n,1,false)&&compsOK(s,n,2,false)) sols.push(Array.from(s)); return; }
      for(const v of [1,2]){ const t=s.slice(); t[i]=v; rec(t); if(sols.length>=limit||aborted)return; }
    })(Int8Array.from(given));
    return {sols,aborted};
  }
  register({
    id:'yinyang', name:'Yin-Yang', jp:true,
    desc:'Llena todo de fichas blancas y negras: cada color forma un solo grupo y no hay cuadrados de 2×2 iguales.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      ${[[1,1,1],[2,2,1],[1,2,2]].map((row,r)=>row.map((x,c)=>`<circle cx="${14+c*20}" cy="${14+r*20}" r="7.5" fill="${x===1?'var(--ink)':'var(--card)'}" stroke="var(--ink)" stroke-width="2"/>`).join('')).join('')}</svg>`,
    sizes:[6,7,8,9,10], defaultSize:7,
    rules:`<ol>
      <li>Pon una ficha <b>negra</b> o <b>blanca</b> en cada casilla.</li>
      <li>Todas las negras deben estar conectadas entre sí por los lados, y lo mismo las blancas.</li>
      <li>No puede haber ningún cuadrado de <b>2×2</b> del mismo color.</li></ol>
      <ul><li>Toca una casilla: <b>negra</b> → <b>blanca</b> → vacía. Arrastra para poner varias iguales.</li>
      <li>Las fichas con fondo sombreado vienen dadas.</li>
      <li>Truco: en un 2×2 no puede quedar un «tablero de ajedrez» (negras y blancas en diagonal), porque cortaría uno de los dos grupos.</li></ul>`,
    generate(n){
      for(;;){
        const col=build(n); if(!col)continue;
        const g=Array.from(col), t0=performance.now();
        for(const i of U.shuffle(U.range(n*n))){
          if(performance.now()-t0>3000)break;
          const k=g[i]; g[i]=0; const r=solve(g,n,2,4000);
          if(r.aborted||r.sols.length!==1) g[i]=k;
        }
        const r=solve(g,n,2,30000); if(r.aborted||r.sols.length!==1)continue;
        return {clue:g,sol:Array.from(col)};
      }
    },
    init:(puz)=>puz.clue.slice(),
    solved(S){
      const n=S.n; if(S.st.some(x=>!x))return false;
      if(blocks(n).some(b=>badBlock(...b.map(j=>S.st[j]))))return false;
      return compsOK(S.st,n,1,false)&&compsOK(S.st,n,2,false);
    },
    render(board,S,api,flash){
      const n=S.n, bad=new Set();
      if(S.errs) for(const b of blocks(n)){ const v=b.map(j=>S.st[j]); if(v.every(x=>x)&&badBlock(...v)) b.forEach(j=>bad.add(j)); }
      SHADE.render(board,S,api,flash,{cls:'yy',fixed:i=>!!S.puz.clue[i],cell(i){ return {c:'v'+S.st[i]+(S.puz.clue[i]?' k':'')+(bad.has(i)?' e':'')}; }});
    },
    hint(S){
      const {sol,clue}=S.puz, N=S.n*S.n;
      const wrong=U.range(N).filter(i=>S.st[i]&&S.st[i]!==sol[i]);
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:'Esta ficha estaba mal'}; }
      const open=U.range(N).filter(i=>!S.st[i]);
      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=sol[i];
      return {i,msg:'Aquí va una ficha '+(sol[i]===1?'negra':'blanca')};
    }
  });
})();

/* ================== SUKORO ================== */
(()=>{
  // s: 0 ?, 1 con número, 2 vacía
  function solve(g,n,limit,maxNodes,random){
    const N=n*n, gm=U.geometry(n), sols=[]; let nodes=0,aborted=false;
    const bounds=(s,i)=>{let lo=0,hi=0;for(const j of gm.nb[i]){if(s[j]===1){lo++;hi++}else if(!s[j])hi++}return [lo,hi]};
    function conn(s,strict){
      let st=-1; for(let i=0;i<N;i++) if(s[i]===1){st=i;break}
      if(st<0) return true;
      const seen=new Uint8Array(N),q=[st]; seen[st]=1;
      while(q.length){const a=q.pop(); for(const b of gm.nb[a]) if(!seen[b]&&(s[b]===1||(!strict&&!s[b]))){seen[b]=1;q.push(b)}}
      for(let i=0;i<N;i++) if(s[i]===1&&!seen[i])return false;
      return true;
    }
    function prop(s){
      let ch=true;
      while(ch){ ch=false;
        for(let i=0;i<N;i++){ if(s[i]!==1)continue; const [lo,hi]=bounds(s,i);
          if(hi<1)return false;
          const t=g[i]>0?g[i]:0;
          if(t){ if(lo>t||hi<t)return false;
            if(hi>lo&&lo===t){gm.nb[i].forEach(j=>{if(!s[j])s[j]=2});ch=true}
            else if(hi>lo&&hi===t){gm.nb[i].forEach(j=>{if(!s[j])s[j]=1});ch=true} }
          else if(lo===0&&hi===1){gm.nb[i].forEach(j=>{if(!s[j])s[j]=1});ch=true}
          if(lo===hi) for(const j of gm.nb[i]) if(s[j]===1){ const [l2,h2]=bounds(s,j); if(l2===h2&&l2===lo)return false; } }
        if(!conn(s,false))return false;
      }
      return true;
    }
    (function rec(s){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!prop(s))return;
      let i=-1; for(let j=0;j<N;j++) if(!s[j]&&gm.nb[j].some(k=>s[k]===1)){i=j;break}
      if(i<0) i=s.indexOf(0);
      if(i<0){ if(conn(s,true)&&s.some(x=>x===1)) sols.push(U.range(N).map(j=>s[j]===1?bounds(s,j)[0]:0)); return; }
      const order=random?(Math.random()<0.6?[1,2]:[2,1]):[1,2];
      for(const v of order){ const t=s.slice(); t[i]=v; rec(t); if(sols.length>=limit||aborted)return; }
    })(Int8Array.from(g,x=>x>0?1:x<0?2:0));

  }

      if(k>v[i]) bad.add(i);
      for(const j of gm.nb[i]) if(v[j]===v[i]){bad.add(i);bad.add(j)} }
    return bad;
  }
  const ui=NUMS.ui({k:()=>4, borders:()=>[], bad:check, peers:S=>U.geometry(S.n).nb,
    hint(S){
      const {sol}=S.puz, N=S.n*S.n;
      const wrong=U.range(N).filter(i=>S.st[i]>0&&S.st[i]!==sol[i]);
      if(wrong.length){ const i=U.pick(wrong); S.st[i]=0; return {i,msg:sol[i]?'Este número estaba mal':'Esta casilla va vacía'}; }
      const open=U.range(N).filter(i=>sol[i]&&S.st[i]!==sol[i]);
      if(!open.length) return null;
      const i=U.pick(open); S.st[i]=sol[i];
      return {i,msg:'Aquí va un '+sol[i]};
    }});
  register({
    id:'sukoro', name:'Sukoro', jp:true,
    desc:'Cada número dice cuántas casillas vecinas tienen número; los números forman un solo grupo.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <g font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">${[[1,0,0],[3,2,1],[1,0,0]].map((row,r)=>row.map((x,c)=>x?`<text x="${14+c*20}" y="${19+r*20}">${x}</text>`:'').join('')).join('')}</g>
      <path d="M4 24H64M4 44H64M24 4V64M44 4V64" stroke="var(--line)" stroke-width="1.5"/>
      <rect x="4" y="4" width="60" height="60" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>`,
    sizes:[5,6,7,8], defaultSize:6,
    rules:`<ol>
      <li>Escribe números del 1 al 4 en algunas casillas; el resto se queda vacío.</li>
      <li>Cada número dice cuántas de sus casillas vecinas (arriba, abajo, izquierda y derecha) tienen número.</li>
      <li>Dos números iguales no pueden tocarse por un lado.</li>
      <li>Todas las casillas con número deben formar un único grupo conectado.</li></ol>
      <ul><li>Elige un número abajo y toca una casilla. Tocarla con el mismo número la borra; ⌫ es la goma.</li>

    generate(n){

      <li><b>+</b> es un cuadrado, <b>—</b> un rectángulo más ancho que alto y <b>|</b> uno más alto que ancho.</li>
      <li>En ningún punto pueden coincidir las esquinas de <b>cuatro rectángulos</b>.</li></ol>
      <ul><li><b>Arrastra</b> de una esquina a la opuesta para dibujar un rectángulo. Si pisa otros, los sustituye.</li>
      <li>Toca un rectángulo para borrarlo. Tocar una casilla vacía crea un cuadrado de 1×1.</li></ul>`,
    generate(n){

      for(const code of codes){ const R=dec(code,n); h+=`<rect class="ro" x="${R.c}" y="${R.r}" width="${R.w}" height="${R.h}"/>`; }
      if(S.errs) for(let r=1;r<n;r++)for(let c=1;c<n;c++){ const a=[st[(r-1)*n+c-1],st[(r-1)*n+c],st[r*n+c-1],st[r*n+c]]; if(a.every(x=>x)&&new Set(a).size===4) h+=`<circle class="bad" cx="${c}" cy="${r}" r=".14"/>`; }
      if(drag&&drag.moved){ const R=drag.rect(); h+=`<rect class="pv" x="${R.c}" y="${R.r}" width="${R.w}" height="${R.h}"/>`; }
      for(let i=0;i<n*n;i++) if(clues[i]) h+=`<text class="cl" x="${i%n+.5}" y="${(i/n|0)+.5}">${SYM[clues[i]]}</text>`;
      board.className='board sk tb';
      board.innerHTML='<div class="gen">Generando…</div>'+h+'<rect class="fr" x="0" y="0" width="'+n+'" height="'+n+'"/></svg>';
      const cellAt=e=>{const r=board.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*n),y=Math.floor((e.clientY-r.top)/r.height*n);return [Math.max(0,Math.min(n-1,y)),Math.max(0,Math.min(n-1,x))]};

      board.onpointerdown=e=>{ const S2=api.S; if(!S2||S2.won)return; e.preventDefault(); try{board.setPointerCapture(e.pointerId)}catch(_){}
        const a=cellAt(e); drag={a,cur:a,moved:false,rect(){const [r1,c1]=this.a,[r2,c2]=this.cur;return {r:Math.min(r1,r2),c:Math.min(c1,c2),h:Math.abs(r1-r2)+1,w:Math.abs(c1-c2)+1}}}; };

        const R=g.rect(), i=g.a[0]*n+g.a[1]; api.pushUndo();

})();

/* ================== TENTAISHO (GALAXIAS) ================== */
(()=>{
  // centros en medias unidades: (y,x) entre 0 y 2n; la casilla (r,c) tiene su centro en (2r+1,2c+1)
  const mirror=(i,g,n)=>{ const r=i/n|0,c=i%n, r2=g.y-r-1, c2=g.x-c-1; return r2<0||c2<0||r2>=n||c2>=n?-1:r2*n+c2; };
  const core=(g,n)=>{ const rs=g.y%2?[(g.y-1)/2]:[g.y/2-1,g.y/2], cs=g.x%2?[(g.x-1)/2]:[g.x/2-1,g.x/2]; const o=[]; for(const r of rs)for(const c of cs)o.push(r*n+c); return o; };
  function build(n){
    const N=n*n, gm=U.geometry(n), gal=new Int32Array(N).fill(-1), C=[], maxS=n<=6?8:12;
    for(const s of U.shuffle(U.range(N))){
      if(gal[s]>=0)continue;
      const r=s/n|0,c=s%n, opts=[{y:2*r+1,x:2*c+1}];
      if(c+1<n&&gal[s+1]<0) opts.push({y:2*r+1,x:2*c+2});
      if(r+1<n&&gal[s+n]<0) opts.push({y:2*r+2,x:2*c+1});
      if(r+1<n&&c+1<n&&gal[s+1]<0&&gal[s+n]<0&&gal[s+n+1]<0) opts.push({y:2*r+2,x:2*c+2});
      const g=U.pick(opts), id=C.length; C.push(g);
      const cells=core(g,n); cells.forEach(i=>gal[i]=id);
      const target=2+Math.random()*(maxS-2)|0;
      while(cells.length<target){
        const f=[]; for(const a of cells) for(const b of gm.nb[a]){ if(gal[b]>=0)continue; const m=mirror(b,g,n); if(m>=0&&gal[m]<0&&!f.includes(b)) f.push(b); }
        if(!f.length)break;
        const b=U.pick(f), m=mirror(b,g,n); gal[b]=id; gal[m]=id; cells.push(b); if(m!==b) cells.push(m);
      }
    }
    return {C,gal:Array.from(gal)};
  }
  function solve(C,n,limit,maxNodes){
    const N=n*n, G=C.length, gm=U.geometry(n), sols=[]; let nodes=0,aborted=false;
    const D0=new Uint8Array(N*G);
    for(let g=0;g<G;g++) for(let i=0;i<N;i++) if(mirror(i,C[g],n)>=0) D0[i*G+g]=1;
    C.forEach((g,k)=>core(g,n).forEach(i=>{ for(let h=0;h<G;h++) D0[i*G+h]=h===k?1:0; }));
    function prop(D){
      let ch=true;
      while(ch){ ch=false;
        for(let i=0;i<N;i++){ let cnt=0;
          for(let g=0;g<G;g++){ if(!D[i*G+g])continue; const m=mirror(i,C[g],n); if(m<0||!D[m*G+g]){D[i*G+g]=0;ch=true;continue} cnt++; }
          if(!cnt)return false; }
        for(let g=0;g<G;g++){
          const seen=new Uint8Array(N), q=core(C[g],n).slice(); q.forEach(i=>seen[i]=1);
          while(q.length){const a=q.pop(); for(const b of gm.nb[a]) if(!seen[b]&&D[b*G+g]){seen[b]=1;q.push(b)}}
          for(let i=0;i<N;i++) if(!seen[i]&&D[i*G+g]){D[i*G+g]=0;ch=true}
        }
      }
      return true;
    }
    (function rec(D){
      if(sols.length>=limit||aborted)return;
      if(++nodes>maxNodes){aborted=true;return}
      if(!prop(D))return;
      let best=-1,bc=99;
      for(let i=0;i<N;i++){ let c=0; for(let g=0;g<G;g++) c+=D[i*G+g]; if(c>1&&c<bc){bc=c;best=i;if(c===2)break} }
      if(best<0){ sols.push(U.range(N).map(i=>{for(let g=0;g<G;g++) if(D[i*G+g])return g+1})); return; }
      for(let g=0;g<G;g++){ if(!D[best*G+g])continue;
        const E=D.slice(); const m=mirror(best,C[g],n);

  }
  function regionOK(S,g){
    const n=S.n, C=S.puz.C[g-1], cs=U.range(n*n).filter(i=>S.st[i]===g);
    if(!core(C,n).every(i=>S.st[i]===g))return false;
    if(cs.some(i=>{const m=mirror(i,C,n);return m<0||S.st[m]!==g}))return false;
    const gm=U.geometry(n), seen=new Set([cs[0]]), q=[cs[0]];
    while(q.length){const a=q.pop(); for(const b of gm.nb[a]) if(S.st[b]===g&&!seen.has(b)){seen.add(b);q.push(b)}}
    return seen.size===cs.length;
  }
  let sel=0;
  register({
    id:'tentaisho', name:'Tentaisho', jp:true,
    desc:'Galaxias: divide el tablero en regiones simétricas, cada una girando alrededor de su punto.',
    icon:`<svg viewBox="0 0 68 68"><rect width="68" height="68" rx="10" fill="var(--card)" stroke="var(--line)"/>
      <path d="M4 4H44V24H24V44H4Z" fill="hsl(210 60% 85%)"/><path d="M44 4H64V64H24V44H44Z" fill="hsl(40 70% 84%)"/>
      <path d="M4 4H64V64H4Z M44 4V24H24V44H4 M24 44V64 M24 44H44V4" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="24" cy="24" r="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="44" cy="34" r="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="14" cy="54" r="4" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/></svg>`,
    sizes:[5,6,7,8,10], defaultSize:7,
    rules:`<ol>
      <li>Divide el tablero en regiones (galaxias), cada una con <b>exactamente un punto</b>.</li>
      <li>Cada galaxia es <b>simétrica respecto a su punto</b>: si la giras media vuelta alrededor de él, queda igual.</li>
      <li>Los puntos pueden estar en el centro de una casilla, en medio de un lado o en una esquina.</li></ol>
      <ul><li>Toca un <b>punto</b> para elegir su galaxia y después toca o arrastra por las casillas para pintarlas. La casilla simétrica se pinta sola.</li>
      <li>Tocar una casilla ya pintada de esa galaxia la borra (y su simétrica).</li></ul>`,
    generate(n){
      for(;;){
        const {C,gal}=build(n);
        if(C.length<n)continue;
        const r=solve(C,n,2,6000);
        if(!r.aborted&&r.sols.length===1) return {C,sol:gal.map(x=>x+1)};
      }
    },
    init:(puz,n)=>{ const st=new Array(n*n).fill(0); puz.C.forEach((g,k)=>core(g,n).forEach(i=>st[i]=k+1)); return st; },
    solved(S){ if(S.st.some(x=>!x))return false; return S.puz.C.every((_,k)=>regionOK(S,k+1)); },
    render(board,S,api,flash){
      const n=S.n, st=S.st, {C}=S.puz, fixed=new Set(); C.forEach(g=>core(g,n).forEach(i=>fixed.add(i)));
      if(sel>C.length) sel=0;
      const bad=new Set(); if(S.errs) C.forEach((_,k)=>{ if(st.includes(k+1)&&!regionOK(S,k+1)) st.forEach((x,i)=>{if(x===k+1)bad.add(i)}); });
      let h=`<svg viewBox="0 0 ${n} ${n}"><rect class="bg" x="0" y="0" width="${n}" height="${n}"/>`;
      st.forEach((g,i)=>{ if(g) h+=`<rect class="gx${bad.has(i)?' e':''}${flash===i?' h':''}" style="--h:${(g*137.5)%360}" x="${i%n}" y="${i/n|0}" width="1" height="1"/>`; });
      for(let k=1;k<n;k++) h+=`<line class="gl" x1="${k}" y1="0" x2="${k}" y2="${n}"/><line class="gl" x1="0" y1="${k}" x2="${n}" y2="${k}"/>`;
      for(let i=0;i<n*n;i++){ const r=i/n|0,c=i%n;
        if(c<n-1&&st[i]!==st[i+1]) h+=`<line class="wl" x1="${c+1}" y1="${r}" x2="${c+1}" y2="${r+1}"/>`;
        if(r<n-1&&st[i]!==st[i+n]) h+=`<line class="wl" x1="${c}" y1="${r+1}" x2="${c+1}" y2="${r+1}"/>`; }
      C.forEach((g,k)=>h+=`<circle class="dot${sel===k+1?' on':''}" cx="${g.x/2}" cy="${g.y/2}" r="${sel===k+1?.2:.15}"/>`);
      h+=`<rect class="fr" x="0" y="0" width="${n}" height="${n}"/></svg>`;
      board.className='board tn';
      board.innerHTML='<div class="gen">Generando…</div>'+h;
      const pos=e=>{const r=board.getBoundingClientRect();return [(e.clientX-r.left)/r.width*n,(e.clientY-r.top)/r.height*n]};
      const cellOf=(x,y)=>Math.min(n-1,Math.max(0,Math.floor(y)))*n+Math.min(n-1,Math.max(0,Math.floor(x)));
      const paint=(i,val)=>{ const S2=api.S; if(fixed.has(i))return false; const g=val||S2.st[i]; const m=g?mirror(i,C[g-1],n):-1;

/* ================== utilidades de lazos por centros de casilla (Yajilin, Country Road) ================== */
const LOOP=(()=>{
  const MD=[[0,1],[1,0],[0,-1],[-1,0]];
  const step=(i,d,n)=>{const r=(i/n|0)+MD[d][0],c=i%n+MD[d][1];return (r<0||c<0||r>=n||c>=n)?-1:r*n+c};
  const eid=(a,b,n)=>{ if(a>b)[a,b]=[b,a]; return b-a===1?(a/n|0)*(n-1)+a%n : n*(n-1)+a; };
  const ends=(e,n)=>{ if(e<n*(n-1)){const r=e/(n-1)|0,c=e%(n-1);const a=r*n+c;return [a,a+1]} const a=e-n*(n-1); return [a,a+n]; };
  const cache={};
  const cellE=n=>cache[n]||(cache[n]=U.range(n*n).map(i=>[0,1,2,3].map(d=>{const j=step(i,d,n);return j<0?-1:eid(i,j,n)}).filter(e=>e>=0)));
  function fromFaces(inS,n){
    const F=n-1, adj=Array.from({length:n*n},()=>[]), edge=(a,b)=>{adj[a].push(b);adj[b].push(a)};
    const f=(r,c)=>!!(r>=0&&c>=0&&r<F&&c<F&&inS[r*F+c]);
    for(let r=0;r<n;r++)for(let c=0;c<n-1;c++) if(f(r-1,c)!==f(r,c)) edge(r*n+c,r*n+c+1);
    for(let r=0;r<n-1;r++)for(let c=0;c<n;c++) if(f(r,c-1)!==f(r,c)) edge(r*n+c,(r+1)*n+c);
    let start=-1,cnt=0; for(let i=0;i<n*n;i++){ if(adj[i].length&&adj[i].length!==2)return null; if(adj[i].length){cnt++;if(start<0)start=i} }
    if(start<0)return null;
    const loop=[start]; let prev=-1,cur=start;
    for(;;){ const nx=adj[cur][0]!==prev?adj[cur][0]:adj[cur][1]; if(nx===start)break; loop.push(nx); prev=cur; cur=nx; if(loop.length>cnt)return null; }
    return loop.length===cnt?loop:null;
  }
  function random(n,lo,hi){
    const F=n-1, inS=new Uint8Array(F*F); inS[(Math.random()*F|0)*F+(Math.random()*F|0)]=1;
    const target=n*n*(lo+Math.random()*(hi-lo)); let best=inS.slice(), bl=4;
    for(let it=0;it<F*F*12;it++){
      const cand=[],thin=[]; for(let i=0;i<F*F;i++) if(!inS[i]){const r=i/F|0,c=i%F; const k=(r>0&&inS[i-F]?1:0)+(r<F-1&&inS[i+F]?1:0)+(c>0&&inS[i-1]?1:0)+(c<F-1&&inS[i+1]?1:0); if(k){cand.push(i); if(k===1)thin.push(i)}}
      if(!cand.length)break; const f=U.pick(thin.length&&Math.random()<0.75?thin:cand); inS[f]=1;
      const L=fromFaces(inS,n); if(!L){inS[f]=0;continue} if(L.length>=bl){bl=L.length;best=inS.slice()} if(L.length>=target)break;
    }
    return fromFaces(best,n);
  }
  function edgesOf(loop,n){ const E=new Array(2*n*(n-1)).fill(0); for(let k=0;k<loop.length;k++) E[eid(loop[k],loop[(k+1)%loop.length],n)]=1; return E; }

  function single(E,n){
    const CE=cellE(n), N=n*n; let start=-1,cnt=0;
    for(let i=0;i<N;i++){ const d=CE[i].reduce((a,e)=>a+(E[e]===1),0); if(d&&d!==2)return null; if(d){cnt++;if(start<0)start=i} }
    if(start<0)return null;
    const seen=new Set([start]); let prev=-1,cur=start;
    for(;;){ const e=CE[cur].find(e=>E[e]===1&&e!==prev); const [a,b]=ends(e,n); const nx=a===cur?b:a; prev=e; if(nx===start)break; if(seen.has(nx))return null; seen.add(nx); cur=nx; }
    return seen.size===cnt?seen:null;
  }
  // propagación común: grado 0 o 2 por casilla (mustVisit/mustNot opcionales) y evitar lazos cerrados antes de tiempo
  function subloops(E,n,set){
    const N=n*n, CE=cellE(n), comp=new Int32Array(N).fill(-1), info=[];
    for(let s=0;s<N;s++){ if(comp[s]>=0||!CE[s].some(e=>E[e]===1))continue;
      const k=info.length, q=[s], endp=[]; comp[s]=k; let cyc=true;
      while(q.length){ const a=q.pop(); let d=0; for(const e of CE[a]) if(E[e]===1){ d++; const [x,y]=ends(e,n), b=x===a?y:x; if(comp[b]<0){comp[b]=k;q.push(b)} } if(d===1){endp.push(a);cyc=false} }
      info.push({endp,cyc}); }
    return {info,comp};
  }
  // interacción: arrastrar dibuja, tocar cerca de un lado lo alterna (línea → ✕ → nada), tocar el centro llama a onCell
  function bind(board,api,n,off,onCell){
    const toGrid=e=>{const r=board.getBoundingClientRect();return [(e.clientX-r.left)/r.width*n,(e.clientY-r.top)/r.height*n]};
    const cellOf=(x,y)=>(x<0||y<0||x>=n||y>=n)?-1:Math.floor(y)*n+Math.floor(x);

      const n=S.n, N=n*n, {reg,num}=S.puz, E=S.st.map(x=>x===1?1:0), L=LOOP.single(E,n); if(!L)return false;
      const R=regionsOf(reg), gm=U.geometry(n);
      for(const r in R){ const v=R[r].filter(i=>L.has(i)).length; if(!v)return false; const t=num[R[r][0]]; if(t>=0&&v!==t)return false;
        let cr=0; for(let e=0;e<E.length;e++) if(E[e]){ const [a,b]=LOOP.ends(e,n); if((reg[a]==r)!==(reg[b]==r))cr++; } if(cr!==2)return false; }
      for(let i=0;i<N;i++) if(!L.has(i)) for(const j of gm.nb[i]) if(!L.has(j)&&reg[i]!==reg[j])return false;
      return true;
    },
    render(board,S,api,flash){
      const n=S.n, N=n*n, {reg,num}=S.puz, st=S.st, CE=LOOP.cellE(n);
      let h=`<svg viewBox="0 0 ${n} ${n}">`;
      for(let k=1;k<n;k++) h+=`<line class="gl" x1="${k}" y1="0" x2="${k}" y2="${n}"/><line class="gl" x1="0" y1="${k}" x2="${n}" y2="${k}"/>`;
      const R=regionsOf(reg);
      for(const r in R){ const f=R[r][0], t=num[f]; if(t<0)continue;
        const v=R[r].filter(i=>CE[i].some(e=>st[e]===1)).length;
        h+=`<text class="rn${S.errs&&v>t?' e':v===t?' ok':''}" x="${f%n+.1}" y="${(f/n|0)+.27}">${t}</text>`; }
      if(S.errs) for(let i=0;i<N;i++) if(CE[i].filter(e=>st[e]===1).length>2) h+=`<circle class="bad" cx="${i%n+.5}" cy="${(i/n|0)+.5}" r=".12"/>`;
      h+=LOOP.drawEdges(st,n,0,flash);
      for(let i=0;i<N;i++){ const r=i/n|0,c=i%n;
        if(c<n-1&&reg[i]!==reg[i+1]) h+=`<line class="wl" x1="${c+1}" y1="${r}" x2="${c+1}" y2="${r+1}"/>`;
        if(r<n-1&&reg[i]!==reg[i+n]) h+=`<line class="wl" x1="${c}" y1="${r+1}" x2="${c+1}" y2="${r+1}"/>`; }
      h+=`<rect class="fr" x="0" y="0" width="${n}" height="${n}"/>`;
      board.className='board ms cr';
      board.innerHTML='<div class="gen">Generando…</div>'+h+'</svg>';
      LOOP.bind(board,api,n,0,null);
    },
    hint(S){
      const {sol}=S.puz, M=S.st.length;
      const wrong=U.range(M).filter(e=>(S.st[e]===1&&!sol[e])||(S.st[e]===2&&sol[e]));
      if(wrong.length){ const e=U.pick(wrong); const was=S.st[e]; S.st[e]=0; return {i:e,msg:was===1?'Por aquí no pasa el circuito':'Aquí sí pasa el circuito'}; }
      const miss=U.range(M).filter(e=>sol[e]&&S.st[e]!==1);
      if(!miss.length) return null;
      const e=U.pick(miss); S.st[e]=1;
      return {i:e,msg:'El circuito pasa por aquí'};
    }
  });
})();

/* ================== marco común: portada + partida ================== */
const app=document.getElementById('app');
let cleanup=null;

function home(){
  document.title='Aenigmaton · Juegos de lógica';
  app.innerHTML=`<header class="brand"><h1>Aenigmaton</h1><span>juegos de lógica</span></header>
    <div class="home-sub">Elige un juego. Cada partida es nueva y tiene solución única.</div>
    <a class="histlink" href="#historial">📚 Puzzles resueltos <span>${(U.load('historial')||[]).length}</span></a>
    <div class="sec">De corte japonés</div><div class="cards jp"></div>
    <div class="sec">Otros juegos</div><div class="cards ot"></div>`;
  const JP=new Set(['hitori','fillomino','suguru','kakuro','nurikabe','hashi','masyu','futoshiki','lits']);
  const lists=[...GAMES].sort((a,b)=>a.name.localeCompare(b.name,'es'));
  for(const G of lists){
    const cards=app.querySelector((G.jp||JP.has(G.id))?'.cards.jp':'.cards.ot');
    const S=U.load('game-'+G.id), b=U.load('best-'+G.id)||{};
    let stat='';
    const lab=k=>{ const [m,n]=String(k).includes('-')?String(k).split('-'):[null,k]; const md=m&&G.modes&&G.modes.find(x=>x.id===m); return (md?md.short+' ':'')+(G.sizeLabel?G.sizeLabel(+n):n+'×'+n); };
    if(S&&S.puz&&!S.won) stat=`En curso: ${lab((S.mode?S.mode+'-':'')+S.n)} · ${U.fmt(S.elapsed||0)}`;
    const bests=Object.keys(b).sort().map(k=>`${lab(k)} ${U.fmt(b[k])}`).join(' · ');
    if(bests) stat+=(stat?'<br>':'')+'Mejores: '+bests;
    const a=document.createElement('a'); a.className='gcard'; a.href='#'+G.id;
    a.innerHTML=`${G.icon}<div><h2>${G.name}</h2><p>${G.desc}</p>${stat?`<div class="stat">${stat}</div>`:''}</div>`;
    cards.appendChild(a);
  }
}

function mountGame(G){
  document.title=G.name+' · Aenigmaton';
  app.innerHTML=`<header><a class="back" href="#">← Juegos</a><h1>${G.name}</h1><div class="timer">0:00</div></header>
    ${G.modes?'<div class="sizes modes"></div>':''}
    <div class="sizes main"></div>
    <div class="board busy"><div class="gen">Generando…</div></div>
    <div class="msg"></div>
    <div class="extra"></div>
    <div class="controls"><button data-a="undo">↶ Deshacer</button><button data-a="hint">💡 Pista</button><button data-a="reset">Reiniciar</button><button data-a="new">Nuevo</button></div>
    <div class="opts"><label><input type="checkbox" class="errs"> Marcar errores</label><span class="hints"></span></div>
    <details><summary>Reglas y controles</summary>${G.rules}</details>`;
  const q=s=>app.querySelector(s), board=q('.board'), msg=q('.msg'), timer=q('.timer');
  let S=U.load('game-'+G.id);
  const modeOf=id=>G.modes&&(G.modes.find(m=>m.id===id)||G.modes[0]);
  const sizesOf=id=>G.modes?modeOf(id).sizes:G.sizes;
  if(!S||!S.puz||(G.modes&&!G.modes.some(m=>m.id===S.mode))||!sizesOf(S.mode).includes(S.n)) S=null;
  let mode=S?S.mode:(G.modes?G.modes[0].id:null);
  let busy=false, msgT=null, keepMsg=false;
  const save=()=>{ if(S) U.save('game-'+G.id,S); };
  const api={
    get S(){return S},
    pushUndo(){S.undo.push(S.st.slice()); if(S.undo.length>300)S.undo.shift();},
    commit(flash){
      S.won=G.solved(S);
      if(S.won&&!S.recorded){S.recorded=true;S.record=U.best(G.id,(S.mode?S.mode+'-':'')+S.n,S.elapsed);
        const H=U.load('historial')||[];
        H.unshift({id:G.id,mode:S.mode,n:S.n,puz:S.puz,st:S.st.slice(),elapsed:S.elapsed,hints:S.hints||0,errsUsed:!!(S.errsUsed||S.errs),date:new Date().toISOString(),record:S.record});
        while(H.length>400) H.pop();
        U.save('historial',H);
        Stats.track('resuelto-'+G.id+'-'+(S.mode?S.mode+'-':'')+S.n, 'Resuelto '+G.name+' '+S.n+(S.hints?' (con pistas)':''), true);}
      draw(flash); save();
    },
    draw:()=>draw(),
    say:t=>setMsg(t)
  };
  function sizes(){
    if(G.modes){
      const me=q('.modes'); me.innerHTML='';
      for(const m of G.modes){
        const b=document.createElement('button'); b.textContent=m.label;
        if(m.id===mode)b.className='on';
        b.onclick=()=>{ if(busy)return; mode=m.id; newGame(m.defaultSize); };
        me.appendChild(b);
      }
    }
    const el=q('.sizes.main'); el.innerHTML='';
    for(const s of sizesOf(mode)){
      const b=document.createElement('button'); b.textContent=G.sizeLabel?G.sizeLabel(s):s+'×'+s;
      if(S&&s===S.n&&S.mode===(mode||undefined))b.className='on';
      b.onclick=()=>newGame(s); el.appendChild(b);
    }
  }
  function draw(flash){
    if(!S)return;
    board.style.setProperty('--n',S.n);
    G.render(board,S,api,flash);
    board.classList.toggle('won',!!S.won);
    board.classList.toggle('busy',busy);
    if(G.renderExtra) G.renderExtra(q('.extra'),S,api);
    q('.hints').textContent='Pistas: '+S.hints;
    q('.errs').checked=!!S.errs;
    timer.textContent=U.fmt(S.elapsed);
    if(S.won){msg.className='msg win';msg.textContent='¡Resuelto en '+U.fmt(S.elapsed)+(S.hints?' con '+S.hints+' pista'+(S.hints>1?'s':''):'')+'!'+(S.record?' Nuevo récord 🏆':' 🎉');}
    else if(!keepMsg){msg.className='msg';msg.textContent='';}
  }
  function setMsg(t){
    msg.className='msg'; msg.textContent=t; keepMsg=true; clearTimeout(msgT);
    msgT=setTimeout(()=>{keepMsg=false; if(S&&!S.won)msg.textContent='';},2200);
  }
  function newGame(n){
    busy=true; board.classList.add('busy');
    keepMsg=false; clearTimeout(msgT); msg.className='msg'; msg.textContent='';
    setTimeout(()=>{
      const puz=G.generate(n,mode);
      S={n,puz,st:G.init(puz,n),undo:[],elapsed:0,won:false,hints:0,errs:S?S.errs:false};
      S.errsUsed=S.errs;
      if(mode)S.mode=mode;
      Stats.track('nuevo-'+G.id+'-'+(mode?mode+'-':'')+n, 'Nuevo '+G.name+' '+n, true);
      busy=false; sizes(); draw(); save();
    },30);
  }
  q('.controls').onclick=e=>{
    const a=e.target.closest('button'); if(!a||!S||busy)return;
    const act=a.dataset.a;
    if(act==='new') return newGame(S.n);
    if(act==='undo'){ if(!S.undo.length)return; S.st=S.undo.pop(); S.won=false; S.recorded=S.recorded; api.commit(); }
    if(act==='reset'){ const fresh=G.init(S.puz,S.n); if(S.st.every((x,i)=>x===fresh[i]))return; api.pushUndo(); S.st=fresh; api.commit(); }
    if(act==='hint'){ if(S.won)return; api.pushUndo(); const r=G.hint(S); if(!r){S.undo.pop();return;} S.hints++; api.commit(r.i); if(!S.won) setMsg(r.msg); }
  };
  q('.errs').onchange=e=>{ if(!S)return; S.errs=e.target.checked; if(S.errs&&!S.won) S.errsUsed=true; draw(); save(); };
  const iv=setInterval(()=>{
    if(S&&!S.won&&!busy&&!document.hidden){ S.elapsed++; timer.textContent=U.fmt(S.elapsed); if(S.elapsed%5===0)save(); }
  },1000);
  if(S){ sizes(); draw(); } else { sizes(); newGame(G.modes?modeOf(mode).defaultSize:G.defaultSize); }
  return ()=>{ clearInterval(iv); clearTimeout(msgT); save(); };
}


function historial(){
  document.title='Resueltos · Aenigmaton';
  const H=U.load('historial')||[];
  let filtro=null, abierto=null;
  const nameOf=id=>(GAMES.find(g=>g.id===id)||{name:id}).name;
  const sizeLab=e=>{ const G=GAMES.find(g=>g.id===e.id); const md=e.mode&&G&&G.modes&&G.modes.find(m=>m.id===e.mode); return (md?md.short+' ':'')+(G&&G.sizeLabel?G.sizeLabel(e.n):e.n+'×'+e.n); };
  const fecha=d=>{ const x=new Date(d); return x.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' · '+x.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); };
  function lista(){
    abierto=null;
    const ids=[...new Set(H.map(e=>e.id))];
    const L=filtro?H.filter(e=>e.id===filtro):H;
    const limpias=L.filter(e=>!e.hints&&!e.errsUsed).length;
    app.innerHTML=`<header><a class="back" href="#">← Juegos</a><h1>Resueltos</h1><div class="timer">${L.length}</div></header>
      ${H.length?`<div class="chips"><button data-f="" class="${filtro?'':'on'}">Todos</button>${ids.map(id=>`<button data-f="${id}" class="${filtro===id?'on':''}">${nameOf(id)}</button>`).join('')}</div>
      <div class="hsum">${L.length} resuelto${L.length===1?'':'s'} · ${limpias} sin pistas ni ayuda de errores${L.length?` · tiempo medio ${U.fmt(Math.round(L.reduce((a,e)=>a+e.elapsed,0)/L.length))}`:''}</div>
      <div class="hlist">${L.map(e=>`<button class="hitem" data-k="${H.indexOf(e)}">
        <b>${nameOf(e.id)}</b><span class="hs">${sizeLab(e)}</span><span class="hd">${fecha(e.date)}</span>
        <span class="hm">⏱ ${U.fmt(e.elapsed)}${e.record?' 🏆':''}</span><span class="hm ${e.hints?'warn':''}">💡 ${e.hints}</span><span class="hm ${e.errsUsed?'warn':''}">${e.errsUsed?'⚠ errores marcados':'✓ sin marcar errores'}</span></button>`).join('')}</div>`
      :'<div class="soon">Todavía no has resuelto ningún puzzle. Cuando termines uno aparecerá aquí.</div>'}`;
    app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{filtro=b.dataset.f||null;lista();});
    app.querySelectorAll('.hitem').forEach(b=>b.onclick=()=>detalle(+b.dataset.k));
  }
  function detalle(k){
    const e=H[k], G=GAMES.find(g=>g.id===e.id); if(!G)return;
    app.innerHTML=`<header><a class="back" href="#historial">← Resueltos</a><h1>${G.name}</h1><div class="timer">${sizeLab(e)}</div></header>
      <div class="hsum">${fecha(e.date)}</div>
      <div class="board"></div>
      <div class="hstats"><div><b>${U.fmt(e.elapsed)}</b><span>tiempo${e.record?' · récord 🏆':''}</span></div><div><b>${e.hints}</b><span>pista${e.hints===1?'':'s'}</span></div><div><b>${e.errsUsed?'Sí':'No'}</b><span>marcar errores</span></div></div>
      <div class="controls two"><button data-a="again">↻ Volver a jugarlo</button><button data-a="del">🗑 Borrar del historial</button></div>`;
    const board=app.querySelector('.board');
    const S={n:e.n,mode:e.mode,puz:e.puz,st:e.st.slice(),undo:[],won:true,errs:false,hints:e.hints};
    const api={get S(){return S},pushUndo(){},commit(){},draw(){},say(){}};
    board.style.setProperty('--n',e.n);
    try{ G.render(board,S,api); }catch(err){ board.textContent='No se puede mostrar este puzzle.'; }
    board.classList.add('won'); board.style.pointerEvents='none';
    app.querySelector('[data-a=again]').onclick=()=>{
      U.save('game-'+G.id,{n:e.n,mode:e.mode,puz:e.puz,st:G.init(e.puz,e.n),undo:[],elapsed:0,won:false,hints:0,errs:false,errsUsed:false});
      location.hash='#'+G.id;
    };
    const del=app.querySelector('[data-a=del]');
    del.onclick=()=>{ if(del.dataset.sure){ H.splice(k,1); U.save('historial',H); lista(); history.replaceState(null,'','#historial'); } else { del.dataset.sure=1; del.textContent='¿Seguro? Toca otra vez'; } };
  }
  lista();
}


// migración: el juego "lanzarrayos" ahora se llama "turbolaser"
try{ for(const k of ['game-','best-']){ const v=localStorage.getItem(k+'lanzarrayos'); if(v!==null){ if(localStorage.getItem(k+'turbolaser')===null) localStorage.setItem(k+'turbolaser',v); localStorage.removeItem(k+'lanzarrayos'); } }
  const H=U.load('historial'); if(H&&H.some(e=>e.id==='lanzarrayos')){ H.forEach(e=>{if(e.id==='lanzarrayos')e.id='turbolaser'}); U.save('historial',H); }
  if(location.hash==='#lanzarrayos') history.replaceState(null,'','#turbolaser'); }catch(e){}

function route(){
  if(cleanup){cleanup();cleanup=null;}
  const id=location.hash.slice(1), G=GAMES.find(g=>g.id===id);
  if(G) cleanup=mountGame(G); else if(id==='historial') historial(); else home();
  Stats.track(G?'/'+G.id:(id==='historial'?'/resueltos':'/'), G?G.name:(id==='historial'?'Resueltos':'Portada'));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',()=>{ if(cleanup)cleanup(); });
route();
})();
